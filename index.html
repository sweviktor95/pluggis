<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pluggis</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
    background: #f7f7f9;
    color: #222;
  }
  h1 {
    text-align: center;
    color: #2f4a73;
    font-size: 2.5em;
    margin-bottom: 5px;
  }
  .undertitel {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
  }

  .startsida-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
  }
  @media (max-width: 700px) {
    .startsida-grid { grid-template-columns: 1fr; }
  }
  .amne-ruta {
    background: white;
    border: 2px solid #dde3ec;
    border-radius: 14px;
    padding: 25px 10px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }
  .amne-ruta:hover {
    transform: translateY(-3px);
    border-color: #4a6fa5;
  }
  .amne-ikon { font-size: 2.5em; display: block; margin-bottom: 8px; }
  .amne-titel { font-weight: bold; font-size: 1.1em; color: #2f4a73; }

  .knapp {
    display: block;
    width: 100%;
    padding: 16px;
    margin: 10px 0;
    background: #4a6fa5;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    text-align: left;
  }
  .knapp:hover { background: #3a5a8a; }
  .tillbaka { background: #999; margin-top: 20px; }

  .brodsmulor {
    font-size: 0.95em;
    color: #666;
    margin-bottom: 15px;
  }
  .brodsmulor span { cursor: pointer; color: #4a6fa5; }
  .brodsmulor span:hover { text-decoration: underline; }

  .bild-platshallare {
    width: 100%;
    height: 200px;
    background: #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    border-radius: 8px;
    margin: 15px 0;
  }
  canvas {
    background: white;
    border: 1px solid #ccc;
    border-radius: 8px;
    display: block;
    margin: 15px auto;
    max-width: 100%;
  }
  .slider-rad { text-align: center; margin: 10px 0; }

  .sektion {
    background: white;
    border: 1px solid #e2e6ee;
    border-radius: 10px;
    padding: 18px 20px;
    margin: 16px 0;
  }
  .sektion h3 {
    margin-top: 0;
    color: #2f4a73;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sektion-ikon { font-size: 1.3em; }
  .begrepp-box {
    background: #eef3fb;
    border-left: 4px solid #4a6fa5;
    border-radius: 6px;
    padding: 15px 20px;
    margin: 20px 0;
  }
  .begrepp-box h3 { margin-top: 0; color: #2f4a73; }
  .begrepp-box ul { margin: 0; padding-left: 20px; }
  .begrepp-box li { margin: 6px 0; }

  .kontrollfraga {
    background: #fff8ec;
    border-left: 4px solid #e0a53f;
    border-radius: 6px;
    padding: 10px 15px;
    margin: 14px 0 0 0;
  }
  .kontrollfraga p { margin: 6px 0; }
  .kontrollfraga details summary {
    cursor: pointer;
    color: #4a6fa5;
    font-weight: bold;
    margin-top: 6px;
  }

  .exit-ticket {
    background: #eefaf0;
    border: 2px dashed #5aa66b;
    border-radius: 10px;
    padding: 15px 20px;
    margin: 25px 0;
  }
  .exit-ticket h3 { margin-top: 0; color: #2f6a3f; }
  .exit-fraga { margin: 12px 0; }
  .exit-fraga details summary {
    cursor: pointer;
    color: #4a6fa5;
    font-weight: bold;
  }

  .algebra-box {
    background: white;
    border: 1px solid #e2e6ee;
    border-radius: 10px;
    padding: 20px;
    margin: 15px 0;
    text-align: center;
  }
  .algebra-uppgift { font-size: 1.8em; margin: 10px 0; }
  .algebra-svar-rad { margin: 15px 0; font-size: 1.1em; }
  .algebra-svar-rad input {
    font-size: 1.1em;
    width: 70px;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin: 0 6px;
    text-align: center;
  }
  .algebra-kolla-knapp, .algebra-ny-knapp {
    display: inline-block;
    width: auto;
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 15px;
    cursor: pointer;
  }
  .algebra-kolla-knapp { background: #4a6fa5; margin-left: 6px; }
  .algebra-kolla-knapp:hover { background: #3a5a8a; }
  .algebra-ny-knapp { background: #5aa66b; margin-top: 10px; }
  .algebra-ny-knapp:hover { background: #489058; }
  .algebra-ratt { color: #2f6a3f; font-weight: bold; }
  .algebra-fel { color: #a33; font-weight: bold; }

  .symbol-ruta {
    display: inline-block;
    background: #e0e8f5;
    border: 2px solid #4a6fa5;
    border-radius: 6px;
    padding: 2px 10px;
    font-weight: bold;
    color: #2f4a73;
  }
  .variabel-x {
    font-style: italic;
    font-family: "Times New Roman", serif;
    font-weight: bold;
    color: #2f4a73;
  }
  .berattelse-text {
    font-size: 1.2em;
    line-height: 1.6;
    text-align: left;
  }

  /* Lodrät bråkrendering: täljare/streck/nämnare, inget snedstreck */
  .brak {
    display: inline-block;
    vertical-align: middle;
    text-align: center;
    margin: 0 4px;
  }
  .brak-taljare {
    display: block;
    border-bottom: 2px solid #2f4a73;
    padding: 0 6px 2px 6px;
  }
  .brak-namnare {
    display: block;
    padding: 2px 6px 0 6px;
  }
  .stort-snedstreck {
    font-size: 1.6em;
    margin: 0 4px;
    vertical-align: middle;
    color: #2f4a73;
  }

  .jeopardy-tabell {
    width: 100%;
    border-collapse: collapse;
    margin: 15px 0;
  }
  .jeopardy-tabell th {
    background: #2f4a73;
    color: white;
    padding: 10px 6px;
    font-size: 0.9em;
  }
  .jeopardy-tabell td {
    padding: 6px;
    text-align: center;
  }
  .jeopardy-ruta {
    width: 100%;
    padding: 14px 4px;
    font-size: 1.2em;
    font-weight: bold;
    background: #4a6fa5;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .jeopardy-ruta:hover { background: #3a5a8a; }
  .jeopardy-klar {
    background: #cfd6e0;
    color: #8894a5;
    cursor: default;
  }
  .jeopardy-fraga-box {
    background: white;
    border: 1px solid #e2e6ee;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
  }
  .jeopardy-etikett {
    font-weight: bold;
    color: #2f4a73;
    font-size: 1.1em;
  }

  .abakus-rad {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin: 20px 0;
    flex-wrap: wrap;
  }
  .abakus-kolonn {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .abakus-etikett {
    font-weight: bold;
    color: #2f4a73;
    margin-bottom: 8px;
    font-size: 0.85em;
    text-align: center;
  }
  .abakus-parla {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #e2e6ee;
    border: 2px solid #b8c2d4;
    margin: 3px 0;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    color: #5a6b85;
    user-select: none;
  }
  .abakus-parla:hover { border-color: #4a6fa5; }
  .abakus-parla-fylld { background: #4a6fa5; border-color: #2f4a73; color: white; }
  .abakus-siffra {
    margin-top: 10px;
    font-size: 1.3em;
    font-weight: bold;
    color: #2f4a73;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 2px 12px;
  }
  .abakus-tal-visning {
    text-align: center;
    font-size: 1.5em;
    margin: 20px 0 10px 0;
  }
  .abakus-mal {
    text-align: center;
    font-size: 1.2em;
    color: #2f4a73;
  }
  .abakus-knapp-rad {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 8px 0 0 0;
  }
  .abakus-kol-knapp {
    display: inline-block;
    width: auto;
    padding: 5px 8px;
    font-size: 0.8em;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    background: #5aa66b;
    color: white;
    cursor: pointer;
  }
  .abakus-kol-knapp:hover { background: #489058; }
  .abakus-tips {
    text-align: center;
    font-size: 0.9em;
    color: #777;
    margin: 0 0 15px 0;
  }

  .multtabell {
    border-collapse: collapse;
    margin: 15px auto;
  }
  .multtabell th {
    background: #2f4a73;
    color: white;
    padding: 6px 4px;
    font-size: 0.85em;
    min-width: 30px;
  }
  .multtabell td { padding: 2px; }
  .multtabell-ruta {
    width: 40px;
    height: 40px;
    background: #e2e6ee;
    border: 1px solid #b8c2d4;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-weight: bold;
    color: #2f4a73;
    font-size: 9px;
    transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }
  .multtabell-ruta:hover { border-color: #4a6fa5; }
  .multtabell-ruta.multtabell-vand { font-size: 15px; }
  .tabell-highlight { background: #e0a53f !important; color: white !important; }
  .tabell-rad-highlight { box-shadow: 0 0 0 2px #ffd54f inset; }
  .multtabell-kvadrat { background: #fff3d6; border-color: #e0a53f; }
  .multtabell-vand { background: #4a6fa5; color: white; border-color: #2f4a73; }
  .multtabell-kvadrat.multtabell-vand { background: #e0a53f; color: white; border-color: #b8842a; }

  .multtabell-tom {
    background: transparent;
    border: none;
    cursor: default;
  }
  .multtabell-differens-positiv { background: #d9534f; color: white; border-color: #a94442; }
  .multtabell-differens-negativ { background: #4a7fc9; color: white; border-color: #2f5a94; }
  .multtabell-differens-noll { background: #999; color: white; border-color: #777; }
  .subtraktion-knapp-rad { text-align: center; margin-bottom: 8px; }

  .klocka-wrapper { text-align: center; }
  .klocka-svg {
    width: 100%;
    max-width: 500px;
    border-radius: 10px;
    border: 1px solid #ccc;
  }
  .klocka-slider {
    width: 100%;
    max-width: 500px;
    margin: 15px 0;
  }
  .klocka-rad {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 10px 0;
    flex-wrap: wrap;
  }
  .klocka-analog-svg { width: 120px; height: 120px; }
  .klocka-digital {
    font-size: 2.2em;
    font-weight: bold;
    color: #2f4a73;
    background: white;
    border: 2px solid #4a6fa5;
    border-radius: 10px;
    padding: 10px 20px;
    font-family: "Courier New", monospace;
  }
  .klocka-aktivitet {
    font-size: 1.3em;
    color: #2f4a73;
    font-weight: bold;
    margin-top: 10px;
  }
  .klocka-aktivitet-ikon { font-size: 1.4em; }
  .klocka-dagsdel {
    display: inline-block;
    font-size: 0.55em;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #6b7a8f;
    font-weight: normal;
    margin-bottom: 2px;
  }

  .skriv-ut-knapp {
    background: #6b7a8f;
    max-width: 260px;
    font-size: 15px;
    padding: 10px 16px;
    margin: 10px 0 0 0;
  }
  .skriv-ut-knapp:hover { background: #55606f; }

  .skriv-ut-rad {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 10px;
  }
  .lasstod-etikett {
    font-size: 15px;
    color: #444;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .lasstod-etikett input { cursor: pointer; }

  @media print {
    .knapp, .brodsmulor, .skriv-ut-rad { display: none !important; }
    canvas, .slider-rad { display: none !important; }
    .sektion, .begrepp-box, .kontrollfraga, .exit-ticket {
      break-inside: avoid;
    }
    body { margin: 0; }

    /* Fokusläge: större text och en sektion per utskriven sida */
    body.fokus-utskrift { font-size: 1.3em; line-height: 1.6; }
    body.fokus-utskrift h2 { font-size: 1.9em; }
    body.fokus-utskrift .sektion {
      page-break-after: always;
      break-after: page;
      font-size: 1.1em;
    }
    body.fokus-utskrift .sektion h3 { font-size: 1.3em; }
    body.fokus-utskrift .sektion:last-of-type {
      page-break-after: auto;
      break-after: auto;
    }
    body.fokus-utskrift .exit-ticket {
      page-break-before: always;
      break-before: page;
      font-size: 1.1em;
    }
  }
</style>
</head>
<body>

<h1>Pluggis</h1>
<p class="undertitel">Välj ett ämne för att komma igång</p>

<div id="app"></div>

<script src="innehall/struktur.js"></script>

<script src="innehall/matematik-tallinjen.js"></script>
<script src="innehall/matematik-positionssystem.js"></script>
<script src="innehall/matematik-multiplikation.js"></script>
<script src="innehall/matematik-addition.js"></script>
<script src="innehall/matematik-subtraktion.js"></script>
<script src="innehall/matematik-klockan.js"></script>
<script src="innehall/biologi-vetenskap.js"></script>
<script src="innehall/biologi-cellen.js"></script>
<script src="innehall/biologi-organ.js"></script>
<script src="innehall/matematik-intro-ekvationer.js"></script>
<script src="innehall/matematik-ekvationer.js"></script>
<script src="innehall/matematik-ak9-tallinjen.js"></script>
<script src="innehall/matematik-ak9-brak-repetition.js"></script>

<script>
  var app = document.getElementById("app");

  var nodKarta = {};
  function byggKarta(noder, parentId) {
    noder.forEach(function(n) {
      nodKarta[n.id] = { node: n, parentId: parentId };
      if (n.barn && n.barn.length > 0) {
        byggKarta(n.barn, n.id);
      }
    });
  }
  byggKarta(struktur, null);

  function hamtaSokvag(id) {
    var vag = [];
    var aktuellId = id;
    while (aktuellId) {
      vag.unshift(nodKarta[aktuellId].node);
      aktuellId = nodKarta[aktuellId].parentId;
    }
    return vag;
  }

  function renderaBrodsmulor(id) {
    var vag = hamtaSokvag(id);
    var html = '<div class="brodsmulor"><span onclick="visStartsida()">Pluggis</span>';
    vag.forEach(function(n) {
      html += ' &raquo; <span onclick="visNod(\'' + n.id + '\')">' + n.titel + '</span>';
    });
    html += '</div>';
    return html;
  }

  function visStartsida() {
    var html = '<div class="startsida-grid">';
    struktur.forEach(function(amne) {
      html += '<div class="amne-ruta" onclick="visNod(\'' + amne.id + '\')">' +
              '<span class="amne-ikon">' + (amne.ikon || "📘") + '</span>' +
              '<span class="amne-titel">' + amne.titel + '</span></div>';
    });
    html += '</div>';
    app.innerHTML = html;
  }

  function visNod(id) {
    klockaStoppaSpel(); // stoppa klockans autospel om man navigerar bort mitt i

    var entry = nodKarta[id];
    var node = entry.node;
    var harBarn = node.barn && node.barn.length > 0;

    var html = renderaBrodsmulor(id);

    if (harBarn) {
      html += "<h2>" + node.titel + "</h2>";
      node.barn.forEach(function(barn) {
        html += '<button class="knapp" onclick="visNod(\'' + barn.id + '\')">' +
                barn.titel + '</button>';
      });
    } else {
      var data = innehall[id];
      html += "<h2>" + node.titel + "</h2>";
      if (data) {
        html += '<div class="skriv-ut-rad">';
        html += '<button class="knapp skriv-ut-knapp" onclick="skrivUt()">🖨️ Skriv ut / Spara som PDF</button>';
        html += '<label class="lasstod-etikett"><input type="checkbox" id="lasvanligtKryss"> ' +
                'Lättläst utskrift: ett stycke per sida, större text</label>';
        html += '</div>';
      }
      if (data && data.sektioner) {
        // Rikare sida: intro + flera namngivna sektioner + ev. begreppsruta
        if (data.intro) { html += "<p>" + data.intro + "</p>"; }
        data.sektioner.forEach(function(sek) {
          html += '<div class="sektion">';
          html += '<h3><span class="sektion-ikon">' + sek.ikon + '</span>' + sek.titel + '</h3>';
          sek.text.forEach(function(stycke) {
            html += "<p>" + stycke + "</p>";
          });
          if (sek.bild) {
            html += '<img src="' + sek.bild + '" style="width:100%;border-radius:8px;margin:10px 0;">';
          }
          if (sek.kontrollfraga) {
            html += '<div class="kontrollfraga"><p>🤔 <strong>Kolla din förståelse:</strong> ' +
                    sek.kontrollfraga + '</p>';
            if (sek.kontrollsvar) {
              html += '<details><summary>Visa svar</summary><p>' + sek.kontrollsvar + '</p></details>';
            }
            html += '</div>';
          }
          html += '</div>';
        });
        if (data.begrepp) {
          html += '<div class="begrepp-box"><h3>📖 Bra att kunna</h3><ul>';
          data.begrepp.forEach(function(b) {
            html += '<li><strong>' + b.term + ':</strong> ' + b.forklaring + '</li>';
          });
          html += '</ul></div>';
        }
      } else if (data) {
        html += "<p>" + data.text + "</p>";
        if (data.bild) {
          html += '<img src="' + data.bild + '" style="width:100%;border-radius:8px;">';
        } else {
          html += '<div class="bild-platshallare">[Ingen bild angiven]</div>';
        }
        if (data.simulering === "linje-k-slider") {
          html += '<canvas id="ritKanvas" width="400" height="300"></canvas>';
          html += '<div class="slider-rad">k = <span id="kVarde">1</span> ' +
                  '<input type="range" id="kSlider" min="-5" max="5" step="0.5" value="1" ' +
                  'oninput="ritaLinje()"></div>';
        }
        if (data.simulering === "tallinjen-heltal-0-10") {
          html += '<canvas id="tallinjeKanvas" width="500" height="140"></canvas>';
          html += '<p style="text-align:center;" id="tallinjeText">Klicka på tallinjen för att välja ett tal.</p>';
        }
        if (data.simulering === "algebra-objekt-varde") {
          html += '<div class="algebra-box">' +
            '<p class="algebra-uppgift" id="algebraUppgift"></p>' +
            '<div class="algebra-svar-rad">Vad är <span id="algebraObjektNamn"></span> värt? ' +
            '<input type="number" id="algebraSvarInput"> ' +
            '<button class="algebra-kolla-knapp" onclick="kontrolleraAlgebraSvar()">Kolla svar</button></div>' +
            '<p id="algebraFeedback"></p>' +
            '<button class="algebra-ny-knapp" onclick="genereraAlgebraUppgift()">🔄 Ny uppgift</button>' +
            '</div>';
        }
        if (data.simulering === "abakus-positionssystem") {
          html += '<div id="abakusContainer"></div>';
        }
        if (data.simulering === "multiplikationstabell") {
          html += '<div id="multtabellContainer"></div>';
        }
        if (data.simulering === "additionstabell") {
          html += '<div id="addtabellContainer"></div>';
        }
        if (data.simulering === "subtraktionstabell") {
          html += '<div id="subtabellContainer"></div>';
        }
        if (data.simulering === "klockan-gard") {
          html += '<div class="klocka-wrapper">' +
            '<div id="klockaScen"></div>' +
            '<p id="klockaAktivitet" class="klocka-aktivitet"></p>' +
            '<input type="range" id="klockaSlider" min="0" max="1439" value="0" ' +
            'oninput="ritaKlockan()" class="klocka-slider">' +
            '<button class="algebra-ny-knapp" id="klockaSpelKnapp" onclick="klockaVaxlaSpela()">▶️ Spela upp dagen</button>' +
            '<div class="klocka-rad"><div id="klockaAnalog"></div>' +
            '<div id="klockaDigital" class="klocka-digital"></div></div>' +
            '</div>';
        }
        if (data.simulering === "jeopardy-brak") {
          html += '<div id="jeopardyContainer"><div id="jeopardyBrada"></div></div>' +
            '<button class="algebra-ny-knapp" onclick="initJeopardy()">🔄 Nytt spel</button>';
        }
        if (data.simulering === "ekvationer-berattelse-abstrakt") {
          html += '<div class="algebra-box">' +

  function ritaLinje() {
    var k = parseFloat(document.getElementById("kSlider").value);
    document.getElementById("kVarde").innerText = k;

    var canvas = document.getElementById("ritKanvas");
    var ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    var mittX = canvas.width / 2;
    var mittY = canvas.height / 2;

    ctx.strokeStyle = "#ccc";
    ctx.beginPath();
    ctx.moveTo(0, mittY); ctx.lineTo(canvas.width, mittY);
    ctx.moveTo(mittX, 0); ctx.lineTo(mittX, canvas.height);
    ctx.stroke();

    ctx.strokeStyle = "#4a6fa5";
    ctx.lineWidth = 2;
    ctx.beginPath();
    var x1 = -mittX, x2 = mittX;
    ctx.moveTo(mittX + x1, mittY - k * x1);
    ctx.lineTo(mittX + x2, mittY - k * x2);
    ctx.stroke();
  }

  // Generisk simulering: interaktiv tallinje med heltal 0-10.
  // Klicka var som helst på linjen för att välja närmaste heltal.
  // Återanvänds av vilket delmoment som helst genom att sätta
  // simulering: "tallinjen-heltal-0-10" i dess innehållsfil.
  var tallinjeValtTal = null;

  function ritaTallinje() {
    var canvas = document.getElementById("tallinjeKanvas");
    var ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    var startX = 40, endX = 460, y = 70;
    var steg = (endX - startX) / 10;

    // Själva linjen
    ctx.strokeStyle = "#4a6fa5";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(startX, y);
    ctx.lineTo(endX, y);
    ctx.stroke();

    // Skalstreck och siffror 0-10
    ctx.fillStyle = "#2f4a73";
    ctx.font = "14px Arial";
    ctx.textAlign = "center";
    for (var i = 0; i <= 10; i++) {
      var x = startX + i * steg;
      ctx.beginPath();
      ctx.moveTo(x, y - 8);
      ctx.lineTo(x, y + 8);
      ctx.stroke();
      ctx.fillText(i, x, y + 28);
    }

    // Markera valt tal, om något är valt
    if (tallinjeValtTal !== null) {
      var valdX = startX + tallinjeValtTal * steg;
      ctx.beginPath();
      ctx.arc(valdX, y, 8, 0, Math.PI * 2);
      ctx.fillStyle = "#e07a3f";
      ctx.fill();
    }
  }

  function initieraTallinje() {
    tallinjeValtTal = null;
    ritaTallinje();

    var canvas = document.getElementById("tallinjeKanvas");
    canvas.onclick = function(e) {
      var rect = canvas.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var startX = 40, endX = 460;
      var steg = (endX - startX) / 10;

      var tal = Math.round((x - startX) / steg);
      tal = Math.max(0, Math.min(10, tal));

      tallinjeValtTal = tal;
      ritaTallinje();
      document.getElementById("tallinjeText").innerText = "Du valde: " + tal;
    };
  }

  // Generisk simulering: slumpad algebrauppgift med objekt (emoji)
  // vars värde man ska lista ut utifrån en given summa.
  // Återanvänds genom att sätta simulering: "algebra-objekt-varde".
  var algebraObjekt = ["🍎", "🍌", "🍇", "🍉", "🍒", "⚽", "🎈", "🍪"];
  var algebraRattSvar = null;

  function genereraAlgebraUppgift() {
    var emoji = algebraObjekt[Math.floor(Math.random() * algebraObjekt.length)];
    var antal = Math.floor(Math.random() * 4) + 2;   // 2-5 objekt

    algebraRattSvar = varde;

    var rad = "";
    for (var i = 0; i < antal; i++) {
      rad += emoji + (i < antal - 1 ? " + " : "");

  // Tre-stegs progression för Ekvationer: samma princip (räkna ut vad ett
  // objekt är värt utifrån en summa) men med tre olika symboltyper -
  // konkreta objekt, en generisk symbol, och slutligen bokstaven x.
  var ekvRattSvar = {};

  function genereraEkvationssteg(steg) {
    var antal = Math.floor(Math.random() * 4) + 2;   // 2-5 st
    var varde = Math.floor(Math.random() * 8) + 2;   // värde 2-9
    var summa = antal * varde;
    ekvRattSvar[steg] = varde;

    if (steg === 4) {

      document.getElementById("ekvObjektNamn4").innerHTML = '<span class="variabel-x">x</span>';
      document.getElementById("ekvSvarInput4").value = "";
      document.getElementById("ekvFeedback4").innerHTML = "";
      return;
    }

    var symbol;
    if (steg === 1) {
      symbol = algebraObjekt[Math.floor(Math.random() * algebraObjekt.length)];
    } else if (steg === 2) {
      symbol = "❎";
    } else {
      symbol = '<span class="variabel-x">x</span>';
    }

    var rad = "";
    for (var i = 0; i < antal; i++) {
      rad += symbol + (i < antal - 1 ? " + " : "");
    }
    rad += " = " + summa;

    document.getElementById("ekvUppgift" + steg).innerHTML = rad;
    document.getElementById("ekvObjektNamn" + steg).innerHTML = symbol;
    document.getElementById("ekvSvarInput" + steg).value = "";
    document.getElementById("ekvFeedback" + steg).innerHTML = "";
  }

  function kontrolleraEkvationssteg(steg) {
    var input = document.getElementById("ekvSvarInput" + steg);
    var svar = parseInt(input.value, 10);
    var feedback = document.getElementById("ekvFeedback" + steg);

    if (isNaN(svar)) {
      feedback.innerHTML = '<span class="algebra-fel">Skriv ett tal i rutan.</span>';

    } else {
      feedback.innerHTML = '<span class="algebra-fel">❌ Inte riktigt. Testa igen!</span>';
    }
  }

  // Berättelseuppgifter: slumpar fram en kedja på 1-2 räknesteg (av alla
  // fyra räknesätten) utifrån ett okänt tal, och formulerar det som text.
  // Garanterar att inget mellansteg blir negativt eller ger ett brutet tal.
  var berattelseRattSvar = null;
  var opNamn = { add: "adderas", sub: "subtraheras", mul: "multipliceras", div: "delas" };

  function slumpaBerattelsekedja() {
    for (var forsok = 0; forsok < 30; forsok++) {
      var start = Math.floor(Math.random() * 16) + 2;   // 2-17
      var antalSteg = Math.random() < 0.5 ? 1 : 2;
      var steg = [];
      var varde = start;
      var giltig = true;

      for (var i = 0; i < antalSteg; i++) {
        var opTyp = Math.floor(Math.random() * 4);
        var tal, ny, typ;

        if (opTyp === 0) {
          tal = Math.floor(Math.random() * 10) + 1;
          ny = varde + tal;
          typ = "add";
        } else if (opTyp === 1) {
          tal = Math.floor(Math.random() * 10) + 1;
          ny = varde - tal;
          if (ny < 0) { giltig = false; break; }
          typ = "sub";
        } else if (opTyp === 2) {
          tal = Math.floor(Math.random() * 4) + 2; // 2-5
          ny = varde * tal;
          typ = "mul";
        } else {
          var divisorer = [];
          for (var d = 2; d <= 10; d++) {
            if (varde % d === 0) { divisorer.push(d); }
          }
          if (divisorer.length === 0) { giltig = false; break; }
          tal = divisorer[Math.floor(Math.random() * divisorer.length)];
          ny = varde / tal;
          typ = "div";
        }

        steg.push({ typ: typ, tal: tal });
        varde = ny;
      }

      if (giltig && varde !== start) {
        return { start: start, steg: steg, resultat: varde };
      }
    }
    // Osannolik reservuppgift ifall inget lyckades
    return { start: 10, steg: [{ typ: "add", tal: 5 }], resultat: 15 };
  }

  function genereraBerattelseuppgift() {
    var uppgift = slumpaBerattelsekedja();
    berattelseRattSvar = uppgift.start;

    var text = "Jag tänker på ett tal. Talet " + opNamn[uppgift.steg[0].typ] +
                " med " + uppgift.steg[0].tal + ".";
    if (uppgift.steg[1]) {
      text += " Talet " + opNamn[uppgift.steg[1].typ] + " sedan med " + uppgift.steg[1].tal + ".";
    }

    document.getElementById("berattelseText").innerText = text;
    document.getElementById("berattelseSvarInput").value = "";
    document.getElementById("berattelseFeedback").innerHTML = "";
  }

  // Abstrakta ekvationer: en riktig ekvation med enbart tal och bokstäver,
  // t.ex. "2x + 3 = 11" eller "4x - 5 = 7". Löser man ut x?
  var abstraktRattSvar = null;

  function genereraAbstraktEkvation() {
    var a = Math.floor(Math.random() * 5) + 2;    // koefficient 2-6
    var x = Math.floor(Math.random() * 9) + 1;   // svaret 1-9
    var b = Math.floor(Math.random() * 10) + 1;   // konstant 1-10
    var plus = Math.random() < 0.5;
    var c, text;

    if (plus) {
      c = a * x + b;
      text = a + '<span class="variabel-x">x</span> + ' + b + ' = ' + c;
    } else {
      c = a * x - b;
      text = a + '<span class="variabel-x">x</span> - ' + b + ' = ' + c;
    }

    abstraktRattSvar = x;
    document.getElementById("abstraktUppgift").innerHTML = text;
    document.getElementById("abstraktSvarInput").value = "";
    document.getElementById("abstraktFeedback").innerHTML = "";
  }

  function kontrolleraAbstraktSvar() {

    var svar = parseInt(input.value, 10);
    var feedback = document.getElementById("abstraktFeedback");

    } else {

    }
  }

  // ===== Abakus: Positionssystemet =====
  var abakusKolumner = ["Tusental", "Hundratal", "Tiotal", "Ental"];
  var abakusVarden = [0, 0, 0, 0];
  var abakusMalTal = null;

  function initAbakus() {
    abakusVarden = [0, 0, 0, 0];
    abakusMalTal = null;
    ritaAbakus();
  }

  function abakusKlick(kolonn, position) {
    if (abakusVarden[kolonn] === position) {
      abakusVarden[kolonn] = position - 1;
    } else {
      abakusVarden[kolonn] = position;
    }
    ritaAbakus();
  }

  function abakusNollstall() {
    abakusVarden = [0, 0, 0, 0];
    ritaAbakus();
  }

  function abakusAndraTal(delta) {
    var tal = abakusVarden[0] * 1000 + abakusVarden[1] * 100 + abakusVarden[2] * 10 + abakusVarden[3];
    tal += delta;
    if (tal < 0) { tal = 0; }
    if (tal > 9999) { tal = 9999; }
    abakusVarden[0] = Math.floor(tal / 1000) % 10;
    abakusVarden[1] = Math.floor(tal / 100) % 10;
    abakusVarden[2] = Math.floor(tal / 10) % 10;
    abakusVarden[3] = tal % 10;
    ritaAbakus();
  }

  function abakusNyttMaltal() {
    abakusMalTal = Math.floor(Math.random() * 9000) + 1000; // 1000-9999
    abakusVarden = [0, 0, 0, 0];
    ritaAbakus();
  }

  function abakusAvslutaOvning() {
    abakusMalTal = null;
    ritaAbakus();
  }

  function ritaAbakus() {
    var html = '<div class="abakus-rad">';
    abakusKolumner.forEach(function(kol, ki) {
      var varde = Math.pow(10, 3 - ki); // 1000, 100, 10, 1
      html += '<div class="abakus-kolonn"><div class="abakus-etikett">' + kol + '</div>';
      for (var p = 9; p >= 1; p--) {
        var fylld = (p <= abakusVarden[ki]);
        html += '<div class="abakus-parla' + (fylld ? ' abakus-parla-fylld' : '') +
                '" onclick="abakusKlick(' + ki + ',' + p + ')">' + p + '</div>';
      }
      html += '<div class="abakus-siffra">' + abakusVarden[ki] + '</div>';
      html += '<div class="abakus-knapp-rad">' +
              '<button class="abakus-kol-knapp" onclick="abakusAndraTal(-' + varde + ')">−' + varde + '</button>' +
              '<button class="abakus-kol-knapp" onclick="abakusAndraTal(' + varde + ')">+' + varde + '</button>' +
              '</div>';
      html += '</div>';
    });
    html += '</div>';

    var tal = abakusVarden[0] * 1000 + abakusVarden[1] * 100 + abakusVarden[2] * 10 + abakusVarden[3];
    html += '<p class="abakus-tal-visning">Talet är: <strong>' + tal + '</strong></p>';
    html += '<p class="abakus-tips">Tips: piltangenterna ↑ / → lägger till 1, ↓ / ← drar ifrån 1.</p>';

    if (abakusMalTal !== null) {
      html += '<p class="abakus-mal">🎯 Bygg talet: <strong>' + abakusMalTal + '</strong></p>';
      if (tal === abakusMalTal) {
        html += '<p class="algebra-ratt">✅ Rätt! Bra jobbat.</p>';
      }
      html += '<button class="algebra-ny-knapp" onclick="abakusNyttMaltal()">🔄 Nytt tal att bygga</button> ';
      html += '<button class="algebra-ny-knapp" onclick="abakusAvslutaOvning()">↩️ Fri utforskning</button>';
    } else {
      html += '<button class="algebra-ny-knapp" onclick="abakusNollstall()">🔄 Nollställ</button> ';
      html += '<button class="algebra-ny-knapp" onclick="abakusNyttMaltal()">🎯 Öva: bygg ett tal</button>';
    }

    document.getElementById("abakusContainer").innerHTML = html;
  }

  // Piltangenter styr abakusen (bara aktivt när abakus-sidan visas -
  // kollar om #abakusContainer finns i DOM:en just nu).
  document.addEventListener("keydown", function(e) {
    var container = document.getElementById("abakusContainer");
    if (!container) { return; }

    if (e.key === "ArrowUp" || e.key === "ArrowRight") {
      e.preventDefault();
      abakusAndraTal(1);
    } else if (e.key === "ArrowDown" || e.key === "ArrowLeft") {
      e.preventDefault();
      abakusAndraTal(-1);
    }
  });

  // ===== Multiplikationstabell (Montessori-bräde) =====
  // Delad hjälpfunktion: highlightar rad- och kolumnrubrik, samt en "L-formad"
  // linje av rutor från första kolumnen/raden fram till den man hovrar -
  // enklare att följa än att lysa upp hela raden/kolumnen.
  function tabellHighlight(prefix, rad, kol, pa) {
    var radRubrik = document.getElementById(prefix + "-radrubrik-" + rad);
    var kolRubrik = document.getElementById(prefix + "-kolrubrik-" + kol);
    if (radRubrik) { radRubrik.classList[pa ? "add" : "remove"]("tabell-highlight"); }
    if (kolRubrik) { kolRubrik.classList[pa ? "add" : "remove"]("tabell-highlight"); }
    for (var i = 1; i <= kol; i++) {
      var radCell = document.getElementById(prefix + "-" + rad + "-" + i);
      if (radCell) { radCell.classList[pa ? "add" : "remove"]("tabell-rad-highlight"); }
    }
    for (var j = 1; j <= rad; j++) {
      var kolCell = document.getElementById(prefix + "-" + j + "-" + kol);
      if (kolCell) { kolCell.classList[pa ? "add" : "remove"]("tabell-rad-highlight"); }
    }
  }

  function ritaMultiplikationstabell() {
    var html = '<table class="multtabell"><thead><tr><th>×</th>';
    for (var k = 1; k <= 10; k++) {
      html += '<th id="mult-kolrubrik-' + k + '">' + k + "</th>";
    }
    html += "</tr></thead><tbody>";
    for (var r = 1; r <= 10; r++) {
      html += '<tr><th id="mult-radrubrik-' + r + '">' + r + "</th>";
      for (var kol = 1; kol <= 10; kol++) {
        var kvadrat = (r === kol);
        html += '<td><div class="multtabell-ruta' + (kvadrat ? " multtabell-kvadrat" : "") +
                '" id="mult-' + r + "-" + kol +
                '" onclick="vandMultRuta(' + r + ',' + kol + ')" ' +
                'onmouseenter="tabellHighlight(\'mult\',' + r + ',' + kol + ',true)" ' +
                'onmouseleave="tabellHighlight(\'mult\',' + r + ',' + kol + ',false)">' +
                r + "×" + kol + "</div></td>";
      }
      html += "</tr>";
    }
    html += "</tbody></table>";
    html += '<button class="algebra-ny-knapp" onclick="dolAllaMultRutor()">🙈 Dölj alla</button>';
    document.getElementById("multtabellContainer").innerHTML = html;
  }

  function vandMultRuta(rad, kol) {
    var cell = document.getElementById("mult-" + rad + "-" + kol);
    var nuVand = cell.classList.contains("multtabell-vand");
    if (nuVand) {
      cell.classList.remove("multtabell-vand");
      cell.innerHTML = rad + "×" + kol;
    } else {
      cell.classList.add("multtabell-vand");
      cell.innerHTML = rad * kol;
    }
  }

  function dolAllaMultRutor() {
    for (var r = 1; r <= 10; r++) {
      for (var k = 1; k <= 10; k++) {
        var cell = document.getElementById("mult-" + r + "-" + k);
        cell.classList.remove("multtabell-vand");
        cell.innerHTML = r + "×" + k;
      }
    }
  }

  // ===== Additionstabell (samma bräde-mönster, ingen diagonal-highlight) =====
  function ritaAdditionstabell() {
    var html = '<table class="multtabell"><thead><tr><th>+</th>';
    for (var k = 1; k <= 10; k++) {
      html += '<th id="add-kolrubrik-' + k + '">' + k + "</th>";

    html += "</tr></thead><tbody>";
    for (var r = 1; r <= 10; r++) {
      html += '<tr><th id="add-radrubrik-' + r + '">' + r + "</th>";

                '" onclick="vandAddRuta(' + r + ',' + kol + ')" ' +
                'onmouseenter="tabellHighlight(\'add\',' + r + ',' + kol + ',true)" ' +

  function vandAddRuta(rad, kol) {
    var cell = document.getElementById("add-" + rad + "-" + kol);

    if (nuVand) {
      cell.classList.remove("multtabell-vand");

    } else {
      cell.classList.add("multtabell-vand");

  function dolAllaAddRutor() {
    for (var r = 1; r <= 10; r++) {
      for (var k = 1; k <= 10; k++) {

  // ===== Subtraktionstabell: två lägen - bara positiva, eller med negativa tal =====
  var subtraktionVisaNegativa = false;

  function ritaSubtraktionstabell() {
    var html = '<div class="subtraktion-knapp-rad"><button class="algebra-ny-knapp" onclick="vaxlaSubtraktionNegativa()">' +
                (subtraktionVisaNegativa ? "🔒 Visa bara positiva tal" : "➖ Visa även negativa tal") +
                "</button></div>";
    html += '<table class="multtabell"><thead><tr><th>−</th>';
    for (var k = 1; k <= 10; k++) {
      html += '<th id="sub-kolrubrik-' + k + '">' + k + "</th>";
    }
    html += "</tr></thead><tbody>";
    // Rad och kolumn börjar båda på 1 (som i addition/multiplikation).
    // Beräkningen är kolumn-rad (värdet i översta raden minus värdet i
    // vänstra kolumnen) - det gör att de positiva svaren hamnar upptill.
    for (var r = 1; r <= 10; r++) {
      html += '<tr><th id="sub-radrubrik-' + r + '">' + r + "</th>";
      for (var kol = 1; kol <= 10; kol++) {
        var diff = kol - r;
        if (!subtraktionVisaNegativa && diff < 0) {
          html += '<td><div class="multtabell-ruta multtabell-tom"></div></td>';
        } else {
          html += '<td><div class="multtabell-ruta" id="sub-' + r + "-" + kol +
                  '" onclick="vandSubRuta(' + r + ',' + kol + ')" ' +
                  'onmouseenter="tabellHighlight(\'sub\',' + r + ',' + kol + ',true)" ' +
                  'onmouseleave="tabellHighlight(\'sub\',' + r + ',' + kol + ',false)">' +
                  kol + "−" + r + "</div></td>";
        }
      }
      html += "</tr>";
    }
    html += "</tbody></table>";
    html += '<button class="algebra-ny-knapp" onclick="dolAllaSubRutor()">🙈 Dölj alla</button>';
    document.getElementById("subtabellContainer").innerHTML = html;
  }

  function vandSubRuta(rad, kol) {
    var cell = document.getElementById("sub-" + rad + "-" + kol);
    var nuVand = cell.classList.contains("multtabell-vand");
    if (nuVand) {
      cell.classList.remove("multtabell-vand", "multtabell-differens-positiv",
                             "multtabell-differens-negativ", "multtabell-differens-noll");
      cell.innerHTML = kol + "−" + rad;
    } else {
      var diff = kol - rad;
      cell.classList.add("multtabell-vand");
      var visatSvar;
      if (diff > 0) {
        cell.classList.add("multtabell-differens-positiv");
        visatSvar = subtraktionVisaNegativa ? ("+" + diff) : diff;
      } else if (diff < 0) {
        cell.classList.add("multtabell-differens-negativ");
        visatSvar = diff;
      } else {
        cell.classList.add("multtabell-differens-noll");
        visatSvar = diff;
      }
      cell.innerHTML = visatSvar;
    }
  }

  function dolAllaSubRutor() {
    for (var r = 1; r <= 10; r++) {
      for (var k = 1; k <= 10; k++) {
        var cell = document.getElementById("sub-" + r + "-" + k);
        if (cell) {
          cell.classList.remove("multtabell-vand", "multtabell-differens-positiv",
                                 "multtabell-differens-negativ", "multtabell-differens-noll");
          cell.innerHTML = k + "−" + r;
        }
      }
    }
  }

  function vaxlaSubtraktionNegativa() {
    subtraktionVisaNegativa = !subtraktionVisaNegativa;
    ritaSubtraktionstabell();
  }

  // ===== Klockan: gårdsscen som följer dygnet =====
  var klockaHimmelKeyframes = [
    { t: 0, farg: [11, 26, 51] },      // 00:00 natt
    { t: 300, farg: [11, 26, 51] },    // 05:00 fortfarande natt
    { t: 360, farg: [255, 158, 94] },  // 06:00 gryning, orange
    { t: 420, farg: [135, 206, 235] }, // 07:00 helt ljust
    { t: 1080, farg: [135, 206, 235] },// 18:00 fortfarande ljust
    { t: 1140, farg: [255, 140, 90] }, // 19:00 solnedgång, orange
    { t: 1260, farg: [11, 26, 51] },   // 21:00 helt mörkt
    { t: 1439, farg: [11, 26, 51] }
  ];

  var klockaDagsdelar = [
    { start: 0, slut: 6 * 60, text: "Natt" },
    { start: 6 * 60, slut: 9 * 60, text: "Morgon" },
    { start: 9 * 60, slut: 12 * 60, text: "Förmiddag" },
    { start: 12 * 60, slut: 18 * 60, text: "Eftermiddag" },
    { start: 18 * 60, slut: 22 * 60, text: "Kväll" },
    { start: 22 * 60, slut: 1440, text: "Natt" }
  ];

  function klockaHittaDagsdel(t) {
    for (var i = 0; i < klockaDagsdelar.length; i++) {
      if (t >= klockaDagsdelar[i].start && t < klockaDagsdelar[i].slut) {
        return klockaDagsdelar[i];
      }
    }
    return klockaDagsdelar[0];
  }

  var klockaAktiviteter = [
    { start: 0, slut: 6 * 60, text: "Natt - alla sover", ikon: "🌙" },
    { start: 6 * 60, slut: 11 * 60, text: "Det är morgon - dags för skola och jobb", ikon: "🌅" },
    { start: 11 * 60, slut: 12 * 60, text: "Dags för lunch", ikon: "🍽️" },
    { start: 12 * 60, slut: 13 * 60, text: "Skoldagen och arbetsdagen fortsätter", ikon: "📚" },
    { start: 13 * 60, slut: 15 * 60, text: "Dags att runda av skola och jobb", ikon: "🎒" },
    { start: 15 * 60, slut: 17 * 60, text: "Åker hem från skola och jobb", ikon: "🚗" },
    { start: 17 * 60, slut: 18 * 60, text: "Middagsdags", ikon: "🍽️" },
    { start: 18 * 60, slut: 19 * 60, text: "Mysig kväll", ikon: "🌆" },
    { start: 19 * 60, slut: 20 * 60, text: "Fritidsaktiviteter", ikon: "⚽" },
    { start: 20 * 60, slut: 22 * 60, text: "Lugn kväll", ikon: "📺" },
    { start: 22 * 60, slut: 23 * 60, text: "Dags att lägga sig", ikon: "😴" },
    { start: 23 * 60, slut: 1440, text: "Natt - alla sover", ikon: "🌙" }
  ];

  function klockaInterpoleraFarg(t, keyframes) {
    for (var i = 0; i < keyframes.length - 1; i++) {
      if (t >= keyframes[i].t && t <= keyframes[i + 1].t) {
        var span = keyframes[i + 1].t - keyframes[i].t;
        var andel = span === 0 ? 0 : (t - keyframes[i].t) / span;
        var f1 = keyframes[i].farg, f2 = keyframes[i + 1].farg;
        var r = Math.round(f1[0] + (f2[0] - f1[0]) * andel);
        var g = Math.round(f1[1] + (f2[1] - f1[1]) * andel);
        var b = Math.round(f1[2] + (f2[2] - f1[2]) * andel);
        return "rgb(" + r + "," + g + "," + b + ")";
      }
    }
    return "rgb(11,26,51)";
  }

  function klockaHittaAktivitet(t) {
    for (var i = 0; i < klockaAktiviteter.length; i++) {
      if (t >= klockaAktiviteter[i].start && t < klockaAktiviteter[i].slut) {
        return klockaAktiviteter[i];
      }
    }
    return klockaAktiviteter[0];
  }

  function klockaPad(n) { return n < 10 ? "0" + n : "" + n; }

  // ----- Play/pause: spelar upp hela dygnet automatiskt -----
  var klockaSpelar = false;
  var klockaIntervallId = null;

  function klockaVaxlaSpela() {
    klockaSpelar = !klockaSpelar;
    if (klockaSpelar) {
      klockaIntervallId = setInterval(function() {
        var slider = document.getElementById("klockaSlider");
        if (!slider) { klockaStoppaSpel(); return; }
        var nytt = (parseInt(slider.value, 10) + 5) % 1440;
        slider.value = nytt;
        ritaKlockan();
      }, 100);
    } else {
      if (klockaIntervallId !== null) {
        clearInterval(klockaIntervallId);
        klockaIntervallId = null;
      }
    }
    var knapp = document.getElementById("klockaSpelKnapp");
    if (knapp) { knapp.innerHTML = klockaSpelar ? "⏸️ Pausa" : "▶️ Spela upp dagen"; }
  }

  function klockaStoppaSpel() {
    if (klockaIntervallId !== null) {
      clearInterval(klockaIntervallId);
      klockaIntervallId = null;
    }
    klockaSpelar = false;
  }

  // Litet plus-mat-ikon (tallrik med ångstrimmor) - återanvänds för lunch och middag.
  function klockaMatIkon(x, y) {
    return '<ellipse cx="' + x + '" cy="' + y + '" rx="14" ry="5" fill="white" stroke="#b8c2d4"/>' +
           '<path d="M' + (x - 6) + ' ' + (y - 8) + ' q3 -8 0 -14" stroke="#ddd" stroke-width="2" fill="none"/>' +
           '<path d="M' + x + ' ' + (y - 8) + ' q3 -8 0 -14" stroke="#ddd" stroke-width="2" fill="none"/>' +
           '<path d="M' + (x + 6) + ' ' + (y - 8) + ' q3 -8 0 -14" stroke="#ddd" stroke-width="2" fill="none"/>';
  }

  function ritaKlockan() {
    var slider = document.getElementById("klockaSlider");
    var t = parseInt(slider.value, 10);
    var timmar = Math.floor(t / 60);
    var minuter = t % 60;

    // ----- Himmel -----
    var himmelFarg = klockaInterpoleraFarg(t, klockaHimmelKeyframes);

    // ----- Sol: synlig 06:00-19:00, arc över himlen -----
    var solStart = 360, solSlut = 1140;
    var solOpacity = 0, solX = 0, solY = 0;
    if (t >= solStart && t <= solSlut) {
      var andelSol = (t - solStart) / (solSlut - solStart);
      solX = 40 + andelSol * 370;
      solY = 170 - Math.sin(andelSol * Math.PI) * 140;
      solOpacity = 1;
    }

    // ----- Måne: synlig 19:00-06:00 (över midnatt) -----
    var manOpacity = 0, manX = 0, manY = 0;
    if (t >= 1140 || t <= 360) {
      var natTid = (t >= 1140) ? (t - 1140) : (t + 1440 - 1140);
      var andelMan = natTid / (1440 - 1140 + 360);
      manX = 40 + andelMan * 370;
      manY = 170 - Math.sin(andelMan * Math.PI) * 140;
      manOpacity = 1;
    }
    var stjarnOpacity = manOpacity * 0.8;

    // ----- Bilen: kör till skolan 07:00-08:00, parkerad där till 15:00,
    // kör hem igen 15:00-17:00, annars parkerad hemma -----
    var hemX = 225, skolaX = 415, bilY = 208;
    var bilX;
    if (t < 420) { bilX = hemX; }
    else if (t < 480) { bilX = hemX + (skolaX - hemX) * ((t - 420) / 60); }
    else if (t < 900) { bilX = skolaX; }
    else if (t < 1020) { bilX = skolaX + (hemX - skolaX) * ((t - 900) / 120); }
    else { bilX = hemX; }

    // ----- Mat: lunch 11-12, middag 17-18 -----
    var visaMat = (t >= 11 * 60 && t < 12 * 60) || (t >= 17 * 60 && t < 18 * 60);

    // ----- Fotboll: 19-20 -----
    var visaFotboll = (t >= 19 * 60 && t < 20 * 60);

    // ----- Fönsterljus: tänt 19-22, släckt övrig tid -----
    var ljusTant = (t >= 19 * 60 && t < 22 * 60);
    var fonsterFarg = ljusTant ? "#ffe89b" : "#3a4a5a";
    var fonsterGlod = ljusTant ? 0.5 : 0;

    var svgScen = '<svg viewBox="0 0 450 250" class="klocka-svg">' +
      '<rect x="0" y="0" width="450" height="190" fill="' + himmelFarg + '"/>' +
      '<circle cx="60" cy="30" r="1.5" fill="white" opacity="' + stjarnOpacity + '"/>' +
      '<circle cx="120" cy="50" r="1" fill="white" opacity="' + stjarnOpacity + '"/>' +
      '<circle cx="200" cy="25" r="1.5" fill="white" opacity="' + stjarnOpacity + '"/>' +
      '<circle cx="260" cy="60" r="1" fill="white" opacity="' + stjarnOpacity + '"/>' +
      '<circle cx="330" cy="35" r="1.5" fill="white" opacity="' + stjarnOpacity + '"/>' +
      '<circle cx="400" cy="70" r="1" fill="white" opacity="' + stjarnOpacity + '"/>' +
      '<circle cx="' + solX + '" cy="' + solY + '" r="22" fill="#ffdb58" opacity="' + solOpacity + '"/>' +
      '<circle cx="' + solX + '" cy="' + solY + '" r="30" fill="#ffdb58" opacity="' + (solOpacity * 0.25) + '"/>' +
      '<circle cx="' + manX + '" cy="' + manY + '" r="16" fill="#e6e6e6" opacity="' + manOpacity + '"/>' +
      '<circle cx="' + (manX - 5) + '" cy="' + (manY - 4) + '" r="3" fill="#c9c9c9" opacity="' + manOpacity + '"/>' +
      '<circle cx="' + (manX + 4) + '" cy="' + (manY + 5) + '" r="2" fill="#c9c9c9" opacity="' + manOpacity + '"/>' +
      '<rect x="0" y="190" width="450" height="60" fill="#7ab648"/>' +

      // Höghus (längst till vänster)
      '<rect x="10" y="90" width="45" height="100" fill="#8a93a3"/>' +
      '<rect x="18" y="100" width="10" height="10" fill="#ffe89b" opacity="' + (ljusTant ? 1 : 0.3) + '"/>' +
      '<rect x="35" y="100" width="10" height="10" fill="#ffe89b" opacity="' + (ljusTant ? 1 : 0.3) + '"/>' +
      '<rect x="18" y="120" width="10" height="10" fill="#ffe89b" opacity="' + (ljusTant ? 0.3 : 1) + '"/>' +
      '<rect x="35" y="120" width="10" height="10" fill="#ffe89b" opacity="' + (ljusTant ? 1 : 0.3) + '"/>' +
      '<rect x="18" y="140" width="10" height="10" fill="#ffe89b" opacity="0.4"/>' +
      '<rect x="35" y="140" width="10" height="10" fill="#ffe89b" opacity="' + (ljusTant ? 1 : 0.3) + '"/>' +
      '<rect x="18" y="160" width="10" height="10" fill="#ffe89b" opacity="0.4"/>' +
      '<rect x="35" y="160" width="10" height="10" fill="#ffe89b" opacity="0.4"/>' +

      // Träd
      '<rect x="80" y="160" width="10" height="30" fill="#6b4423"/>' +
      '<circle cx="85" cy="150" r="22" fill="#4c8c3f"/>' +

      // Hem/lada
      '<polygon points="195,150 235,120 275,150" fill="#7a2e1e"/>' +
      '<rect x="200" y="150" width="70" height="50" fill="#b5432e"/>' +
      '<rect x="225" y="170" width="20" height="30" fill="#5a3420"/>' +
      '<circle cx="' + (215 - 5) + '" cy="165" r="9" fill="' + fonsterGlod + '" opacity="' + fonsterGlod + '"/>' +
      '<rect x="208" y="160" width="14" height="14" fill="' + fonsterFarg + '" stroke="#5a3420" stroke-width="1.5"/>' +

      // Bil
      '<g transform="translate(' + bilX + ',' + bilY + ')">' +
      '<rect x="-18" y="-10" width="36" height="14" rx="3" fill="#c0392b"/>' +
      '<rect x="-10" y="-18" width="18" height="10" rx="2" fill="#c0392b"/>' +
      '<circle cx="-10" cy="4" r="5" fill="#333"/>' +
      '<circle cx="10" cy="4" r="5" fill="#333"/>' +
      "</g>" +

      // Skola (längst till höger, med klocka på fasaden)
      '<rect x="380" y="110" width="65" height="80" fill="#d9a441"/>' +
      '<polygon points="375,110 412,85 450,110" fill="#a3702a"/>' +
      '<rect x="405" y="150" width="16" height="40" fill="#5a3420"/>' +
      '<circle cx="412" cy="130" r="10" fill="white" stroke="#2f4a73" stroke-width="2"/>' +
      '<line x1="412" y1="130" x2="412" y2="124" stroke="#2f4a73" stroke-width="1.5"/>' +
      '<line x1="412" y1="130" x2="417" y2="130" stroke="#2f4a73" stroke-width="1.5"/>' +

      // Mat (lunch/middag)
      (visaMat ? klockaMatIkon(140, 210) : "") +

      // Fotboll (studsande via SVG-animation) + en dansare bredvid
      (visaFotboll ?
        '<circle cx="140" cy="200" r="7" fill="white" stroke="#333" stroke-width="1">' +
        '<animate attributeName="cy" values="200;188;200" dur="0.7s" repeatCount="indefinite"/>' +
        "</circle>" +
        '<polygon points="132,215 148,215 145,222 135,222" fill="none" stroke="#eee" stroke-width="2"/>' +
        '<g transform="translate(175,205)">' +
        '<g>' +
        '<circle cx="0" cy="-18" r="5" fill="#e0a53f"/>' +
        '<line x1="0" y1="-13" x2="0" y2="0" stroke="#e0a53f" stroke-width="3"/>' +
        '<line x1="0" y1="-8" x2="-8" y2="-14" stroke="#e0a53f" stroke-width="2"/>' +
        '<line x1="0" y1="-8" x2="8" y2="-14" stroke="#e0a53f" stroke-width="2"/>' +
        '<line x1="0" y1="0" x2="-6" y2="10" stroke="#e0a53f" stroke-width="2"/>' +
        '<line x1="0" y1="0" x2="6" y2="10" stroke="#e0a53f" stroke-width="2"/>' +
        '<animateTransform attributeName="transform" type="rotate" ' +
        'values="-18 0 0;18 0 0;-18 0 0" dur="0.6s" repeatCount="indefinite"/>' +
        "</g></g>"
        : "") +

      "</svg>";

    document.getElementById("klockaScen").innerHTML = svgScen;

    // ----- Analog klocka -----
    var timVinkel = ((timmar % 12) + minuter / 60) * 30;
    var minVinkel = minuter * 6;

    var siffror = "";
    for (var i = 1; i <= 12; i++) {
      var vinkelRad = (i * 30 - 90) * (Math.PI / 180);
      var sx = 60 + 44 * Math.cos(vinkelRad);
      var sy = 60 + 44 * Math.sin(vinkelRad);
      siffror += '<text x="' + sx + '" y="' + (sy + 4) + '" text-anchor="middle" ' +
                 'font-size="10" fill="#2f4a73">' + i + "</text>";
    }

    var svgAnalog = '<svg viewBox="0 0 120 120" class="klocka-analog-svg">' +
      '<circle cx="60" cy="60" r="55" fill="white" stroke="#2f4a73" stroke-width="3"/>' +
      siffror +
      '<line x1="60" y1="60" x2="60" y2="32" stroke="#2f4a73" stroke-width="4" stroke-linecap="round" ' +
      'transform="rotate(' + timVinkel + ' 60 60)"/>' +
      '<line x1="60" y1="60" x2="60" y2="20" stroke="#4a6fa5" stroke-width="3" stroke-linecap="round" ' +
      'transform="rotate(' + minVinkel + ' 60 60)"/>' +
      '<circle cx="60" cy="60" r="4" fill="#2f4a73"/>' +
      "</svg>";

    document.getElementById("klockaAnalog").innerHTML = svgAnalog;
    document.getElementById("klockaDigital").innerText = klockaPad(timmar) + ":" + klockaPad(minuter);

    var aktivitet = klockaHittaAktivitet(t);
    var dagsdel = klockaHittaDagsdel(t);
    document.getElementById("klockaAktivitet").innerHTML =
      '<span class="klocka-dagsdel">' + dagsdel.text + '</span><br>' +
      '<span class="klocka-aktivitet-ikon">' + aktivitet.ikon + "</span> " + aktivitet.text;
  }

  // Piltangenter styr klockan: vänster/höger = 1 minut, upp/ner = 1 timme.
  // Aktivt bara när #klockaSlider finns i DOM:en (klock-sidan visas).
  document.addEventListener("keydown", function(e) {
    var slider = document.getElementById("klockaSlider");
    if (!slider) { return; }

    var steg = 0;
    if (e.key === "ArrowRight") { steg = 1; }
    else if (e.key === "ArrowLeft") { steg = -1; }
    else if (e.key === "ArrowUp") { steg = 60; }
    else if (e.key === "ArrowDown") { steg = -60; }
    else { return; }

    e.preventDefault();
    var nytt = ((parseInt(slider.value, 10) + steg) % 1440 + 1440) % 1440;
    slider.value = nytt;
    ritaKlockan();
  });

  // ===== Jeopardy: Repetition bråk =====
  // Hjälpfunktioner för bråkräkning och lodrät bråkrendering.
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function storstaGemensammaNamnare(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { var t = b; b = a % b; a = t; }
    return a || 1;
  }
  function forenklaBrak(taljare, namnare) {
    var g = storstaGemensammaNamnare(taljare, namnare);
    return { taljare: taljare / g, namnare: namnare / g };
  }
  // Lodrät bråkrendering: täljare ovanpå, streck, nämnare under - inget snedstreck.
  function brakHTML(t, n) {
    return '<span class="brak"><span class="brak-taljare">' + t +
           '</span><span class="brak-namnare">' + n + '</span></span>';
  }

  var jeopardyKategorier = ["Förlänga och förkorta", "Addition och subtraktion", "Multiplikation", "Division"];
  var jeopardyPoangLista = [100, 200, 300, 400, 500];

  // 4 kategorier x 5 svårighetsgrader (100-500p), ökande svårighet i varje rad.
  var jeopardyGeneratorer = [
    // Kategori 0: Förlänga och förkorta
    [
      function() {
        var a = randInt(1, 4), b = randInt(a + 1, 6), k = randInt(2, 4);
        var malNamnare = b * k, ratt = a * k;
        return { fraga: "Förläng bråket " + brakHTML(a, b) + " så att nämnaren blir " + malNamnare +
                 ". Vad blir täljaren?", svarTyp: "heltal", ratt: ratt };
      },
      function() {
        var a0 = randInt(1, 4), b0 = randInt(a0 + 1, 6), k = randInt(2, 4);
        var a = a0 * k, b = b0 * k;
        return { fraga: "Förkorta bråket " + brakHTML(a, b) + " genom att dela täljare och nämnare med " +
                 k + ". Vad blir täljaren?", svarTyp: "heltal", ratt: a0 };
      },
      function() {
        var a0 = randInt(2, 6), b0 = randInt(a0 + 1, 9), k = randInt(2, 5);
        var a = a0 * k, b = b0 * k;
        return { fraga: "Förkorta bråket " + brakHTML(a, b) + " genom att dela med " + k +
                 ". Skriv svaret som ett bråk.", svarTyp: "brak", ratt: { taljare: a0, namnare: b0 } };
      },
      function() {
        var a0 = randInt(3, 9), b0 = randInt(a0 + 1, 12), k = randInt(3, 6);
        var a = a0 * k, b = b0 * k;
        return { fraga: "Förkorta bråket " + brakHTML(a, b) + " genom att dela med " + k +
                 ". Skriv svaret som ett bråk.", svarTyp: "brak", ratt: { taljare: a0, namnare: b0 } };
      },
      function() {
        var a0, b0, forsok = 0;
        do { a0 = randInt(2, 9); b0 = randInt(a0 + 1, 12); forsok++; }
        while (storstaGemensammaNamnare(a0, b0) !== 1 && forsok < 30);
        var m = randInt(2, 6);
        var a = a0 * m, b = b0 * m;
        return { fraga: "Skriv bråket " + brakHTML(a, b) + " i enklaste form.",
                 svarTyp: "brak", ratt: { taljare: a0, namnare: b0 } };
      }
    ],
    // Kategori 1: Addition och subtraktion
    [
      function() {
        var n = randInt(4, 8), a = randInt(1, n - 2), b = randInt(1, Math.max(1, n - 1 - a));
        return { fraga: brakHTML(a, n) + " + " + brakHTML(b, n) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(a + b, n) };
      },
      function() {
        var n = randInt(4, 10), a = randInt(2, n - 1), b = randInt(1, a - 1);
        return { fraga: brakHTML(a, n) + " - " + brakHTML(b, n) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(a - b, n) };
      },
      function() {
        var b1 = randInt(2, 5), k = randInt(2, 4), b2 = b1 * k;
        var a1 = randInt(1, b1 - 1), a2 = randInt(1, b2 - 1);
        var summa = a1 * k + a2;
        return { fraga: brakHTML(a1, b1) + " + " + brakHTML(a2, b2) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(summa, b2) };
      },
      function() {
        var b1, b2, forsok = 0;
        do { b1 = randInt(3, 8); b2 = randInt(3, 8); forsok++; }
        while ((b1 === b2 || b1 % b2 === 0 || b2 % b1 === 0) && forsok < 30);
        var g = storstaGemensammaNamnare(b1, b2), lcm = b1 * b2 / g;
        var a1 = randInt(1, b1 - 1), a2 = randInt(1, b2 - 1);
        var n1 = a1 * (lcm / b1), n2 = a2 * (lcm / b2);
        return { fraga: brakHTML(a1, b1) + " + " + brakHTML(a2, b2) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(n1 + n2, lcm) };
      },
      function() {
        var b1, b2, forsok = 0;
        do { b1 = randInt(3, 8); b2 = randInt(3, 8); forsok++; }
        while ((b1 === b2 || b1 % b2 === 0 || b2 % b1 === 0) && forsok < 30);
        var g = storstaGemensammaNamnare(b1, b2), lcm = b1 * b2 / g;
        var a1, a2, n1, n2, forsok2 = 0;
        do {
          a1 = randInt(1, b1 - 1); a2 = randInt(1, b2 - 1);
          n1 = a1 * (lcm / b1); n2 = a2 * (lcm / b2);
          forsok2++;
        } while (n1 === n2 && forsok2 < 30);
        if (n1 < n2) {
          var tA = a1, tB = b1, tN = n1;
          a1 = a2; b1 = b2; n1 = n2;
          a2 = tA; b2 = tB; n2 = tN;
        }
        return { fraga: brakHTML(a1, b1) + " - " + brakHTML(a2, b2) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(n1 - n2, lcm) };
      }
    ],
    // Kategori 2: Multiplikation
    [
      function() {
        var a = randInt(1, 5), b = randInt(a + 1, 8), heltal = randInt(2, 5);
        return { fraga: brakHTML(a, b) + " × " + heltal + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(a * heltal, b) };
      },
      function() {
        var a = randInt(2, 7), b = randInt(a + 1, 10), heltal = randInt(3, 7);
        return { fraga: brakHTML(a, b) + " × " + heltal + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(a * heltal, b) };
      },
      function() {
        var a1 = randInt(1, 5), b1 = randInt(a1 + 1, 7), a2 = randInt(1, 5), b2 = randInt(a2 + 1, 7);
        return { fraga: brakHTML(a1, b1) + " × " + brakHTML(a2, b2) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(a1 * a2, b1 * b2) };
      },
      function() {
        var a1 = randInt(2, 8), b1 = randInt(a1 + 1, 10), a2 = randInt(2, 8), b2 = randInt(a2 + 1, 10);
        return { fraga: brakHTML(a1, b1) + " × " + brakHTML(a2, b2) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(a1 * a2, b1 * b2) };
      },
      function() {
        var a1 = randInt(3, 11), b1 = randInt(a1 + 1, 13), a2 = randInt(3, 11), b2 = randInt(a2 + 1, 13);
        return { fraga: brakHTML(a1, b1) + " × " + brakHTML(a2, b2) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(a1 * a2, b1 * b2) };
      }
    ],
    // Kategori 3: Division
    [
      function() {
        var a = randInt(1, 10), b = randInt(2, 10);
        return { fraga: a + " ÷ " + b + " = ? Skriv svaret som ett bråk i enklaste form.",
                 svarTyp: "brak", ratt: forenklaBrak(a, b) };
      },
      function() {
        var heltal = randInt(2, 6), c = randInt(1, 5), d = randInt(c + 1, 7);
        return { fraga: heltal + " ÷ " + brakHTML(c, d) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(heltal * d, c) };
      },
      function() {
        var a = randInt(1, 6), b = randInt(a + 1, 8), heltal = randInt(2, 5);
        return { fraga: brakHTML(a, b) + " ÷ " + heltal + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(a, b * heltal) };
      },
      function() {
        var a1 = randInt(1, 5), b1 = randInt(a1 + 1, 7), a2 = randInt(1, 5), b2 = randInt(a2 + 1, 7);
        return { fraga: brakHTML(a1, b1) + '<span class="stort-snedstreck">/</span>' + brakHTML(a2, b2) +
                 " = ? (svara i enklaste form)", svarTyp: "brak", ratt: forenklaBrak(a1 * b2, b1 * a2) };
      },
      function() {
        var a1 = randInt(2, 9), b1 = randInt(a1 + 1, 11), a2 = randInt(2, 9), b2 = randInt(a2 + 1, 11);
        return { fraga: brakHTML(a1, b1) + '<span class="stort-snedstreck">/</span>' + brakHTML(a2, b2) +
                 " = ? (svara i enklaste form)", svarTyp: "brak", ratt: forenklaBrak(a1 * b2, b1 * a2) };
      }
    ]
  ];

  var jeopardyData = {};

  function initJeopardy() {
    jeopardyData = {};
    jeopardyKategorier.forEach(function(kat, ki) {
      jeopardyPoangLista.forEach(function(p, ni) {
        var key = ki + "-" + p;
        var fraga = jeopardyGeneratorer[ki][ni]();
        fraga.avklarad = false;
        jeopardyData[key] = fraga;
      });
    });
    ritaJeopardyBrada();
  }

  function ritaJeopardyBrada() {
    var html = '<table class="jeopardy-tabell"><thead><tr>';
    jeopardyKategorier.forEach(function(kat) {
      html += "<th>" + kat + "</th>";
    });
    html += "</tr></thead><tbody>";
    jeopardyPoangLista.forEach(function(p) {
      html += "<tr>";
      jeopardyKategorier.forEach(function(kat, ki) {
        var key = ki + "-" + p;
        var avklarad = jeopardyData[key].avklarad;
        html += "<td>";
        if (avklarad) {
          html += '<button class="jeopardy-ruta jeopardy-klar" disabled>✔️</button>';
        } else {
          html += '<button class="jeopardy-ruta" onclick="visaJeopardyFraga(\'' + key + '\')">' + p + "</button>";
        }
        html += "</td>";
      });
      html += "</tr>";
    });
    html += "</tbody></table>";
    document.getElementById("jeopardyBrada").innerHTML = html;
  }

  function visaJeopardyFraga(key) {
    var data = jeopardyData[key];
    data.avklarad = true;

    var delar = key.split("-");
    var katIndex = parseInt(delar[0], 10);
    var poang = delar[1];

    var html = '<div class="jeopardy-fraga-box">';
    html += '<p class="jeopardy-etikett">' + poang + " poäng - " + jeopardyKategorier[katIndex] + "</p>";
    html += '<div class="algebra-uppgift">' + data.fraga + "</div>";

    if (data.svarTyp === "heltal") {
      html += '<div class="algebra-svar-rad">Svar: <input type="number" id="jeoSvarHel"> ' +
              '<button class="algebra-kolla-knapp" onclick="kontrolleraJeopardySvar(\'' + key +
              '\')">Kolla svar</button></div>';
    } else {
      html += '<div class="algebra-svar-rad">Täljare: <input type="number" id="jeoSvarTaljare"> ' +
              'Nämnare: <input type="number" id="jeoSvarNamnare"> ' +
              '<button class="algebra-kolla-knapp" onclick="kontrolleraJeopardySvar(\'' + key +
              '\')">Kolla svar</button></div>';
    }
    html += '<p id="jeoFeedback"></p>';
    html += '<button class="algebra-ny-knapp" onclick="ritaJeopardyBrada()">⬅️ Tillbaka till spelplanen</button>';
    html += "</div>";

    document.getElementById("jeopardyBrada").innerHTML = html;
  }

  function kontrolleraJeopardySvar(key) {
    var data = jeopardyData[key];
    var feedback = document.getElementById("jeoFeedback");
    var ratt = false;
    var facitText;

    if (data.svarTyp === "heltal") {
      var v = parseInt(document.getElementById("jeoSvarHel").value, 10);
      ratt = (v === data.ratt);
      facitText = data.ratt;
    } else {
      var t = parseInt(document.getElementById("jeoSvarTaljare").value, 10);
      var n = parseInt(document.getElementById("jeoSvarNamnare").value, 10);
      ratt = (t === data.ratt.taljare && n === data.ratt.namnare);
      facitText = data.ratt.taljare + "/" + data.ratt.namnare;
    }

    if (ratt) {
      feedback.innerHTML = '<span class="algebra-ratt">✅ Rätt! Bra jobbat.</span>';
    } else {
      feedback.innerHTML = '<span class="algebra-fel">❌ Inte riktigt. Rätt svar var ' + facitText + ".</span>";
    }
  }

  function skrivUt() {
    var kryss = document.getElementById("lasvanligtKryss");
    var fokuslage = kryss && kryss.checked;

    if (fokuslage) {
      document.body.classList.add("fokus-utskrift");
    }

    window.print();

    // Ta bort fokusläget igen efter utskrift/PDF-dialogen stängts,
    // så det inte påverkar den vanliga webbvisningen.
    window.onafterprint = function() {
      document.body.classList.remove("fokus-utskrift");
      window.onafterprint = null;
    };
  }

  visStartsida();
</script>

</body>
