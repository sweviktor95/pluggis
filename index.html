<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pluggis</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
    background: #f7f7f9;
    color: #222;
  }
  h1 {
    text-align: center;
    color: #2f4a73;
    font-size: 2.5em;
    margin-bottom: 5px;
  }
  .undertitel {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
  }

  .startsida-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
  }
  @media (max-width: 700px) {
    .startsida-grid { grid-template-columns: 1fr; }
  }
  .amne-ruta {
    background: white;
    border: 2px solid #dde3ec;
    border-radius: 14px;
    padding: 25px 10px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }
  .amne-ruta:hover {
    transform: translateY(-3px);
    border-color: #4a6fa5;
  }
  .amne-ikon { font-size: 2.5em; display: block; margin-bottom: 8px; }
  .amne-titel { font-weight: bold; font-size: 1.1em; color: #2f4a73; }

  .knapp {
    display: block;
    width: 100%;
    padding: 16px;
    margin: 10px 0;
    background: #4a6fa5;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    text-align: left;
  }
  .knapp:hover { background: #3a5a8a; }
  .tillbaka { background: #999; margin-top: 20px; }

  .brodsmulor {
    font-size: 0.95em;
    color: #666;
    margin-bottom: 15px;
  }
  .brodsmulor span { cursor: pointer; color: #4a6fa5; }
  .brodsmulor span:hover { text-decoration: underline; }

  .bild-platshallare {
    width: 100%;
    height: 200px;
    background: #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    border-radius: 8px;
    margin: 15px 0;
  }
  canvas {
    background: white;
    border: 1px solid #ccc;
    border-radius: 8px;
    display: block;
    margin: 15px auto;
    max-width: 100%;
  }
  .slider-rad { text-align: center; margin: 10px 0; }

  .sektion {
    background: white;
    border: 1px solid #e2e6ee;
    border-radius: 10px;
    padding: 18px 20px;
    margin: 16px 0;
  }
  .sektion h3 {
    margin-top: 0;
    color: #2f4a73;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sektion-ikon { font-size: 1.3em; }
  .begrepp-box {
    background: #eef3fb;
    border-left: 4px solid #4a6fa5;
    border-radius: 6px;
    padding: 15px 20px;
    margin: 20px 0;
  }
  .begrepp-box h3 { margin-top: 0; color: #2f4a73; }
  .begrepp-box ul { margin: 0; padding-left: 20px; }
  .begrepp-box li { margin: 6px 0; }

  .kontrollfraga {
    background: #fff8ec;
    border-left: 4px solid #e0a53f;
    border-radius: 6px;
    padding: 10px 15px;
    margin: 14px 0 0 0;
  }
  .kontrollfraga p { margin: 6px 0; }
  .kontrollfraga details summary {
    cursor: pointer;
    color: #4a6fa5;
    font-weight: bold;
    margin-top: 6px;
  }

  .exit-ticket {
    background: #eefaf0;
    border: 2px dashed #5aa66b;
    border-radius: 10px;
    padding: 15px 20px;
    margin: 25px 0;
  }
  .exit-ticket h3 { margin-top: 0; color: #2f6a3f; }
  .exit-fraga { margin: 12px 0; }
  .exit-fraga details summary {
    cursor: pointer;
    color: #4a6fa5;
    font-weight: bold;
  }

  .algebra-box {
    background: white;
    border: 1px solid #e2e6ee;
    border-radius: 10px;
    padding: 20px;
    margin: 15px 0;
    text-align: center;
  }
  .algebra-uppgift { font-size: 1.8em; margin: 10px 0; }
  .algebra-svar-rad { margin: 15px 0; font-size: 1.1em; }
  .algebra-svar-rad input {
    font-size: 1.1em;
    width: 70px;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin: 0 6px;
    text-align: center;
  }
  .algebra-kolla-knapp, .algebra-ny-knapp {
    display: inline-block;
    width: auto;
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 15px;
    cursor: pointer;
  }
  .algebra-kolla-knapp { background: #4a6fa5; margin-left: 6px; }
  .algebra-kolla-knapp:hover { background: #3a5a8a; }
  .algebra-ny-knapp { background: #5aa66b; margin-top: 10px; }
  .algebra-ny-knapp:hover { background: #489058; }
  .algebra-ratt { color: #2f6a3f; font-weight: bold; }
  .algebra-fel { color: #a33; font-weight: bold; }

  .symbol-ruta {
    display: inline-block;
    background: #e0e8f5;
    border: 2px solid #4a6fa5;
    border-radius: 6px;
    padding: 2px 10px;
    font-weight: bold;
    color: #2f4a73;
  }
  .variabel-x {
    font-style: italic;
    font-family: "Times New Roman", serif;
    font-weight: bold;
    color: #2f4a73;
  }
  .berattelse-text {
    font-size: 1.2em;
    line-height: 1.6;
    text-align: left;
  }

  /* Lodrät bråkrendering: täljare/streck/nämnare, inget snedstreck */
  .brak {
    display: inline-block;
    vertical-align: middle;
    text-align: center;
    margin: 0 4px;
  }
  .brak-taljare {
    display: block;
    border-bottom: 2px solid #2f4a73;
    padding: 0 6px 2px 6px;
  }
  .brak-namnare {
    display: block;
    padding: 2px 6px 0 6px;
  }
  .stort-snedstreck {
    font-size: 1.6em;
    margin: 0 4px;
    vertical-align: middle;
    color: #2f4a73;
  }

  .jeopardy-tabell {
    width: 100%;
    border-collapse: collapse;
    margin: 15px 0;
  }
  .jeopardy-tabell th {
    background: #2f4a73;
    color: white;
    padding: 10px 6px;
    font-size: 0.9em;
  }
  .jeopardy-tabell td {
    padding: 6px;
    text-align: center;
  }
  .jeopardy-ruta {
    width: 100%;
    padding: 14px 4px;
    font-size: 1.2em;
    font-weight: bold;
    background: #4a6fa5;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .jeopardy-ruta:hover { background: #3a5a8a; }
  .jeopardy-klar {
    background: #cfd6e0;
    color: #8894a5;
    cursor: default;
  }
  .jeopardy-fraga-box {
    background: white;
    border: 1px solid #e2e6ee;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
  }
  .jeopardy-etikett {
    font-weight: bold;
    color: #2f4a73;
    font-size: 1.1em;
  }

  .skriv-ut-knapp {
    background: #6b7a8f;
    max-width: 260px;
    font-size: 15px;
    padding: 10px 16px;
    margin: 10px 0 0 0;
  }
  .skriv-ut-knapp:hover { background: #55606f; }

  .skriv-ut-rad {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 10px;
  }
  .lasstod-etikett {
    font-size: 15px;
    color: #444;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .lasstod-etikett input { cursor: pointer; }

  @media print {
    .knapp, .brodsmulor, .skriv-ut-rad { display: none !important; }
    canvas, .slider-rad { display: none !important; }
    .sektion, .begrepp-box, .kontrollfraga, .exit-ticket {
      break-inside: avoid;
    }
    body { margin: 0; }

    /* Fokusläge: större text och en sektion per utskriven sida */
    body.fokus-utskrift { font-size: 1.3em; line-height: 1.6; }
    body.fokus-utskrift h2 { font-size: 1.9em; }
    body.fokus-utskrift .sektion {
      page-break-after: always;
      break-after: page;
      font-size: 1.1em;
    }
    body.fokus-utskrift .sektion h3 { font-size: 1.3em; }
    body.fokus-utskrift .sektion:last-of-type {
      page-break-after: auto;
      break-after: auto;
    }
    body.fokus-utskrift .exit-ticket {
      page-break-before: always;
      break-before: page;
      font-size: 1.1em;
    }
  }
</style>
</head>
<body>

<h1>Pluggis</h1>
<p class="undertitel">Välj ett ämne för att komma igång</p>

<div id="app"></div>

<script src="innehall/struktur.js"></script>

<script src="innehall/matematik-tallinjen.js"></script>
<script src="innehall/biologi-vetenskap.js"></script>
<script src="innehall/matematik-intro-ekvationer.js"></script>
<script src="innehall/matematik-ekvationer.js"></script>
<script src="innehall/matematik-ak9-tallinjen.js"></script>
<script src="innehall/matematik-ak9-brak-repetition.js"></script>

<script>
  var app = document.getElementById("app");

  var nodKarta = {};
  function byggKarta(noder, parentId) {
    noder.forEach(function(n) {
      nodKarta[n.id] = { node: n, parentId: parentId };
      if (n.barn && n.barn.length > 0) {
        byggKarta(n.barn, n.id);
      }
    });
  }
  byggKarta(struktur, null);

  function hamtaSokvag(id) {
    var vag = [];
    var aktuellId = id;
    while (aktuellId) {
      vag.unshift(nodKarta[aktuellId].node);
      aktuellId = nodKarta[aktuellId].parentId;
    }
    return vag;
  }

  function renderaBrodsmulor(id) {
    var vag = hamtaSokvag(id);
    var html = '<div class="brodsmulor"><span onclick="visStartsida()">Pluggis</span>';
    vag.forEach(function(n) {
      html += ' &raquo; <span onclick="visNod(\'' + n.id + '\')">' + n.titel + '</span>';
    });
    html += '</div>';
    return html;
  }

  function visStartsida() {
    var html = '<div class="startsida-grid">';
    struktur.forEach(function(amne) {
      html += '<div class="amne-ruta" onclick="visNod(\'' + amne.id + '\')">' +
              '<span class="amne-ikon">' + (amne.ikon || "📘") + '</span>' +
              '<span class="amne-titel">' + amne.titel + '</span></div>';
    });
    html += '</div>';
    app.innerHTML = html;
  }

  function visNod(id) {
    var entry = nodKarta[id];
    var node = entry.node;
    var harBarn = node.barn && node.barn.length > 0;

    var html = renderaBrodsmulor(id);

    if (harBarn) {
      html += "<h2>" + node.titel + "</h2>";
      node.barn.forEach(function(barn) {
        html += '<button class="knapp" onclick="visNod(\'' + barn.id + '\')">' +
                barn.titel + '</button>';
      });
    } else {
      var data = innehall[id];
      html += "<h2>" + node.titel + "</h2>";
      if (data) {
        html += '<div class="skriv-ut-rad">';
        html += '<button class="knapp skriv-ut-knapp" onclick="skrivUt()">🖨️ Skriv ut / Spara som PDF</button>';
        html += '<label class="lasstod-etikett"><input type="checkbox" id="lasvanligtKryss"> ' +
                'Lättläst utskrift: ett stycke per sida, större text</label>';
        html += '</div>';
      }
      if (data && data.sektioner) {
        // Rikare sida: intro + flera namngivna sektioner + ev. begreppsruta
        if (data.intro) { html += "<p>" + data.intro + "</p>"; }
        data.sektioner.forEach(function(sek) {
          html += '<div class="sektion">';
          html += '<h3><span class="sektion-ikon">' + sek.ikon + '</span>' + sek.titel + '</h3>';
          sek.text.forEach(function(stycke) {
            html += "<p>" + stycke + "</p>";
          });
          if (sek.bild) {
            html += '<img src="' + sek.bild + '" style="width:100%;border-radius:8px;margin:10px 0;">';
          }
          if (sek.kontrollfraga) {
            html += '<div class="kontrollfraga"><p>🤔 <strong>Kolla din förståelse:</strong> ' +
                    sek.kontrollfraga + '</p>';
            if (sek.kontrollsvar) {
              html += '<details><summary>Visa svar</summary><p>' + sek.kontrollsvar + '</p></details>';
            }
            html += '</div>';
          }
          html += '</div>';
        });
        if (data.begrepp) {
          html += '<div class="begrepp-box"><h3>📖 Bra att kunna</h3><ul>';
          data.begrepp.forEach(function(b) {
            html += '<li><strong>' + b.term + ':</strong> ' + b.forklaring + '</li>';
          });
          html += '</ul></div>';
        }
      } else if (data) {
        html += "<p>" + data.text + "</p>";
        if (data.bild) {
          html += '<img src="' + data.bild + '" style="width:100%;border-radius:8px;">';
        } else {
          html += '<div class="bild-platshallare">[Ingen bild angiven]</div>';
        }
        if (data.simulering === "linje-k-slider") {
          html += '<canvas id="ritKanvas" width="400" height="300"></canvas>';
          html += '<div class="slider-rad">k = <span id="kVarde">1</span> ' +
                  '<input type="range" id="kSlider" min="-5" max="5" step="0.5" value="1" ' +
                  'oninput="ritaLinje()"></div>';
        }
        if (data.simulering === "tallinjen-heltal-0-10") {
          html += '<canvas id="tallinjeKanvas" width="500" height="140"></canvas>';
          html += '<p style="text-align:center;" id="tallinjeText">Klicka på tallinjen för att välja ett tal.</p>';
        }
        if (data.simulering === "algebra-objekt-varde") {
          html += '<div class="algebra-box">' +
            '<p class="algebra-uppgift" id="algebraUppgift"></p>' +
            '<div class="algebra-svar-rad">Vad är <span id="algebraObjektNamn"></span> värt? ' +
            '<input type="number" id="algebraSvarInput"> ' +
            '<button class="algebra-kolla-knapp" onclick="kontrolleraAlgebraSvar()">Kolla svar</button></div>' +
            '<p id="algebraFeedback"></p>' +
            '<button class="algebra-ny-knapp" onclick="genereraAlgebraUppgift()">🔄 Ny uppgift</button>' +
            '</div>';
        }
        if (data.simulering === "jeopardy-brak") {
          html += '<div id="jeopardyContainer"><div id="jeopardyBrada"></div></div>' +
            '<button class="algebra-ny-knapp" onclick="initJeopardy()">🔄 Nytt spel</button>';
        }
        if (data.simulering === "ekvationer-berattelse-abstrakt") {
          html += '<div class="algebra-box">' +
            '<h3>Steg 1: Berättelseuppgift</h3>' +
            '<p class="berattelse-text" id="berattelseText"></p>' +
            '<div class="algebra-svar-rad">Vilket var talet? ' +
            '<input type="number" id="berattelseSvarInput"> ' +
            '<button class="algebra-kolla-knapp" onclick="kontrolleraBerattelsesvar()">Kolla svar</button></div>' +
            '<p id="berattelseFeedback"></p>' +
            '<button class="algebra-ny-knapp" onclick="genereraBerattelseuppgift()">🔄 Ny uppgift</button>' +
            '</div>';
          html += '<div class="algebra-box">' +
            '<h3>Steg 2: Ekvationer med tal och bokstäver</h3>' +
            '<p>Lös ekvationen. Vad är x värt?</p>' +
            '<p class="algebra-uppgift" id="abstraktUppgift"></p>' +
            '<div class="algebra-svar-rad">x = ' +
            '<input type="number" id="abstraktSvarInput"> ' +
            '<button class="algebra-kolla-knapp" onclick="kontrolleraAbstraktSvar()">Kolla svar</button></div>' +
            '<p id="abstraktFeedback"></p>' +
            '<button class="algebra-ny-knapp" onclick="genereraAbstraktEkvation()">🔄 Ny uppgift</button>' +
            '</div>';
        }
        if (data.simulering === "berattelseuppgift") {
          html += '<div class="algebra-box">' +
            '<p class="berattelse-text" id="berattelseText"></p>' +
            '<div class="algebra-svar-rad">Vilket var talet? ' +
            '<input type="number" id="berattelseSvarInput"> ' +
            '<button class="algebra-kolla-knapp" onclick="kontrolleraBerattelsesvar()">Kolla svar</button></div>' +
            '<p id="berattelseFeedback"></p>' +
            '<button class="algebra-ny-knapp" onclick="genereraBerattelseuppgift()">🔄 Ny uppgift</button>' +
            '</div>';
        }
        if (data.simulering === "ekvationer-tresteg") {
          var ekvSteg = [
            { nr: 1, titel: "Steg 1: Konkreta objekt",
              forklaring: "Börja med att räkna ut vad ett enda objekt är värt." },
            { nr: 2, titel: "Steg 2: En symbol istället för objekt",
              forklaring: "Samma idé, men nu använder vi en symbol istället för frukt - lite mer abstrakt." },
            { nr: 3, titel: "Steg 3: Bokstaven x - den riktiga matematiska varianten",
              forklaring: "Nu skriver vi det som man gör i vanlig algebra, med bokstaven x." },
            { nr: 4, titel: "Steg 4: Ekvationsnotation",
              forklaring: "Sista steget - nu skriver vi det som en riktig ekvation, med koefficienten direkt framför x, precis som i en vanlig matteuppgift." }
          ];
          ekvSteg.forEach(function(steg) {
            html += '<div class="algebra-box">' +
              '<h3>' + steg.titel + '</h3>' +
              '<p>' + steg.forklaring + '</p>' +
              '<p class="algebra-uppgift" id="ekvUppgift' + steg.nr + '"></p>' +
              '<div class="algebra-svar-rad">Vad är <span id="ekvObjektNamn' + steg.nr + '"></span> värt? ' +
              '<input type="number" id="ekvSvarInput' + steg.nr + '"> ' +
              '<button class="algebra-kolla-knapp" onclick="kontrolleraEkvationssteg(' + steg.nr +
              ')">Kolla svar</button></div>' +
              '<p id="ekvFeedback' + steg.nr + '"></p>' +
              '<button class="algebra-ny-knapp" onclick="genereraEkvationssteg(' + steg.nr +
              ')">🔄 Ny uppgift</button>' +
              '</div>';
          });
        }
      } else {
        html += "<p><em>Inget innehåll skrivet för det här momentet än.</em></p>";
      }

      if (data && data.exitTicket) {
        html += '<div class="exit-ticket"><h3>🎫 Exit ticket</h3>' +
                '<p>Innan du går vidare - se om du kan svara på det här:</p>';
        data.exitTicket.forEach(function(fraga, i) {
          html += '<div class="exit-fraga"><p>' + (i + 1) + '. ' + fraga.fraga + '</p>';
          if (fraga.svar) {
            html += '<details><summary>Visa svar</summary><p>' + fraga.svar + '</p></details>';
          }
          html += '</div>';
        });
        html += '</div>';
      }
    }

    html += '<button class="knapp tillbaka" onclick="' +
            (entry.parentId ? "visNod('" + entry.parentId + "')" : "visStartsida()") +
            '">Tillbaka</button>';

    app.innerHTML = html;

    if (!harBarn && innehall[id] && innehall[id].simulering === "linje-k-slider") {
      ritaLinje();
    }
    if (!harBarn && innehall[id] && innehall[id].simulering === "tallinjen-heltal-0-10") {
      initieraTallinje();
    }
    if (!harBarn && innehall[id] && innehall[id].simulering === "algebra-objekt-varde") {
      genereraAlgebraUppgift();
    }
    if (!harBarn && innehall[id] && innehall[id].simulering === "berattelseuppgift") {
      genereraBerattelseuppgift();
    }
    if (!harBarn && innehall[id] && innehall[id].simulering === "ekvationer-berattelse-abstrakt") {
      genereraBerattelseuppgift();
      genereraAbstraktEkvation();
    }
    if (!harBarn && innehall[id] && innehall[id].simulering === "jeopardy-brak") {
      initJeopardy();
    }
    if (!harBarn && innehall[id] && innehall[id].simulering === "ekvationer-tresteg") {
      genereraEkvationssteg(1);
      genereraEkvationssteg(2);
      genereraEkvationssteg(3);
      genereraEkvationssteg(4);
    }
  }

  function ritaLinje() {
    var k = parseFloat(document.getElementById("kSlider").value);
    document.getElementById("kVarde").innerText = k;

    var canvas = document.getElementById("ritKanvas");
    var ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    var mittX = canvas.width / 2;
    var mittY = canvas.height / 2;

    ctx.strokeStyle = "#ccc";
    ctx.beginPath();
    ctx.moveTo(0, mittY); ctx.lineTo(canvas.width, mittY);
    ctx.moveTo(mittX, 0); ctx.lineTo(mittX, canvas.height);
    ctx.stroke();

    ctx.strokeStyle = "#4a6fa5";
    ctx.lineWidth = 2;
    ctx.beginPath();
    var x1 = -mittX, x2 = mittX;
    ctx.moveTo(mittX + x1, mittY - k * x1);
    ctx.lineTo(mittX + x2, mittY - k * x2);
    ctx.stroke();
  }

  // Generisk simulering: interaktiv tallinje med heltal 0-10.
  // Klicka var som helst på linjen för att välja närmaste heltal.
  // Återanvänds av vilket delmoment som helst genom att sätta
  // simulering: "tallinjen-heltal-0-10" i dess innehållsfil.
  var tallinjeValtTal = null;

  function ritaTallinje() {
    var canvas = document.getElementById("tallinjeKanvas");
    var ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    var startX = 40, endX = 460, y = 70;
    var steg = (endX - startX) / 10;

    // Själva linjen
    ctx.strokeStyle = "#4a6fa5";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(startX, y);
    ctx.lineTo(endX, y);
    ctx.stroke();

    // Skalstreck och siffror 0-10
    ctx.fillStyle = "#2f4a73";
    ctx.font = "14px Arial";
    ctx.textAlign = "center";
    for (var i = 0; i <= 10; i++) {
      var x = startX + i * steg;
      ctx.beginPath();
      ctx.moveTo(x, y - 8);
      ctx.lineTo(x, y + 8);
      ctx.stroke();
      ctx.fillText(i, x, y + 28);
    }

    // Markera valt tal, om något är valt
    if (tallinjeValtTal !== null) {
      var valdX = startX + tallinjeValtTal * steg;
      ctx.beginPath();
      ctx.arc(valdX, y, 8, 0, Math.PI * 2);
      ctx.fillStyle = "#e07a3f";
      ctx.fill();
    }
  }

  function initieraTallinje() {

  // Generisk simulering: slumpad algebrauppgift med objekt (emoji)
  // vars värde man ska lista ut utifrån en given summa.
  // Återanvänds genom att sätta simulering: "algebra-objekt-varde".
  var algebraObjekt = ["🍎", "🍌", "🍇", "🍉", "🍒", "⚽", "🎈", "🍪"];
  var algebraRattSvar = null;

  function genereraAlgebraUppgift() {

  // Tre-stegs progression för Ekvationer: samma princip (räkna ut vad ett
  // objekt är värt utifrån en summa) men med tre olika symboltyper -
  // konkreta objekt, en generisk symbol, och slutligen bokstaven x.
  var ekvRattSvar = {};

  function genereraEkvationssteg(steg) {
    var antal = Math.floor(Math.random() * 4) + 2;   // 2-5 st

  // Berättelseuppgifter: slumpar fram en kedja på 1-2 räknesteg (av alla
  // fyra räknesätten) utifrån ett okänt tal, och formulerar det som text.
  // Garanterar att inget mellansteg blir negativt eller ger ett brutet tal.
  var berattelseRattSvar = null;
  var opNamn = { add: "adderas", sub: "subtraheras", mul: "multipliceras", div: "delas" };

  function slumpaBerattelsekedja() {
    for (var forsok = 0; forsok < 30; forsok++) {
      var start = Math.floor(Math.random() * 16) + 2;   // 2-17
      var antalSteg = Math.random() < 0.5 ? 1 : 2;
      var steg = [];
      var varde = start;
      var giltig = true;

      for (var i = 0; i < antalSteg; i++) {
        var opTyp = Math.floor(Math.random() * 4);
        var tal, ny, typ;

        if (opTyp === 0) {
          tal = Math.floor(Math.random() * 10) + 1;
          ny = varde + tal;
          typ = "add";
        } else if (opTyp === 1) {
          tal = Math.floor(Math.random() * 10) + 1;
          ny = varde - tal;
          if (ny < 0) { giltig = false; break; }
          typ = "sub";
        } else if (opTyp === 2) {
          tal = Math.floor(Math.random() * 4) + 2; // 2-5
          ny = varde * tal;
          typ = "mul";
        } else {
          var divisorer = [];
          for (var d = 2; d <= 10; d++) {
            if (varde % d === 0) { divisorer.push(d); }
          }
          if (divisorer.length === 0) { giltig = false; break; }
          tal = divisorer[Math.floor(Math.random() * divisorer.length)];
          ny = varde / tal;
          typ = "div";
        }

        steg.push({ typ: typ, tal: tal });
        varde = ny;
      }

      if (giltig && varde !== start) {
        return { start: start, steg: steg, resultat: varde };
      }
    }
    // Osannolik reservuppgift ifall inget lyckades
    return { start: 10, steg: [{ typ: "add", tal: 5 }], resultat: 15 };
  }

  function genereraBerattelseuppgift() {

  // Abstrakta ekvationer: en riktig ekvation med enbart tal och bokstäver,

  var abstraktRattSvar = null;

  function genereraAbstraktEkvation() {

  // ===== Jeopardy: Repetition bråk =====
  // Hjälpfunktioner för bråkräkning och lodrät bråkrendering.
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function storstaGemensammaNamnare(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { var t = b; b = a % b; a = t; }
    return a || 1;
  }
  function forenklaBrak(taljare, namnare) {
    var g = storstaGemensammaNamnare(taljare, namnare);
    return { taljare: taljare / g, namnare: namnare / g };
  }
  // Lodrät bråkrendering: täljare ovanpå, streck, nämnare under - inget snedstreck.
  function brakHTML(t, n) {
    return '<span class="brak"><span class="brak-taljare">' + t +
           '</span><span class="brak-namnare">' + n + '</span></span>';
  }

  var jeopardyKategorier = ["Förlänga och förkorta", "Addition och subtraktion", "Multiplikation", "Division"];
  var jeopardyPoangLista = [100, 200, 300, 400, 500];

  // 4 kategorier x 5 svårighetsgrader (100-500p), ökande svårighet i varje rad.
  var jeopardyGeneratorer = [
    // Kategori 0: Förlänga och förkorta
    [
      function() {
        var a = randInt(1, 4), b = randInt(a + 1, 6), k = randInt(2, 4);
        var malNamnare = b * k, ratt = a * k;
        return { fraga: "Förläng bråket " + brakHTML(a, b) + " så att nämnaren blir " + malNamnare +
                 ". Vad blir täljaren?", svarTyp: "heltal", ratt: ratt };
      },
      function() {
        var a0 = randInt(1, 4), b0 = randInt(a0 + 1, 6), k = randInt(2, 4);
        var a = a0 * k, b = b0 * k;
        return { fraga: "Förkorta bråket " + brakHTML(a, b) + " genom att dela täljare och nämnare med " +
                 k + ". Vad blir täljaren?", svarTyp: "heltal", ratt: a0 };
      },
      function() {
        var a0 = randInt(2, 6), b0 = randInt(a0 + 1, 9), k = randInt(2, 5);
        var a = a0 * k, b = b0 * k;
        return { fraga: "Förkorta bråket " + brakHTML(a, b) + " genom att dela med " + k +
                 ". Skriv svaret som ett bråk.", svarTyp: "brak", ratt: { taljare: a0, namnare: b0 } };
      },
      function() {
        var a0 = randInt(3, 9), b0 = randInt(a0 + 1, 12), k = randInt(3, 6);
        var a = a0 * k, b = b0 * k;
        return { fraga: "Förkorta bråket " + brakHTML(a, b) + " genom att dela med " + k +
                 ". Skriv svaret som ett bråk.", svarTyp: "brak", ratt: { taljare: a0, namnare: b0 } };
      },
      function() {
        var a0, b0, forsok = 0;
        do { a0 = randInt(2, 9); b0 = randInt(a0 + 1, 12); forsok++; }
        while (storstaGemensammaNamnare(a0, b0) !== 1 && forsok < 30);
        var m = randInt(2, 6);
        var a = a0 * m, b = b0 * m;
        return { fraga: "Skriv bråket " + brakHTML(a, b) + " i enklaste form.",
                 svarTyp: "brak", ratt: { taljare: a0, namnare: b0 } };
      }
    ],
    // Kategori 1: Addition och subtraktion
    [
      function() {
        var n = randInt(4, 8), a = randInt(1, n - 2), b = randInt(1, Math.max(1, n - 1 - a));
        return { fraga: brakHTML(a, n) + " + " + brakHTML(b, n) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(a + b, n) };
      },
      function() {
        var n = randInt(4, 10), a = randInt(2, n - 1), b = randInt(1, a - 1);
        return { fraga: brakHTML(a, n) + " - " + brakHTML(b, n) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(a - b, n) };
      },
      function() {
        var b1 = randInt(2, 5), k = randInt(2, 4), b2 = b1 * k;
        var a1 = randInt(1, b1 - 1), a2 = randInt(1, b2 - 1);
        var summa = a1 * k + a2;
        return { fraga: brakHTML(a1, b1) + " + " + brakHTML(a2, b2) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(summa, b2) };
      },
      function() {
        var b1, b2, forsok = 0;
        do { b1 = randInt(3, 8); b2 = randInt(3, 8); forsok++; }
        while ((b1 === b2 || b1 % b2 === 0 || b2 % b1 === 0) && forsok < 30);
        var g = storstaGemensammaNamnare(b1, b2), lcm = b1 * b2 / g;
        var a1 = randInt(1, b1 - 1), a2 = randInt(1, b2 - 1);
        var n1 = a1 * (lcm / b1), n2 = a2 * (lcm / b2);
        return { fraga: brakHTML(a1, b1) + " + " + brakHTML(a2, b2) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(n1 + n2, lcm) };
      },
      function() {
        var b1, b2, forsok = 0;
        do { b1 = randInt(3, 8); b2 = randInt(3, 8); forsok++; }
        while ((b1 === b2 || b1 % b2 === 0 || b2 % b1 === 0) && forsok < 30);
        var g = storstaGemensammaNamnare(b1, b2), lcm = b1 * b2 / g;
        var a1, a2, n1, n2, forsok2 = 0;
        do {
          a1 = randInt(1, b1 - 1); a2 = randInt(1, b2 - 1);
          n1 = a1 * (lcm / b1); n2 = a2 * (lcm / b2);
          forsok2++;
        } while (n1 === n2 && forsok2 < 30);
        if (n1 < n2) {
          var tA = a1, tB = b1, tN = n1;
          a1 = a2; b1 = b2; n1 = n2;
          a2 = tA; b2 = tB; n2 = tN;
        }
        return { fraga: brakHTML(a1, b1) + " - " + brakHTML(a2, b2) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(n1 - n2, lcm) };
      }
    ],
    // Kategori 2: Multiplikation
    [
      function() {
        var a = randInt(1, 5), b = randInt(a + 1, 8), heltal = randInt(2, 5);
        return { fraga: brakHTML(a, b) + " × " + heltal + " = ? (svara i enklaste form)",

      function() {
        var a = randInt(2, 7), b = randInt(a + 1, 10), heltal = randInt(3, 7);
        return { fraga: brakHTML(a, b) + " × " + heltal + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(a * heltal, b) };
      },
      function() {
        var a1 = randInt(1, 5), b1 = randInt(a1 + 1, 7), a2 = randInt(1, 5), b2 = randInt(a2 + 1, 7);
        return { fraga: brakHTML(a1, b1) + " × " + brakHTML(a2, b2) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(a1 * a2, b1 * b2) };
      },
      function() {
        var a1 = randInt(2, 8), b1 = randInt(a1 + 1, 10), a2 = randInt(2, 8), b2 = randInt(a2 + 1, 10);
        return { fraga: brakHTML(a1, b1) + " × " + brakHTML(a2, b2) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(a1 * a2, b1 * b2) };
      },
      function() {
        var a1 = randInt(3, 11), b1 = randInt(a1 + 1, 13), a2 = randInt(3, 11), b2 = randInt(a2 + 1, 13);
        return { fraga: brakHTML(a1, b1) + " × " + brakHTML(a2, b2) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(a1 * a2, b1 * b2) };
      }
    ],
    // Kategori 3: Division
    [
      function() {
        var a = randInt(1, 10), b = randInt(2, 10);
        return { fraga: a + " ÷ " + b + " = ? Skriv svaret som ett bråk i enklaste form.",
                 svarTyp: "brak", ratt: forenklaBrak(a, b) };
      },
      function() {
        var heltal = randInt(2, 6), c = randInt(1, 5), d = randInt(c + 1, 7);
        return { fraga: heltal + " ÷ " + brakHTML(c, d) + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(heltal * d, c) };
      },
      function() {
        var a = randInt(1, 6), b = randInt(a + 1, 8), heltal = randInt(2, 5);
        return { fraga: brakHTML(a, b) + " ÷ " + heltal + " = ? (svara i enklaste form)",
                 svarTyp: "brak", ratt: forenklaBrak(a, b * heltal) };
      },
      function() {
        var a1 = randInt(1, 5), b1 = randInt(a1 + 1, 7), a2 = randInt(1, 5), b2 = randInt(a2 + 1, 7);
        return { fraga: brakHTML(a1, b1) + '<span class="stort-snedstreck">/</span>' + brakHTML(a2, b2) +
                 " = ? (svara i enklaste form)", svarTyp: "brak", ratt: forenklaBrak(a1 * b2, b1 * a2) };
      },
      function() {
        var a1 = randInt(2, 9), b1 = randInt(a1 + 1, 11), a2 = randInt(2, 9), b2 = randInt(a2 + 1, 11);
        return { fraga: brakHTML(a1, b1) + '<span class="stort-snedstreck">/</span>' + brakHTML(a2, b2) +
                 " = ? (svara i enklaste form)", svarTyp: "brak", ratt: forenklaBrak(a1 * b2, b1 * a2) };
      }

  ];

  var jeopardyData = {};

  function initJeopardy() {
    jeopardyData = {};
    jeopardyKategorier.forEach(function(kat, ki) {
      jeopardyPoangLista.forEach(function(p, ni) {
        var key = ki + "-" + p;
        var fraga = jeopardyGeneratorer[ki][ni]();
        fraga.avklarad = false;
        jeopardyData[key] = fraga;
      });
    });
    ritaJeopardyBrada();
  }

  function ritaJeopardyBrada() {
    var html = '<table class="jeopardy-tabell"><thead><tr>';
    jeopardyKategorier.forEach(function(kat) {
      html += "<th>" + kat + "</th>";
    });
    html += "</tr></thead><tbody>";
    jeopardyPoangLista.forEach(function(p) {
      html += "<tr>";
      jeopardyKategorier.forEach(function(kat, ki) {
        var key = ki + "-" + p;
        var avklarad = jeopardyData[key].avklarad;
        html += "<td>";
        if (avklarad) {
          html += '<button class="jeopardy-ruta jeopardy-klar" disabled>✔️</button>';
        } else {
          html += '<button class="jeopardy-ruta" onclick="visaJeopardyFraga(\'' + key + '\')">' + p + "</button>";

  function visaJeopardyFraga(key) {
    var data = jeopardyData[key];

    var facitText;

    if (data.svarTyp === "heltal") {
      var v = parseInt(document.getElementById("jeoSvarHel").value, 10);
      ratt = (v === data.ratt);
      facitText = data.ratt;
    } else {
      var t = parseInt(document.getElementById("jeoSvarTaljare").value, 10);
      var n = parseInt(document.getElementById("jeoSvarNamnare").value, 10);
      ratt = (t === data.ratt.taljare && n === data.ratt.namnare);
      facitText = data.ratt.taljare + "/" + data.ratt.namnare;
    }

    if (ratt) {
      feedback.innerHTML = '<span class="algebra-ratt">✅ Rätt! Bra jobbat.</span>';
    } else {
      feedback.innerHTML = '<span class="algebra-fel">❌ Inte riktigt. Rätt svar var ' + facitText + ".</span>";
    }
  }

  function skrivUt() {
    var kryss = document.getElementById("lasvanligtKryss");
    var fokuslage = kryss && kryss.checked;

    if (fokuslage) {
      document.body.classList.add("fokus-utskrift");
    }

    window.print();

    // Ta bort fokusläget igen efter utskrift/PDF-dialogen stängts,
    // så det inte påverkar den vanliga webbvisningen.
    window.onafterprint = function() {
      document.body.classList.remove("fokus-utskrift");
      window.onafterprint = null;
    };
  }

  visStartsida();
</script>

</body>
</html>
