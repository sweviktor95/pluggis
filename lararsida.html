<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pluggis – för lärare</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #f4f8f5; color: #222; }
  h1 { text-align: center; color: #38564A; margin-bottom: 4px; }
  .undertitel { text-align: center; color: #777; margin-bottom: 28px; }
  a.tillbaka { display: inline-block; margin-bottom: 18px; color: #38564A; }
  #port { max-width: 360px; margin: 40px auto; background: #fff; padding: 22px; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,.1); text-align: center; }
  #port input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #bbb; border-radius: 8px; margin: 10px 0; }
  button, .lank { background: #38564A; color: #fff; border: 0; padding: 9px 14px; border-radius: 8px; font-size: 15px; cursor: pointer; text-decoration: none; display: inline-block; }
  #fel { color: #b00020; min-height: 1.2em; font-size: 14px; }
  details { background: #fff; border-radius: 10px; margin: 10px 0; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  summary { padding: 14px 16px; font-weight: bold; cursor: pointer; font-size: 18px; }
  .inre { padding: 0 16px 14px; }
  .inre details { box-shadow: none; border: 1px solid #e3e3e8; }
  .inre summary { font-size: 16px; }
  .kapitel { padding: 10px 0; border-top: 1px solid #eee; }
  .kapitel h4 { margin: 0 0 8px; }
  .knappar { display: flex; flex-wrap: wrap; gap: 8px; }
  .lank.larar { background: #245040; }
  .lank.av { background: #c9c9cf; color: #555; cursor: default; }
  .tomt { color: #888; font-size: 14px; }
  .grupp { font-weight: bold; font-size: 14px; margin: 12px 0 6px; color: #444; }
  .sidor { color: #555; font-size: 14px; margin: 8px 0 0; }
  .planlank { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 10px; }
  .lank.plan { background: #5F8472; }
  .ide { color: #555; font-size: 14px; margin: 4px 0 8px; }
  .delomr { margin: 6px 0 10px; padding-left: 20px; font-size: 14px; color: #333; }
  .vecka { color: #777; font-weight: normal; font-size: 14px; }
</style>
</head>
<body>
<h1>För lärare</h1>
<p class="undertitel">Pluggis – utskrifter, lärarhandledningar och facit</p>
<a class="tillbaka" href="index.html">← Till Pluggis</a>

<div id="port">
  <p><strong>Lösenord</strong></p>
  <input type="password" id="los" autocomplete="off" autofocus>
  <div id="fel"></div>
  <button type="button" id="oppna">Öppna</button>
</div>

<div id="innehall" style="display:none"></div>

<script src="innehall/struktur.js"></script>
<script src="hafte/manifest.js"></script>
<script src="planering/lararvy-biologi.js"></script>
<script>
  // Obs: enkel spärr mot nyfikna – inget riktigt skydd (sidan är statisk).
  var HASH = "a2c4a4f38df7a7d24eac2b8dc1c9f63487d6255208b978a29b9740423225ee3a";
  var NYCKEL = "pluggis-larare-v1";

  function hasha(text) {
    var data = new TextEncoder().encode("pluggis-lärare:" + text);
    return crypto.subtle.digest("SHA-256", data).then(function(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function(b) { return ("0" + b.toString(16)).slice(-2); }).join("");
    });
  }

  function lank(href, text, extra, ladda) {
    return '<a class="lank ' + (extra || "") + '" href="' + href + '"' + (ladda ? ' download' : ' target="_blank" rel="noopener"') + '>' + text + '</a>';
  }

  function knappar(h) {
    var k = '<div class="knappar">';
    if (h.lattlast) { k += lank(h.lattlast, "Lättläst"); }
    if (h.vanlig) { k += lank(h.vanlig, "Grundtext"); }
    if (h.fordjupning) { k += lank(h.fordjupning, "Fördjupning"); }
    return k + '</div>';
  }

  function kapitelHtml(blad) {
    var h = window.hafte && window.hafte[blad.id];
    if (!h) { return ""; }
    var k = '<div class="kapitel"><h4>' + (h.titel || blad.titel) + '</h4>';
    k += '<p class="grupp">Elevversion (utan facit, lärarhandledning och bonuslabb) – till klassen</p>' + knappar(h);
    if (h.handledning) {
      k += '<p class="grupp">Lärarhandledning för alla tre nivåerna (handledning, facit och bedömningsstöd) – för dig som lärare</p><div class="knappar">' + lank(h.handledning, "Lärarhandledning") + '</div>';
    }
    if (h.komplett) {
      k += '<p class="grupp">Komplett (med facit, lärarhandledning och bonuslabb) – för dig som lärare</p>' + knappar(h.komplett);
    }
    return k + '</div>';
  }

  // Biologi i lärarvyn: planeringen som länk överst, därefter de nya områdena (kapitlen).
  function biologiHtml(nod) {
    var d = window.lararBiologi;
    var ut = '<div class="planlank">' + lank(d.plan.pdf, "📋 Planering (PDF)", "plan") + lank(d.plan.xlsx, "Planering (Excel)", "plan") + '</div>';
    d.omraden.forEach(function(o) {
      var inre = '<p class="ide">' + o.ide + '</p>' +
        ((o.ppt && o.ppt.length) ? '<p class="grupp">PowerPoint – ladda ner</p><div class="knappar">' + o.ppt.map(function(l) { return lank(l[1], l[0], "plan", true); }).join("") + '</div>' : '') +
        ((o.lankar && o.lankar.length) ? '<p class="grupp">Prov och spel – till klassen och läraren</p><div class="knappar">' + o.lankar.map(function(l) { return lank(l[1], l[0]); }).join("") + '</div>' : '');
      var hafte = o.hafte ? kapitelHtml({ id: o.hafte, titel: o.titel }) : "";
      inre += hafte || '<div class="knappar" style="margin-top:10px"><span class="lank av">Häften kommer</span></div>';
      ut += '<details><summary>' + o.nr + '. ' + o.titel + '</summary><div class="inre">' + inre + '</div></details>';
    });
    return '<details><summary>' + (nod.ikon ? nod.ikon + " " : "") + nod.titel + '</summary><div class="inre">' + ut + '</div></details>';
  }

  // Bygger HTML för en gren; returnerar "" om inga häften finns under den.
  function grenHtml(nod, niva) {
    if (nod.id === "biologi" && window.lararBiologi) { return biologiHtml(nod); }
    var egen = kapitelHtml(nod);
    var inre = (nod.barn || []).map(function(b) { return grenHtml(b, niva + 1); }).join("");
    if (!nod.barn || !nod.barn.length) { return egen; }
    if (!egen && !inre) { return ""; }
    return '<details><summary>' + (nod.ikon ? nod.ikon + " " : "") + nod.titel + '</summary><div class="inre">' + egen + inre + '</div></details>';
  }

  function visa() {
    document.getElementById("port").style.display = "none";
    var ut = struktur.map(function(a) { return grenHtml(a, 0); }).join("");
    document.getElementById("innehall").innerHTML = ut ||
      '<p class="tomt">Inga häften är uppladdade än. De dyker upp här när de lagts in i <code>hafte/manifest.js</code>.</p>';
    document.getElementById("innehall").style.display = "block";
  }

  function forsok() {
    var v = document.getElementById("los").value;
    hasha(v).then(function(h) {
      if (h === HASH) {
        try { localStorage.setItem(NYCKEL, HASH); } catch (e) {}
        visa();
      } else {
        document.getElementById("fel").textContent = "Fel lösenord.";
      }
    }).catch(function() { document.getElementById("fel").textContent = "Webbläsaren stöder inte inloggning här."; });
  }

  document.getElementById("oppna").addEventListener("click", forsok);
  document.getElementById("los").addEventListener("keydown", function(e) { if (e.key === "Enter") { forsok(); } });
  try { if (localStorage.getItem(NYCKEL) === HASH) { visa(); } } catch (e) {}
</script>
</body>
</html>
