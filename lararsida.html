<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#38564A">
<link rel="icon" type="image/svg+xml" href="ikoner/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="ikoner/favicon-32.png">
<link rel="apple-touch-icon" href="ikoner/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pluggis">
<title>Pluggis – för lärare</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; background: #f4f8f5; color: #222; }
  h1 { text-align: center; color: #38564A; margin-bottom: 4px; }
  .undertitel { text-align: center; color: #777; margin-bottom: 28px; }
  a.tillbaka { display: inline-block; margin-bottom: 18px; color: #38564A; }
  #port { max-width: 360px; margin: 40px auto; background: #fff; padding: 22px; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,.1); text-align: center; }
  #port input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #bbb; border-radius: 8px; margin: 10px 0; }
  button, .lank { background: #38564A; color: #fff; border: 0; padding: 9px 14px; border-radius: 8px; font-size: 15px; cursor: pointer; text-decoration: none; display: inline-block; }
  #fel { color: #b00020; min-height: 1.2em; font-size: 14px; }
  details { background: #fff; border-radius: 10px; margin: 10px 0; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  summary { padding: 14px 16px; font-weight: bold; cursor: pointer; font-size: 18px; }
  .inre { padding: 0 16px 14px; }
  .inre details { box-shadow: none; border: 1px solid #e3e3e8; }
  .inre summary { font-size: 16px; }
  .kapitel { padding: 10px 0; border-top: 1px solid #eee; }
  .kapitel h4 { margin: 0 0 8px; }
  .knappar { display: flex; flex-wrap: wrap; gap: 8px; }
  .lank.larar { background: #245040; }
  .lank.av { background: #c9c9cf; color: #555; cursor: default; }
  .tomt { color: #888; font-size: 14px; }
  .grupp { font-weight: bold; font-size: 14px; margin: 12px 0 6px; color: #444; }
  .sidor { color: #555; font-size: 14px; margin: 8px 0 0; }
  .planlank { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 10px; }
  .lank.plan { background: #5F8472; }
  .ide { color: #555; font-size: 14px; margin: 4px 0 8px; }
  .delomr { margin: 6px 0 10px; padding-left: 20px; font-size: 14px; color: #333; }
  .vecka { color: #777; font-weight: normal; font-size: 14px; }
</style>
</head>
<body>
<h1>För lärare</h1>
<p class="undertitel">Pluggis – utskrifter, lärarhandledningar och facit</p>
<a class="tillbaka" href="index.html">← Till Pluggis</a>

<div id="port">
  <p><strong>Lösenord</strong></p>
  <input type="password" id="los" autocomplete="off" autofocus>
  <div id="fel"></div>
  <button type="button" id="oppna">Öppna</button>
</div>

<div id="innehall" style="display:none"></div>

<style>img.flagga { height: 0.8em; width: auto; vertical-align: -0.05em; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }</style>
<script>
// Flaggemojis visas som bokstavspar på Windows. Byt kända flaggor mot bilder.
var KANDA_FLAGGOR = { SE: 1, GB: 1, ES: 1, FR: 1, DE: 1 };
function ikonHtml(ikon) {
  return String(ikon).replace(/[\u{1F1E6}-\u{1F1FF}]{2}/gu, function (m) {
    var kod = Array.from(m).map(function (c) { return String.fromCharCode(c.codePointAt(0) - 0x1F1E6 + 65); }).join("");
    return KANDA_FLAGGOR[kod] ? '<img class="flagga" alt="" src="ikoner/flaggor/' + kod.toLowerCase() + '.svg">' : m;
  });
}
</script>
<script src="innehall/struktur.js"></script>
<script src="hafte/manifest.js"></script>
<script src="planering/lararvy-biologi.js"></script>
<script src="planering/lararvy-kemi.js"></script>
<script src="planering/lararvy-fysik.js"></script>
<script src="planering/lararvy-teknik.js"></script>
<script src="planering/lararvy-matematik.js"></script>
<script src="planering/lararvy-kartlaggning.js"></script>
<script>
  // Obs: enkel spärr mot nyfikna – inget riktigt skydd (sidan är statisk).
  var HASH = "a2c4a4f38df7a7d24eac2b8dc1c9f63487d6255208b978a29b9740423225ee3a";
  var NYCKEL = "pluggis-larare-v1";

  function hasha(text) {
    var data = new TextEncoder().encode("pluggis-lärare:" + text);
    return crypto.subtle.digest("SHA-256", data).then(function(buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function(b) { return ("0" + b.toString(16)).slice(-2); }).join("");
    });
  }

  function lank(href, text, extra, ladda) {
    return '<a class="lank ' + (extra || "") + '" href="' + href + '"' + (ladda ? ' download' : ' target="_blank" rel="noopener"') + '>' + text + '</a>';
  }

  function knappar(h) {
    var k = '<div class="knappar">';
    if (h.lattlast) { k += lank(h.lattlast, "Lättläst"); }
    if (h.vanlig) { k += lank(h.vanlig, "Grundtext"); }
    if (h.fordjupning) { k += lank(h.fordjupning, "Fördjupning"); }
    return k + '</div>';
  }

  // del: "handl" = bara lärarhandledningen, "print" = utskrifter (häften, pluggblad), annars allt.
  function kapitelHtml(blad, del) {
    var h = window.hafte && window.hafte[blad.id];
    if (!h) { return ""; }
    if (del === "handl") { return ""; }
    var k = '<div class="kapitel"><h4>' + (del === "print" ? "Utskrifter: " : "") + (h.titel || blad.titel) + '</h4>';
    k += '<p class="grupp">Elevversion (utan facit, lärarhandledning och bonuslabb) – till klassen</p>' + knappar(h);
    if (h.larare) {
      k += '<p class="grupp">Lärarversion – samma innehåll som elevhäftet, med löpande källhänvisning [1], [2] … och källförteckning sist – för dig som lärare</p>' + knappar(h.larare);
    }
    if (h.pluggblad) {
      k += '<p class="grupp">Plugga inför prov (beta) – kompakt sammanfattning, begrepp, övningsfrågor och facit, 4 sidor att skriva ut till eleverna</p><div class="knappar">' + lank(h.pluggblad, "Pluggblad") + '</div>';
    }
    if (h.handledning && del !== "print") {
      k += '<p class="grupp">Lärarhandledning för alla tre nivåerna (handledning, facit och bedömningsstöd) – för dig som lärare</p><div class="knappar">' + lank(h.handledning, "Lärarhandledning") + '</div>';
    }
    if (h.komplett) {
      k += '<p class="grupp">Komplett (med facit, lärarhandledning och bonuslabb) – för dig som lärare</p>' + knappar(h.komplett);
    }
    return k + '</div>';
  }

  // Kartläggning per ämne (planering/lararvy-kartlaggning.js).
  function kartHtml(id) {
    var k = window.lararKartlaggning && window.lararKartlaggning[id];
    if (!k) { return ""; }
    return '<div class="kapitel"><h4>Kartläggning</h4><p class="grupp">' + k.text + '</p><div class="knappar">' +
      k.lankar.map(function(l) { return lank(l[1], l[0]); }).join("") + '</div></div>';
  }

  // Biologi i lärarvyn: planeringen som länk överst, därefter de nya områdena (kapitlen).
  function biologiHtml(nod, d) {
    var ut = '<div class="planlank">' + lank(d.plan.pdf, "📋 Planering (PDF)", "plan") + lank(d.plan.xlsx, "Planering (Excel)", "plan") + '</div>';
    ut += kartHtml(nod.id);
    d.omraden.forEach(function(o) {
      var hh = o.hafte && window.hafte && window.hafte[o.hafte];
      var lank2 = function(l, ladda) { return lank(l[1], l[0], ladda ? "plan" : "", ladda); };
      var ppt = (o.ppt || []).map(function(l) { return lank2(l, true); });
      var handl = (hh && hh.handledning) ? [lank(hh.handledning, "📘 Lärarhandledning")] : [];
      var prov = (o.lankar || []).filter(function(l) { return l[0].indexOf("Prov") === 0; }).map(function(l) { return lank2(l); });
      var spel = (o.lankar || []).filter(function(l) { return l[0].indexOf("Prov") !== 0; }).map(function(l) { return lank2(l); });
      var topp = ppt.concat(handl, prov);
      var inre = '<p class="ide">' + o.ide + '</p>' +
        (topp.length ? '<p class="grupp">PowerPoint, lärarhandledning och prov</p><div class="knappar">' + topp.join("") + '</div>' : '') +
        (spel.length ? '<p class="grupp">Spel och quiz till klassen</p><div class="knappar">' + spel.join("") + '</div>' : '');
      var hafte = o.hafte ? kapitelHtml({ id: o.hafte, titel: o.titel }, "print") : "";
      inre += hafte || '<div class="knappar" style="margin-top:10px"><span class="lank av">Häften kommer</span></div>';
      ut += '<details><summary>' + o.nr + '. ' + o.titel + '</summary><div class="inre">' + inre + '</div></details>';
    });
    return '<details><summary>' + (nod.ikon ? ikonHtml(nod.ikon) + " " : "") + nod.titel + '</summary><div class="inre">' + ut + '</div></details>';
  }

  // Bygger HTML för en gren; returnerar "" om inga häften finns under den.
  function grenHtml(nod, niva) {
    if (nod.id === "biologi" && window.lararBiologi) { return biologiHtml(nod, window.lararBiologi); }
    if (nod.id === "kemi" && window.lararKemi) { return biologiHtml(nod, window.lararKemi); }
    if (nod.id === "fysik" && window.lararFysik) { return biologiHtml(nod, window.lararFysik); }
    if (nod.id === "teknik" && window.lararTeknik) { return biologiHtml(nod, window.lararTeknik); }
    var egen = kapitelHtml(nod) + (nod.id === "matematik" ? kartHtml("matematik") : "");
    var ex = window.lararExtra && window.lararExtra[nod.id];
    if (ex) {
      egen += '<div class="kapitel"><h4>' + nod.titel + '</h4><p class="grupp">' + ex.grupp + '</p><div class="knappar">' +
        ex.lankar.map(function(l) { return lank(l[1], l[0], "", l[2]); }).join("") + '</div></div>';
    }
    var inre = (nod.barn || []).map(function(b) { return grenHtml(b, niva + 1); }).join("");
    if (!nod.barn || !nod.barn.length) { return egen; }
    if (!egen && !inre) { return ""; }
    return '<details><summary>' + (nod.ikon ? ikonHtml(nod.ikon) + " " : "") + nod.titel + '</summary><div class="inre">' + egen + inre + '</div></details>';
  }


  // ---- Elevframsteg: elevernas QR-länkar skannas med mobilkameran och sparas bara i den här webbläsaren ----
  var ELEV_NYCKEL = "pluggis-elever-v1";
  function bladIds() { var ut = []; (function g(a) { a.forEach(function(n) { if (!n.barn || !n.barn.length) { ut.push(n.id); } else { g(n.barn); } }); })(struktur); return ut; }
  function qrHash(ids) { var h = 2166136261, s = ids.join("|"); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36); }
  function elever() { try { return JSON.parse(localStorage.getItem(ELEV_NYCKEL) || "{}") || {}; } catch (e) { return {}; } }
  function sparaElever(o) { try { localStorage.setItem(ELEV_NYCKEL, JSON.stringify(o)); } catch (e) {} }
  function avkoda(b64) {
    var s = atob(b64.replace(/-/g, "+").replace(/_/g, "/")), by = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) { by[i] = s.charCodeAt(i); }
    return by;
  }
  var importMeddelande = "";
  function importeraHash() {
    var m = /^#e=([A-Za-z0-9_-]+)$/.exec(location.hash);
    if (!m) { return; }
    try {
      var d = JSON.parse(new TextDecoder().decode(avkoda(m[1])));
      if (!d || d.v !== 1 || !d.a) { throw 0; }
      var o = elever(); o[d.a] = d; sparaElever(o);
      importMeddelande = d.a + " är inlagd.";
    } catch (e) { importMeddelande = "Länken kunde inte läsas."; }
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { location.hash = ""; }
  }
  function antalBitar(b64, ids, prefix) {
    var by = avkoda(b64), n = 0;
    ids.forEach(function(id, i) { if ((by[i >> 3] >> (i & 7)) & 1) { n++; } });
    return n;
  }
  function esc(t) { return String(t).replace(/[&<>"]/g, function(c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function dagText(t) { var d = new Date(t * 86400000); return d.toISOString().slice(0, 10); }
  function elevHtml() {
    var o = elever(), namn = Object.keys(o).sort(function(a, b) { return a.localeCompare(b, "sv"); });
    var ids = bladIds(), nu = qrHash(ids);
    var ut = '<div class="kapitel"><h4>Elevframsteg</h4><p class="grupp">Eleven öppnar Pluggis → Min QR-kod. Skanna med mobilkameran och öppna länken här. Uppgifterna sparas bara i den här webbläsaren.</p>';
    if (importMeddelande) { ut += '<p class="grupp"><b>' + esc(importMeddelande) + '</b></p>'; importMeddelande = ""; }
    if (!namn.length) { return ut + '<p class="grupp">Inga elever inlagda än.</p></div>'; }
    ut += '<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:14px;width:100%"><tr><th style="text-align:left;padding:4px 8px">Elev</th>';
    var vis = struktur.map(function(a, i) { return namn.some(function(n) { var q = o[n].s && o[n].s[i]; return q && q[1] > 0; }); });
    struktur.forEach(function(a, i) { if (vis[i]) { ut += '<th style="padding:4px 8px">' + esc(a.titel) + '</th>'; } });
    ut += '<th style="padding:4px 8px">Repetition</th><th style="padding:4px 8px">Skannad</th><th></th></tr>';
    namn.forEach(function(n, k) {
      var d = o[n], gammal = d.h !== nu;
      ut += '<tr style="background:' + (k % 2 ? "#f6f7f9" : "#fff") + '"><td style="padding:4px 8px">' + esc(n) + (gammal ? ' <span title="Sidan har ändrats sedan koden skapades – siffrorna kan vara lite fel">⚠️</span>' : '') + '</td>';
      struktur.forEach(function(a, i) { if (!vis[i]) { return; } var s = d.s && d.s[i]; ut += '<td style="padding:4px 8px;text-align:center">' + (s && s[1] ? s[0] + '/' + s[1] : '–') + '</td>'; });
      ut += '<td style="padding:4px 8px;text-align:center">' + (d.r ? d.r[0] + ' sitter av ' + d.r[1] : '–') + '</td><td style="padding:4px 8px">' + dagText(d.t) + '</td>' +
        '<td><a href="javascript:void(0)" onclick="taBortElev(' + k + ')">ta bort</a></td></tr>';
    });
    ut += '</table></div><div class="knappar" style="margin-top:10px"><a class="lank" href="javascript:void(0)" onclick="elevCsv()">Ladda ner CSV</a><a class="lank" href="javascript:void(0)" onclick="rensaElever()">Rensa alla</a></div></div>';
    return ut;
  }
  function elevNamn() { return Object.keys(elever()).sort(function(a, b) { return a.localeCompare(b, "sv"); }); }
  function taBortElev(k) { var o = elever(); delete o[elevNamn()[k]]; sparaElever(o); visa(); }
  function rensaElever() { if (confirm("Ta bort alla inlagda elever?")) { sparaElever({}); visa(); } }
  function elevCsv() {
    var o = elever(), rader = [["Elev"].concat(struktur.map(function(a) { return a.titel + " klara"; }), struktur.map(function(a) { return a.titel + " totalt"; }), ["Repetition sitter", "Repetition sedda", "Skannad"])];
    elevNamn().forEach(function(n) { var d = o[n]; rader.push([n].concat(struktur.map(function(a, i) { return d.s && d.s[i] ? d.s[i][0] : ""; }), struktur.map(function(a, i) { return d.s && d.s[i] ? d.s[i][1] : ""; }), [d.r ? d.r[0] : "", d.r ? d.r[1] : "", dagText(d.t)])); });
    var csv = "﻿" + rader.map(function(r) { return r.map(function(c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(";"); }).join("\r\n");
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "elevframsteg.csv"; a.click();
  }

  function visa() {
    document.getElementById("port").style.display = "none";
    importeraHash();
    var ut = elevHtml() + struktur.map(function(a) { return grenHtml(a, 0); }).join("");
    ut += '<div class="kapitel"><h4>Kartläggning av elev med svårigheter i skolgången</h4><p class="grupp">Mall för mentor och ämneslärare: närvaro, kunskaper per ämne, hur eleven lär, mående, vad som prövats och en plan. Elevsamtalet är ett eget blad som eleven svarar på. Skolans egna blanketter och sekretessrutiner går före.</p><div class="knappar">' +
      lank("kartlaggning/elev-kartlaggning-mall.pdf", "Mall · lärare (4 sidor)") + lank("kartlaggning/elev-kartlaggning-elevsamtal.pdf", "Elevsamtal · elev (2 sidor)") + '</div></div>';
    ut += '<div class="kapitel"><h4>Särskilt stöd och brobyggare (beta)</h4><p class="grupp">Anpassade grundskolan åk 7–9: NO som ett ämne, lättläst med bilder, frågor och facit i lärarversionen. Följer läroplanen för anpassade grundskolan (Lgra22), inte Pluggis kapitel.</p><div class="knappar">' +
      lank("hafte/no-anpassade-grundskolan-7-9.pdf", "NO anpassade · elev") + lank("hafte/no-anpassade-grundskolan-7-9-lararversion.pdf", "NO anpassade · lärare (facit)") + '</div>' +
      '<p class="grupp">Brobyggare åk 4–6: fyller luckor från mellanstadiet inför biologi kapitel 1–4 och kemi kapitel 1–3.</p><div class="knappar">' +
      lank("hafte/brobyggare-ak4-6-biologi-1-4-kemi-1-3.pdf", "Brobyggare · elev") + lank("hafte/brobyggare-ak4-6-biologi-1-4-kemi-1-3-lararversion.pdf", "Brobyggare · lärare (facit)") + '</div></div>';
    document.getElementById("innehall").innerHTML = ut ||
      '<p class="tomt">Inga häften är uppladdade än. De dyker upp här när de lagts in i <code>hafte/manifest.js</code>.</p>';
    document.getElementById("innehall").style.display = "block";
  }

  function forsok() {
    var v = document.getElementById("los").value;
    hasha(v).then(function(h) {
      if (h === HASH) {
        try { localStorage.setItem(NYCKEL, HASH); } catch (e) {}
        visa();
      } else {
        document.getElementById("fel").textContent = "Fel lösenord.";
      }
    }).catch(function() { document.getElementById("fel").textContent = "Webbläsaren stöder inte inloggning här."; });
  }

  window.addEventListener("hashchange", function() { try { if (localStorage.getItem(NYCKEL) === HASH) { visa(); } } catch (e) {} });
  document.getElementById("oppna").addEventListener("click", forsok);
  document.getElementById("los").addEventListener("keydown", function(e) { if (e.key === "Enter") { forsok(); } });
  try { if (localStorage.getItem(NYCKEL) === HASH) { visa(); } } catch (e) {}
</script>
</body>
</html>
