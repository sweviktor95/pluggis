<script>window.SCEN={"titel": "Tidsresa genom industrialiseringen", "plats": "Från en bondby till en fabriksstad", "tid": "1780–1900", "sky": ["#b8c4cc", "#e5dccb"], "mark": "#6b5a42", "walker": {"typ": "arbetare"}, "etapper": [{"x_etikett": "Byn", "tid": "Före 1760", "plats": "En bondby i England", "rubrik": "Livet på landet", "fakta": ["Du bor i en liten by. Familjen odlar mat och spinner garn för hand i stugan.", "Nästan alla i byn lever av jordbruk. Arbetet följer årstiderna. Att ha tillräckligt med mat är det viktigaste. Det finns inga fabriker och inga tåg."], "fraga": "Vad var typiskt för ett jordbrukssamhälle?", "alt": ["De flesta arbetade i fabriker", "De flesta levde av att odla jorden", "De flesta reste med tåg"], "ratt": 1, "forklaring": "I ett jordbrukssamhälle lever de flesta av jordbruk.", "deko": [["bondgard", -120, 1.0], ["torp", 80, 0.9], ["trad", 180, 1.0]]}, {"x_etikett": "Ångan", "tid": "1769", "plats": "Storbritannien", "rubrik": "Ångmaskinen", "fakta": ["James Watt förbättrar ångmaskinen. Man bränner kol för att koka vatten. Ångan driver maskinen.", "Förut behövde fabriker vind eller vattenfall. Ångmaskinen kan stå nästan var som helst. Därför byggs fabriker nu i städer."], "fraga": "Varför var ångmaskinen så viktig?", "alt": ["Den behövde inget bränsle", "Fabriker kunde ligga var som helst, inte bara vid vattenfall", "Den var gratis att köpa"], "ratt": 1, "forklaring": "Ångmaskinen kunde stå var som helst och gav jämn kraft.", "ord": [["ångmaskin", "maskin som drivs av het vattenånga"]], "deko": [["fabrik", -100, 1.2], ["skorstenar", 100, 1.0]]}, {"x_etikett": "Tåget", "tid": "1830", "plats": "Manchester", "rubrik": "Järnvägen kommer", "fakta": ["Banan mellan Liverpool och Manchester öppnas. Tåget går snabbare än en häst.", "Varor och människor kan nu resa långt på kort tid. Fabrikerna kan sälja sina varor över hela landet."], "fraga": "Vad ändrade järnvägen?", "alt": ["Varor och människor kunde färdas snabbt och långt", "Fabrikerna stängde", "Alla blev rika"], "ratt": 0, "forklaring": "Järnvägen band ihop orter och marknader.", "deko": [["lok", -80, 1.2], ["folkmassa", 120, 0.9]]}, {"x_etikett": "Fabriken", "tid": "1833", "plats": "Manchester", "rubrik": "Arbetet i fabriken", "fakta": ["Du arbetar tolv timmar om dagen vid en maskin. Barn arbetar bredvid dig.", "Samma år kommer en ny lag. Barn under nio år får inte längre arbeta i textilfabriker. Inspektörer ska kontrollera att fabrikerna följer lagen."], "fraga": "Vad bestämde fabrikslagen 1833?", "alt": ["Att barn under nio år inte fick arbeta i textilfabriker", "Att alla fabriker skulle stängas", "Att kvinnor fick rösta"], "ratt": 0, "forklaring": "Lagen satte en åldersgräns för barn och krävde inspektörer.", "ord": [["textilfabrik", "fabrik som gör tyg och kläder"]], "deko": [["fabrik", -60, 1.3], ["skorstenar", 130, 1.1]]}, {"x_etikett": "Staden", "tid": "1850", "plats": "En industristad", "rubrik": "Arbetarkvarteren", "fakta": ["Familjen har flyttat från landet till staden för att jobba i fabriken. Ni bor trångt. Det finns ont om rent vatten.", "När många flyttar från landsbygd till stad kallas det urbanisering. Staden växer snabbt, men många är sjuka och fattiga."], "fraga": "Vad kallas det när människor flyttar från landsbygd till stad?", "alt": ["Emigration (flytt till ett annat land)", "Urbanisering", "Industrialisering (när fabriker tar över)"], "ratt": 1, "forklaring": "Urbanisering betyder att människor flyttar till städer.", "ord": [["urbanisering", "att fler och fler människor flyttar till städer"]], "deko": [["arbetarhus", -80, 1.1], ["skorstenar", 100, 1.2], ["folkmassa", 190, 0.8]]}, {"x_etikett": "Norrland", "tid": "1879", "plats": "Sundsvall", "rubrik": "Sågverken och strejken", "fakta": ["I Sverige växer sågverken längs Norrlandskusten. Tusentals arbetar hårt och får låg lön.", "Våren 1879 strejkar många arbetare. Det betyder att de slutar arbeta tills de får bättre villkor. Strejken slås ned med hjälp av militär."], "fraga": "Vad är en strejk?", "alt": ["Att arbetarna slutar arbeta för att få igenom sina krav", "Att ägaren stänger fabriken", "Att man flyttar utomlands"], "ratt": 0, "forklaring": "Vid en strejk slutar arbetarna arbeta för att få igenom krav.", "ord": [["strejk", "arbetare slutar arbeta för att få bättre lön eller villkor"]], "deko": [["gran", -120, 1.2], ["angbat", 90, 1.0], ["hamn", 190, 0.9]]}, {"x_etikett": "Amerika", "tid": "1887", "plats": "Göteborgs hamn", "rubrik": "Sammanfattning: ett nytt samhälle", "fakta": ["Svenska emigranter går ombord på ångbåtar mot Amerika. De vill hitta arbete och ett bättre liv.", "Industrialiseringen gav fabriker, städer och arbetarrörelse. Den gav också högre levnadsstandard, men leder till miljöproblem."], "ord": [["industrialisering", "när fabriker och maskiner tar över arbetet"], ["emigrant", "person som flyttar till ett annat land"]], "deko": [["angbat", -60, 1.3], ["hamn", 120, 1.0], ["folkmassa", 200, 0.8]]}], "diskutera": "Industrialiseringen gav oss både bättre levnadsstandard och miljöproblem. Vem ska ta ansvar för det i dag?", "id": "historia-07-industrialiseringen"};</script>
