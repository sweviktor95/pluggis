<script>window.SCEN={"titel": "Tidsresa genom Paris 1789", "plats": "Paris och Versailles", "tid": "1789–1799", "sky": ["#c9d7ee", "#e9d6b5"], "mark": "#8e8a7a", "walker": {"typ": "medborgare"}, "etapper": [{"x_etikett": "Våren", "tid": "Våren 1789", "plats": "Marknad i Paris", "rubrik": "Brödet är dyrt", "fakta": ["Du går över marknaden i Paris. Brödet är så dyrt att en arbetare lägger en stor del av lönen på det.", "Adeln betalar nästan inga skatter, men folket betalar mycket. Många tycker att det är orättvist."], "fraga": "Vad var en orsak till missnöjet i Frankrike?", "alt": ["Dyrt bröd och orättvisa skatter", "Brist på tåg", "Att kungen var för snäll"], "ratt": 0, "forklaring": "Dyrt bröd och orättvisa skatter gjorde folk arga.", "ord": [["adel", "rika och mäktiga släkter med särskilda rättigheter"]], "deko": [["marknad", -100, 1.2], ["folkmassa", 90, 1.0], ["slott", 210, 0.9]]}, {"x_etikett": "Juni", "tid": "Maj–juni 1789", "plats": "Versailles", "rubrik": "Det tredje ståndet säger ifrån", "fakta": ["Kungen har kallat till möte. Där finns tre grupper, kallade stånd: prästerna, adeln och alla andra (det tredje ståndet).", "Varje grupp har en röst. Prästerna och adeln röstar oftast ihop och vinner. Det tredje ståndet är nästan hela folket. Det bildar en egen nationalförsamling och kräver att få bestämma."], "fraga": "Varför bildade det tredje ståndet en nationalförsamling?", "alt": ["De var nästan hela folket men blev ändå överröstade", "De ville ha semester", "De ville bli adel"], "ratt": 0, "forklaring": "De var flest men hade minst inflytande, och ville ha makt.", "ord": [["stånd", "grupp i samhället: präster, adel eller alla andra"]], "deko": [["slott", -100, 1.3], ["folkmassa", 100, 1.0], ["flagga_trikolor", 210, 0.8]]}, {"x_etikett": "14 juli", "tid": "14 juli 1789", "plats": "Bastiljen", "rubrik": "Stormningen", "fakta": ["Rykten säger att kungen vill skicka soldater mot folket. Folk söker vapen och går till fängelset Bastiljen.", "Bastiljen är ett gammalt fängelse mitt i Paris. Där sitter få fångar. Men många ser det som en symbol för kungens makt. Folket stormar det."], "fraga": "Varför var Bastiljen viktig?", "alt": ["Den var en symbol för kungens makt", "Den var full av guld", "Den var kungens slott"], "ratt": 0, "forklaring": "Stormningen visade att folket kunde utmana kungen.", "deko": [["mur", -100, 1.4], ["folkmassa", 70, 1.1], ["barrikad", 190, 1.0]]}, {"x_etikett": "26 aug", "tid": "26 augusti 1789", "plats": "Nationalförsamlingen", "rubrik": "Rättigheter på papper", "fakta": ["Nationalförsamlingen skriver ner vilka rättigheter alla människor har. Texten heter deklarationen om människans och medborgarens rättigheter.", "Idéerna kommer från upplysningen. Upplysningen är en tankerörelse som säger att alla människor föds fria och lika. Men kvinnor och slavar nämns inte i texten."], "fraga": "Vilka idéer bygger deklarationen på?", "alt": ["Upplysningens idéer om frihet och lika rättigheter", "Idén att kungen bestämmer allt", "Idén att det inte ska finnas lagar"], "ratt": 0, "forklaring": "Deklarationen bygger på upplysningen. Den blev förebild för senare rättighetstexter.", "ord": [["upplysning", "tankerörelse: förnuft, frihet och lika rättigheter för alla"], ["deklaration", "en officiell skrift som slår fast något viktigt"]], "deko": [["tryckpress", -110, 1.1], ["bokhylla", 70, 1.1], ["flagga_trikolor", 200, 0.9]]}, {"x_etikett": "Oktober", "tid": "5–6 oktober 1789", "plats": "Vägen till Versailles", "rubrik": "Kvinnorna marscherar", "fakta": ["Tusentals kvinnor från Paris går till Versailles. Det är långt att gå. Barnen är hungriga och brödet är dyrt.", "Kvinnorna kräver bröd. De får kungen och hans familj att flytta till Paris. Kvinnor spelar en viktig roll, men de får ändå inte rösta."], "fraga": "Vad ville kvinnorna som gick till Versailles?", "alt": ["Bröd och förändring", "Nya hattar", "Att kungen skulle resa på semester"], "ratt": 0, "forklaring": "Brist på mat drev dem. Kvinnor var viktiga i revolutionen.", "deko": [["folkmassa", -100, 1.2], ["slott", 120, 1.2], ["moln", 220, 0.9]]}, {"x_etikett": "1793", "tid": "1793–1794", "plats": "Paris, torget", "rubrik": "Skräckväldet", "fakta": ["Frankrike är nu en republik. Kungen är avrättad och landet är i krig. Folk är rädda för att bli anklagade.", "Revolutionens ledare dömer tusentals till döden med giljotinen. De säger att de är revolutionens fiender. Till slut avrättas även ledaren Robespierre."], "fraga": "Varför kallas åren 1793–94 skräckväldet?", "alt": ["Många dömdes till döden som sades vara revolutionens fiender", "Det var Halloween", "Det var krig mot Sverige"], "ratt": 0, "forklaring": "Rädsla och krig gjorde revolutionen hård. Många dödades.", "ord": [["republik", "land utan kung där folket väljer sina ledare"]], "deko": [["giljotin", -80, 1.2], ["folkmassa", 110, 1.0], ["flagga_trikolor", 220, 0.8]]}, {"x_etikett": "1799", "tid": "1799–1815", "plats": "Paris och Europa", "rubrik": "Napoleon och arvet", "fakta": ["Napoleon tar makten 1799, blir kejsare 1804 och förlorar vid Waterloo 1815. Idéerna om rättigheter finns kvar.", "Revolutionen inspirerade nya rörelser. Frågan om vem som räknas som medborgare ställdes om och om igen."], "fraga": null, "alt": null, "ratt": null, "forklaring": null, "deko": [["flagga_trikolor", -70, 1.0], ["bokhylla", 100, 1.0], ["folkmassa", 220, 0.9]]}], "diskutera": "Frihet, jämlikhet och broderskap var revolutionens ord. Tycker du att de gäller för alla i dag?", "id": "historia-06-upplysning-revolutioner"};</script>
