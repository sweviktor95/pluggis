<script>window.SCEN={"titel": "Tidsresa: en historikers arbete", "plats": "Från arkivet till utställningen", "tid": "Ett undersökningsprojekt", "sky": ["#c9d6e3", "#eadfc8"], "mark": "#7a6648", "walker": {"typ": "resenar"}, "etapper": [{"x_etikett": "Arkivet", "tid": "Dag 1", "plats": "Ett arkiv", "rubrik": "Frågan och arkivet", "fakta": ["Du är historiker. Du vill veta hur människor levde i en liten stad för 200 år sedan. Du går till ett arkiv, där gamla papper sparas.", "I arkivet finns tusentals brev och böcker. Du hinner inte läsa allt. Därför skriver du först en fråga: Vad arbetade och åt folk? Frågan visar vilka papper du ska läsa och vilka du kan lämna."], "ord": [["arkiv", "ett ställe där gamla papper och brev sparas"], ["källa", "något som berättar om det som hänt, till exempel ett brev"]], "fraga": "Varför börjar historikern med en fråga?", "alt": ["För att kunna välja de papper som hjälper till att svara", "För att kunna läsa allt i arkivet", "För att få svaret utan att leta"], "ratt": 0, "forklaring": "Frågan hjälper dig att välja rätt källor. Du hinner inte läsa allt.", "deko": [["bokhylla", -120, 1.2], ["slott", 160, 0.9]]}, {"x_etikett": "Fyndet", "tid": "Dag 4", "plats": "En byggarbetsplats", "rubrik": "Ett arkeologiskt fynd", "fakta": ["Arkeologer gräver på en byggarbetsplats. De hittar bitar av en kruka och ett gammalt golv.", "De mäter exakt var varje bit ligger och hur djupt. Ligger bitarna bredvid en gammal eldplats, vet de att krukan användes i ett kök. Om man lyfter upp saken utan att skriva ner var den låg, försvinner det beviset."], "ord": [["arkeolog", "forskare som gräver upp saker från förr"]], "fraga": "Varför är det viktigt att skriva ner var ett fynd ligger?", "alt": ["Platsen visar hur och när saken användes", "Då blir fyndet mer värt", "Då hittar man fler krukor"], "ratt": 0, "forklaring": "Platsen runt fyndet berättar vad det användes till.", "deko": [["amfora", -60, 1.0], ["torp", 120, 0.9], ["trad", 200, 1.0]]}, {"x_etikett": "Brevet", "tid": "Dag 9", "plats": "Ett dammigt förråd", "rubrik": "Brevet", "fakta": ["I en gammal kista hittar du ett brev från en handlare. Han skrev det själv för 200 år sedan.", "En primärkälla är gjord av någon som var med när det hände. En sekundärkälla är gjord senare av någon som inte var med, till exempel en lärobok."], "ord": [["primärkälla", "källa från någon som var med när det hände"], ["sekundärkälla", "källa som skrivits senare av någon som inte var med"]], "fraga": "Handlaren skrev brevet själv medan det hände. Vad är brevet för typ av källa?", "alt": ["Sekundärkälla", "Primärkälla", "Ingen källa alls"], "ratt": 1, "forklaring": "Brevet skrevs av någon som var med. Då är det en primärkälla.", "deko": [["marknad", -100, 1.0], ["kyrka", 150, 0.9]]}, {"x_etikett": "Datering", "tid": "Dag 14", "plats": "Laboratorium", "rubrik": "Hur gammalt är det?", "fakta": ["Nu vill du veta om brevet är äkta. Papperet och bläcket undersöks. Handstilen jämförs med andra brev.", "Källkritik betyder att pröva en källa med frågor. Äkthet: är den verklig, och när skrevs den? Tendens: vill skribenten få dig att tro något? Närhet: var skribenten själv med?"], "ord": [["källkritik", "att pröva om man kan lita på en källa"], ["äkthet", "att något är riktigt och inte falskt"]], "fraga": "Papper, bläck och handstil undersöks. Vilken källkritisk fråga prövar du?", "alt": ["Tendens", "Äkthet och tid", "Närhet"], "ratt": 1, "forklaring": "Du kontrollerar om brevet är äkta och när det skrevs.", "deko": [["skola", -80, 1.0], ["dator", 150, 0.8]]}, {"x_etikett": "Granskning", "tid": "Dag 20", "plats": "Arbetsrummet", "rubrik": "Kritisk granskning", "fakta": ["Du läser brevet noga. Handlaren skriver att hans konkurrent är en tjuv.", "Handlaren tjänar på att konkurrenten får dåligt rykte. Det kallas tendens. Kanske har han överdrivit eller ljugit. Du vet inte om det stämmer."], "ord": [["konkurrent", "någon som säljer samma sak som du"], ["tendens", "att skribenten vill påverka dig eller tjäna på det"]], "fraga": "Vad bör du göra med påståendet att konkurrenten är en tjuv?", "alt": ["Tro på det rakt av", "Jämföra med andra källor", "Slänga hela brevet"], "ratt": 1, "forklaring": "Handlaren kan ha tendens. Därför jämför du med andra källor.", "deko": [["bokhylla", -110, 1.1], ["marknad", 120, 0.9]]}, {"x_etikett": "Tolkning", "tid": "Dag 30", "plats": "Skrivbordet", "rubrik": "Orsaker och tolkning", "fakta": ["Du lägger ihop brevet, fynden och andra papper. Du ser att staden växte när handeln ökade.", "Fakta är sådant du kan visa med källor, till exempel att brevet finns. En tolkning är din slutsats, till exempel varför staden växte. Du skriver tydligt vilket som är vilket."], "ord": [["tolkning", "en slutsats du drar utifrån källorna"], ["belagt", "visat med hjälp av källor"]], "fraga": "Varför ska en historiker skilja på fakta och tolkning?", "alt": ["Så att läsaren ser vad som är belagt och vad som är en slutsats", "Så att osäkra delar döljs", "Så att texten blir längre"], "ratt": 0, "forklaring": "Då kan andra kontrollera vad som är belagt och vad som är en slutsats.", "deko": [["hamn", -90, 1.0], ["segelfartyg", 140, 0.9]]}, {"x_etikett": "Utställning", "tid": "Dag 60", "plats": "Ett museum", "rubrik": "Utställningen", "fakta": ["Brevet och fynden visas på ett museum. Du väljer vad som ska visas och hur du berättar det.", "Besökarna ser en berättelse. Det du lämnar utanför syns inte. Därför är ett urval alltid ett val."], "ord": [["urval", "att välja ut en del och lämna resten"]], "fraga": "", "alt": [], "ratt": 0, "forklaring": "", "deko": [["folkmassa", -60, 1.0], ["kamera", 130, 0.8], ["bokhylla", 210, 1.0]]}], "diskutera": "Vad väljer ett museum att visa, och vad kan hamna utanför? Hur kan du som besökare ta reda på mer om det du ser?", "id": "historia-01-verktyg"};</script>
