 ["Papperet och bläcket undersöks, och handstilen jämförs med andra dokument.", "Namn och datum i texten kontrolleras mot andra källor."], "fraga": "Vilken källkritisk fråga prövas här?", "alt": ["Tendens", "Äkthet och tid", "Konsekvens"], "ratt": 1, "forklaring": "Man kontrollerar om brevet är äkta och när det skrevs.", "deko": [["skola", -80, 1.0], ["dator", 150, 0.8]]}, {"x_etikett": "Granskning", "tid": "Dag 20", "plats": "Arbetsrummet", "rubrik": "Kritisk granskning", "fakta": ["Du läser brevet noga. Handlaren skriver att hans konkurrent är en tjuv.", "Du undrar: Har han tendens? Hade han något att vinna på att skriva så?"], "fraga": "Vad bör du göra med handlarens påstående?", "alt": ["Tro på det rakt av", "Jämföra med andra källor", "Strunta i hela brevet"], "ratt": 1, "forklaring": "Brevet är användbart men måste jämföras, särskilt när det finns tendens.", "deko": [["bokhylla", -110, 1.1], ["marknad", 120, 0.9]]}, {"x_etikett": "Tolkning", "tid": "Dag 30", "plats": "Skrivbordet", "rubrik": "Orsaker och tolkning", "fakta": ["Du sätter ihop brevet, fynden och andra dokument. Staden växte eftersom handeln ökade.", "Du skiljer fakta från tolkning och skriver tydligt vad som är osäkert."], "fraga": "Varför ska en historiker skilja på fakta och tolkning?", "alt": ["För att visa vad som är belagt och vad som är en slutsats", "För att dölja osäkerhet", "För att göra texten längre"], "ratt": 0, "forklaring": "Det gör att andra kan kontrollera och pröva resonemanget.", "deko": [["hamn", -90, 1.0], ["segelfartyg", 140, 0.9]]}, {"x_etikett": "Utställning", "tid": "Dag 60", "plats": "Ett museum", "rubrik": "Utställningen", "fakta": ["Brevet och fynden visas på museet. Du väljer vad som ska berättas och hur.", "Besökarna får se en berättelse. Då har du också gjort ett val om vad som lämnas utanför."], "fraga": "", "alt": [], "ratt": 0, "forklaring": "", "deko": [["folkmassa", -60, 1.0], ["kamera", 130, 0.8], ["bokhylla", 210, 1.0]]}], "diskutera": "Vilka val gör en historiker eller ett museum när de berättar en historia, och hur kan du som besökare granska vad du ser?", "id": "historia-01-verktyg"};</script>
