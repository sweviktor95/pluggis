<script>window.SCEN={"titel": "Tidsresa genom kalla kriget", "plats": "Europa och världen", "tid": "1945–1991", "sky": ["#7aa6c9", "#d9e6f2"], "mark": "#8a8f87", "walker": {"typ": "resenar"}, "etapper": [{"x_etikett": "Jalta", "tid": "1945", "plats": "Jalta och Potsdam", "rubrik": "Stormakterna delar upp efterkrigsvärlden", "fakta": ["Andra världskriget är slut. Ledarna för USA, Storbritannien och Sovjetunionen möts i Jalta och Potsdam för att bestämma hur freden ska se ut.", "Tyskland delas i fyra zoner. USA, Storbritannien, Frankrike och Sovjetunionen får en zon var. Berlin delas på samma sätt. Sovjetunionen lovar fria val i Östeuropa, men löftet hålls inte alltid."], "fraga": "Vad bestämdes om Tyskland?", "alt": ["Det delades i fyra zoner, en för varje segrarmakt", "Det blev ett enda starkt land igen", "Det blev en del av Sovjetunionen"], "ratt": 0, "forklaring": "Tyskland och Berlin delades i fyra zoner, en för varje segrande makt.", "ord": [["zon", "ett område som en viss stat styr"]], "deko": [["soldat_grupp", -120, 1.0], ["flagga_rod", 100, 1.0], ["villa", 200, 1.1]]}, {"x_etikett": "Berlin", "tid": "1948–49", "plats": "Berlin", "rubrik": "Luftbron till Västberlin", "fakta": ["Berlin ligger mitt i den sovjetiska zonen. Västberlin styrs av USA, Storbritannien och Frankrike.", "Sovjetunionen stänger alla vägar och järnvägar till Västberlin. Då flyger västmakterna in mat och kol i nästan ett år. Flygbron kallas luftbron."], "fraga": "Hur fick Västberlin mat under blockaden?", "alt": ["Med flygplan, i en luftbro", "Med tåg från Moskva", "Med lastbilar genom en tunnel"], "ratt": 0, "forklaring": "Flygplan flög in det som behövdes tills Sovjetunionen avbröt blockaden.", "ord": [["blockad", "när man stänger vägar så att inga varor kommer fram"]], "deko": [["flygplan_modernt", -100, 1.2], ["mur", 150, 1.0]]}, {"x_etikett": "Accra", "tid": "1957", "plats": "Ghana", "rubrik": "Ghana blir fritt", "fakta": ["Du är i Accra i Ghana i Afrika. Ghana har varit en brittisk koloni. Nu leder Kwame Nkrumah landet till frihet.", "Ghana blir 1957 den första kolonin i Afrika söder om Sahara som blir självständig. Efter det följer många fler afrikanska länder."], "fraga": "Varför är Ghana 1957 en viktig händelse?", "alt": ["Det var den sista kolonin i Afrika som blev fri", "Det var den första kolonin söder om Sahara som blev självständig", "Det var första landet som gick med i NATO"], "ratt": 1, "forklaring": "Ghana blev ett exempel för andra afrikanska länder som ville bli fria.", "ord": [["koloni", "land som styrs av ett annat land långt borta"], ["självständig", "helt fri och styr sig själv"]], "deko": [["palm", -150, 1.2], ["folkmassa", 0, 1.0], ["flagga_trikolor", 160, 0.9]]}, {"x_etikett": "Berlinmuren", "tid": "1961", "plats": "Berlin", "rubrik": "Muren byggs", "fakta": ["Många människor flyr från Östtyskland till Västtyskland via Berlin. Det går lätt, för gränsen i Berlin är öppen.", "I augusti 1961 bygger Östtyskland en mur runt Västberlin. Nu kan folk inte längre fly. Familjer och vänner skiljs åt."], "fraga": "Varför byggde Östtyskland muren?", "alt": ["För att stoppa människor från att fly till väst", "För att skydda staden mot översvämning", "För att få fler turister"], "ratt": 0, "forklaring": "Många östtyskar flydde via Berlin. Muren stoppade flykten.", "deko": [["mur", -60, 1.5], ["taggtrad", 100, 1.0], ["soldat_grupp", 200, 0.9]]}, {"x_etikett": "Kuba", "tid": "1962", "plats": "Karibien", "rubrik": "Kubakrisen", "fakta": ["USA upptäcker att Sovjetunionen sätter upp kärnvapenrobotar på Kuba, nära USA. Världen är rädd för ett kärnvapenkrig.", "Efter ungefär tretton dagar enas ledarna. Sovjetunionen tar bort robotarna. USA lovar att inte invadera Kuba."], "fraga": "Hur löstes Kubakrisen?", "alt": ["Båda sidor gjorde en överenskommelse och robotarna drogs bort", "USA och Sovjetunionen gick ut i krig", "FN-soldater tog över Kuba"], "ratt": 0, "forklaring": "Sovjetunionen tog bort robotarna och USA lovade att inte invadera Kuba.", "ord": [["kärnvapen", "extremt kraftfulla bomber som kan förstöra hela städer"]], "deko": [["raket", -110, 1.3], ["segelfartyg", 120, 1.0], ["palm", 230, 1.0]]}, {"x_etikett": "9 nov", "tid": "1989", "plats": "Berlin", "rubrik": "Muren öppnas", "fakta": ["Under 1989 protesterar många östtyskar mot regeringen. Kvällen den 9 november 1989 går tusentals människor till gränsen vid muren.", "Vakterna öppnar gränsen. Människor firar och klättrar på muren. Året därpå blir Tyskland ett land igen."], "fraga": "Vad hände i Berlin den 9 november 1989?", "alt": ["Muren började byggas", "Gränsen öppnades och muren föll", "Sovjetunionen upplöstes"], "ratt": 1, "forklaring": "Östtyskland öppnade gränsen efter stora protester från folket.", "deko": [["folkmassa", -80, 1.3], ["mur", 100, 1.3], ["flagga_rod", 230, 0.8]]}, {"x_etikett": "1991", "tid": "1991", "plats": "Moskva", "rubrik": "Sovjetunionen upplöses", "fakta": ["Efter ett misslyckat försök att ta makten med våld (en kupp) upplöses Sovjetunionen i december 1991.", "Femton nya stater bildas, bland dem Ryssland och Ukraina. Det kalla kriget är över."], "fraga": "", "alt": [], "ratt": 0, "forklaring": "", "deko": [["flagga_trikolor", -100, 1.0], ["riksdagshus", 120, 1.1], ["folkmassa", 230, 1.0]]}], "diskutera": "Vilka händelser på resan tror du gjorde att kalla kriget tog slut? Förklara varför.", "id": "historia-13-kalla-kriget"};</script>
