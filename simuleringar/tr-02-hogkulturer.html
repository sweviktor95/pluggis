<script>window.SCEN={"titel": "Tidsresa genom flodkulturerna", "plats": "Uruk, Giza, Mohenjo-daro, Ur, Babylon och Anyang", "tid": "Ca 3000–1200 f.Kr.", "sky": ["#f3d9a8", "#f8ecd0"], "mark": "#c8a56a", "walker": {"typ": "handlare"}, "etapper": [{"x_etikett": "Uruk", "tid": "Ca 3000 f.Kr.", "plats": "Uruk i Sumer", "rubrik": "Skrift i templet", "fakta": ["Du är handlare och kommer till Uruk, en av världens första städer. Skrivare trycker tecken i våt lera. Det kallas kilskrift.", "Tavlorna visar hur mycket säd och boskap templet får in och ger ut. Skriften hjälper människor att komma ihåg. Du betalar med säd och får en lertavla som kvitto."], "ord": [["kilskrift", "skrift av kilformade märken i lera"], ["Mesopotamien", "landet mellan floderna Eufrat och Tigris"]], "fraga": "Varför började man skriva i Mesopotamien?", "alt": ["För att hålla reda på varor och betalningar", "För att skriva sagor och dikter", "För att skicka brev till kungen"], "ratt": 0, "forklaring": "De äldsta tavlorna är listor över varor och betalningar.", "deko": [["ziggurat", -60, 1.2], ["flod", 120, 1.0], ["palm", 200, 0.9]], "kart": [45.64, 31.32, 230], "zon": [[45.0, 31.6, 2.6, 1.6]]}, {"x_etikett": "Giza", "tid": "Ca 2550 f.Kr.", "plats": "Giza, Egypten", "rubrik": "Pyramiden vid Nilen", "fakta": ["Du seglar på Nilen. På stranden reser sig en jättestor pyramid. Den byggdes åt farao Khufu, som också kallas Cheops.", "Khufu skulle vila i pyramiden efter sin död. Arbetarna bodde i närheten och fick mat. De var inte slavar."], "ord": [["farao", "Egyptens kung, som sågs som en gud"]], "fraga": "Vad var Cheopspyramiden?", "alt": ["En grav åt farao", "Ett lager för säd", "En skola"], "ratt": 0, "forklaring": "Pyramiden var en grav åt farao Khufu.", "deko": [["pyramid", -80, 1.4], ["sphinx", 120, 1.0], ["nilbat", 220, 1.0]], "kart": [31.13, 29.98, 230], "zon": [[31.2, 27.5, 2.2, 4.2]]}, {"x_etikett": "Mohenjo-daro", "tid": "Ca 2500 f.Kr.", "plats": "Indusdalen", "rubrik": "Staden med avlopp", "fakta": ["I Mohenjo-daro i Indusdalen ligger gatorna i rutnät. Husen är byggda av tegel. Under gatorna finns avlopp.", "Staden var planerad innan den byggdes. Du köper en sigillstämpel med tecken på. Ingen kan läsa dem idag."], "ord": [["sigill", "stämpel som man trycker i lera, ungefär som en namnteckning"]], "fraga": "Vad var ovanligt med Indusdalens städer?", "alt": ["De var planerade, med rutnät och avlopp", "De hade en jättelik pyramid i mitten", "Husen var av trä och låg huller om buller"], "ratt": 0, "forklaring": "Städerna var planerade i rutnät och hade avlopp.", "deko": [["marknad", -80, 1.0], ["flod", 140, 1.0]], "kart": [68.1, 27.33, 260], "zon": [[68.0, 27.5, 4.5, 4.2]]}, {"x_etikett": "Ur", "tid": "Ca 2100 f.Kr.", "plats": "Ur i Sumer", "rubrik": "Ziggurat i Ur", "fakta": ["I staden Ur står ett högt tempel av tegel. Det kallas ziggurat. Den är byggd som en stor trappa, med ett litet tempel längst upp.", "Zigguraten byggdes för månguden Nanna. Prästerna har stor makt. Kungen ser sig som gudarnas tjänare."], "ord": [["ziggurat", "högt tempel av tegel, byggt som en trappa"], ["präst", "person som tar hand om templet och ber till gudarna"]], "fraga": "Vad är en ziggurat?", "alt": ["Ett tempel byggt som en stor trappa", "En kanal för vatten", "En marknadsplats"], "ratt": 0, "forklaring": "En ziggurat var ett tempel av tegel som var byggt som en trappa.", "deko": [["ziggurat", -60, 1.5], ["palm", 150, 0.9]], "kart": [46.1, 30.96, 200], "zon": [[45.0, 31.6, 2.6, 1.6]]}, {"x_etikett": "Babylon", "tid": "Ca 1750 f.Kr.", "plats": "Babylon", "rubrik": "Hammurabis lagar", "fakta": ["I Babylon har kung Hammurabi låtit resa en stenstod med ungefär 282 lagar. Alla kan se den.", "Straffen är inte lika för alla. Straffet beror på om den som blev skadad är en fri man eller en slav."], "ord": [["klass", "grupp i samhället med egna rättigheter"]], "fraga": "Vad visar lagarna om samhället?", "alt": ["Att alla behandlades lika", "Att samhället var uppdelat i grupper med olika rättigheter", "Att det inte fanns några lagar"], "ratt": 1, "forklaring": "Straffen berodde på om man var fri eller slav. Samhället hade olika grupper.", "deko": [["slott", -80, 1.2], ["folkmassa", 120, 1.0]], "kart": [44.42, 32.54, 200], "zon": [[44.0, 32.0, 2.8, 1.8]]}, {"x_etikett": "Anyang", "tid": "Ca 1200 f.Kr.", "plats": "Anyang vid Gula floden", "rubrik": "Orakelben i Kina", "fakta": ["Under Shangdynastin i Kina ristar skrivare frågor till förfäderna på ben och sköldpaddsskal. Det kan gälla skörden eller kriget.", "De värmer benet tills det spricker. Sprickorna läses som svar. Benen kallas orakelben och är de äldsta kinesiska texterna vi känner till."], "ord": [["förfäder", "släktingar som levde för länge sedan"], ["dynasti", "kungaätt som styr under lång tid"]], "fraga": "Hur fick skrivarna svar från förfäderna?", "alt": ["De läste sprickorna i det heta benet", "De läste en lertavla", "De frågade en präst i templet"], "ratt": 0, "forklaring": "Benet värmdes tills det sprack. Sprickorna tolkades som svar.", "deko": [["flod", -90, 1.0], ["bondgard", 110, 1.0], ["berg", 210, 1.1]], "kart": [114.35, 36.1, 260], "zon": [[112.5, 35.5, 4.0, 3.0]]}, {"x_etikett": "Arvet", "tid": "Idag", "plats": "Din skola", "rubrik": "Vad lever kvar?", "fakta": ["Du kommer hem och berättar vad du sett. Mycket har förändrats. Men skrift, lagar och kalendrar finns kvar.", "Vi vet bara en del. Många källor har gått förlorade eller är ännu inte hittade."], "ord": [["arv", "något från förr som finns kvar idag"]], "fraga": "", "alt": [], "ratt": 0, "forklaring": "", "deko": [["skola", -70, 1.0], ["bokhylla", 100, 1.0], ["dator", 200, 0.8]], "kart": [18.07, 59.33, 330], "zon": []}], "diskutera": "Vad var lika och vad var olika i Sumer, Egypten, Indusdalen och Kina? Vad använder du själv varje dag som kommer därifrån?", "id": "historia-02-hogkulturer"};</script>
