<script>window.SCEN={"titel": "Tidsresa genom flodkulturerna", "plats": "Uruk, Giza, Mohenjo-daro, Ur, Babylon och Anyang", "tid": "Ca 3000–1200 f.Kr.", "sky": ["#f3d9a8", "#f8ecd0"], "mark": "#c8a56a", "walker": {"typ": "handlare"}, "intro": "Följ med genom 1 800 år och se hur de första samhällena växte fram på olika platser. Titta på tidslinjen längst ner: den visar hur långt det är mellan platserna i tid. Fråga dig hela tiden: Hur styrdes samhället? Vad skiljer det från Sverige idag?", "etapper": [{"x_etikett": "Uruk", "tid": "Ca 3000 f.Kr.", "y": -3000, "plats": "Uruk i Sumer", "rubrik": "Staden som behövde skrift", "fakta": ["Du är handlare och kommer till Uruk, en av världens första städer. Bönderna lämnar en del av skörden till templet, som lagrar den. Någon måste hålla reda på vem som lämnat vad.", "Därför trycker skrivare tecken i våt lera. Det kallas kilskrift. Skriften uppstod alltså för att samhället blev för stort för att man skulle kunna komma ihåg allt. Idag sparar vi också sådant i register och databaser."], "ord": [["kilskrift", "skrift av kilformade märken i lera"], ["Mesopotamien", "landet mellan floderna Eufrat och Tigris"]], "fraga": "Varför behövdes skriften i Uruk?", "alt": ["Samhället var så stort att man behövde hålla reda på varor och skatt", "Man ville skriva romaner", "Kungen ville ha brev från andra länder"], "ratt": 0, "forklaring": "Skriften började som listor över säd, djur och betalningar. Stora samhällen behöver register.", "deko": [["ziggurat", -60, 1.2], ["flod", 120, 1.0], ["palm", 200, 0.9]], "kart": [45.64, 31.32, 230], "zon": [[45.0, 31.6, 2.6, 1.6]]}, {"x_etikett": "Giza", "tid": "Ca 2550 f.Kr.", "y": -2550, "plats": "Giza, Egypten", "rubrik": "En kung som styr ett helt land", "fakta": ["Du seglar på Nilen. Egypten styrs av en enda kung, farao, som ses som en gud. Hans tjänstemän samlar in skatt i form av säd och arbete, och lagrar maten.", "Pyramiden vid Giza är en grav åt farao Khufu. Den visar hur stor makt staten hade: tusentals arbetare fick mat och bostad medan de byggde. Det var inte slavar, enligt forskare idag. Idag betalar vi skatt i pengar, och våra ledare väljer vi själva."], "ord": [["farao", "Egyptens kung, som sågs som en gud"], ["skatt", "pengar, varor eller arbete som man lämnar till staten"]], "fraga": "Vad visar pyramiden om samhället?", "alt": ["Att kungen kunde samla och försörja tusentals arbetare", "Att alla i Egypten var lika rika", "Att det inte fanns någon stat"], "ratt": 0, "forklaring": "Bara en stark stat med skatter och lager kunde organisera ett så stort bygge.", "deko": [["pyramid", -80, 1.4], ["sphinx", 120, 1.0], ["nilbat", 220, 1.0]], "kart": [31.13, 29.98, 230], "zon": [[31.2, 27.5, 2.2, 4.2]]}, {"x_etikett": "Mohenjo-daro", "tid": "Ca 2500 f.Kr.", "y": -2500, "plats": "Indusdalen", "rubrik": "Ett samhälle vi knappt förstår", "fakta": ["I Mohenjo-daro i Indusdalen ligger gatorna i rutnät, med avlopp under. Husen är byggda av tegel av samma storlek, och man använde likadana vikter. Staden måste ha varit planerad av någon.", "Men någon tydlig kungagrav eller palats har inte hittats, och skriften på sigillen kan ingen läsa. Forskare är därför oense om hur samhället styrdes. Här ser du hur källorna sätter gränser för vad vi vet."], "ord": [["sigill", "stämpel som man trycker i lera, ungefär som en namnteckning"]], "fraga": "Varför vet vi så lite om hur Indusdalen styrdes?", "alt": ["Skriften har inte kunnat tydas och vi har få andra källor", "Det fanns aldrig någon stad där", "Allt har skrivits ned i böcker som vi läser"], "ratt": 0, "forklaring": "Utan läsbar skrift kan vi bara gissa utifrån husen och föremålen.", "deko": [["marknad", -80, 1.0], ["flod", 140, 1.0]], "kart": [68.1, 27.33, 260], "zon": [[68.0, 27.5, 4.5, 4.2]]}, {"x_etikett": "Ur", "tid": "Ca 2100 f.Kr.", "y": -2100, "plats": "Ur i Sumer", "rubrik": "De första nedskrivna lagarna", "fakta": ["I staden Ur styr kung Ur-Nammu. Han låter skriva ned lagar. Det är de äldsta lagar vi känner till. Många straff är böter i silver, så den som har skadat någon kan betala i stället för att själv skadas.", "Tempel och ziggurat visar att religionen är en del av makten: kungen ses som gudarnas tjänare. Lagarna var nedskrivna, så fler kunde veta vad som gällde. Idag skriver riksdagen våra lagar, och vem som helst kan läsa dem."], "ord": [["ziggurat", "högt tempel av tegel, byggt som en trappa"], ["böter", "straff där man betalar pengar eller varor"]], "fraga": "Vad var nytt med att skriva ned lagarna?", "alt": ["Fler kunde veta vad som gällde, inte bara kungen", "Ingen behövde följa dem", "De gällde bara templet"], "ratt": 0, "forklaring": "Nedskrivna lagar är mer förutsägbara än att kungen bestämmer från fall till fall.", "deko": [["ziggurat", -60, 1.5], ["palm", 150, 0.9]], "kart": [46.1, 30.96, 200], "zon": [[45.0, 31.6, 2.6, 1.6]]}, {"x_etikett": "Babylon", "tid": "Ca 1750 f.Kr.", "y": -1750, "plats": "Babylon", "rubrik": "Lagar för olika grupper", "fakta": ["I Babylon låter kung Hammurabi resa en stenstod med ungefär 282 lagar. Alla kan se den. Överst visas Hammurabi framför solguden Shamash. Det ska visa att lagarna är rättvisa och har stöd av gudarna.", "Straffen är inte lika för alla. De beror på om den som blev skadad är en fri man, en vanlig person eller en slav. Idag gäller principen att alla är lika inför lagen. Men nedskrivna lagar finns kvar i flera tusen år."], "ord": [["klass", "grupp i samhället med egna rättigheter"]], "fraga": "Vad visar Hammurabis lagar om samhället?", "alt": ["Att samhället var uppdelat i grupper med olika rättigheter", "Att alla behandlades lika", "Att det inte fanns några lagar"], "ratt": 0, "forklaring": "Straffen berodde på om man var fri eller slav. Samhället hade tydliga klasser.", "deko": [["slott", -80, 1.2], ["folkmassa", 120, 1.0]], "kart": [44.42, 32.54, 200], "zon": [[44.0, 32.0, 2.8, 1.8]]}, {"x_etikett": "Anyang", "tid": "Ca 1200 f.Kr.", "y": -1200, "plats": "Anyang vid Gula floden", "rubrik": "Kungen och förfäderna", "fakta": ["I Kina, långt från Mesopotamien, styr Shangdynastins kung. Skrivare ristar frågor till förfäderna på ben, till exempel om skörden eller kriget. Benen värms tills de spricker, och sprickorna tolkas som svar.", "Kungen styr med stöd av förfäderna. Senare, under Zhoudynastin, uppstod idén att kungen styr med ”himlens mandat”. Styr han dåligt kan han förlora makten. Här ser du att olika samhällen hittade på olika sätt att förklara varför en härskare får bestämma."], "ord": [["förfäder", "släktingar som levde för länge sedan"], ["dynasti", "kungaätt som styr under lång tid"]], "fraga": "Vad använde Shangkungen orakelbenen till?", "alt": ["Att fråga förfäderna om viktiga beslut och få stöd för sin makt", "Att skicka brev", "Att räkna skatt"], "ratt": 0, "forklaring": "Religionen gav kungen stöd för sina beslut, ungefär som gudarna gjorde i Mesopotamien.", "deko": [["flod", -90, 1.0], ["bondgard", 110, 1.0], ["berg", 210, 1.1]], "kart": [114.35, 36.1, 260], "zon": [[112.5, 35.5, 4.0, 3.0]]}, {"x_etikett": "Arvet", "tid": "Idag", "plats": "Din skola", "rubrik": "Lika och olika", "fakta": ["Titta på tidslinjen och på platserna på kartan. Floddalarna låg långt ifrån varandra, men samhällena liknade varandra: stad, skatt, skrift, lagar, tempel och en härskare.", "Det som skiljer från Sverige idag är att vi har demokrati, att alla är lika inför lagen och att skolan är till för alla. Mycket har alltså förändrats. Men skrift, nedskrivna lagar och skatt finns kvar. Och vi vet bara en del, eftersom många källor har gått förlorade."], "ord": [["arv", "något från förr som finns kvar idag"]], "fraga": "", "alt": [], "ratt": 0, "forklaring": "", "deko": [["skola", -70, 1.0], ["bokhylla", 100, 1.0], ["dator", 200, 0.8]], "kart": [18.07, 59.33, 330], "zon": []}], "diskutera": "Vad var lika i Sumer, Egypten, Indusdalen och Kina, fast de låg långt från varandra? Vad var annorlunda än i Sverige idag? Vem fick bestämma, och varför ansåg man att det var rätt?", "id": "historia-02-hogkulturer"};</script>
