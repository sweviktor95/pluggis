<script>window.SCEN={"titel": "Tidsresa genom globaliseringen", "plats": "Världen", "tid": "1956–2026", "sky": ["#86b6d8", "#e8f1f7"], "mark": "#8c9a8b", "walker": {"typ": "resenar"}, "etapper": [{"x_etikett": "1956", "tid": "1956", "plats": "Hamn", "rubrik": "Containern gör frakten billig", "fakta": ["Du står i en hamn. Förr lastades varor för hand, vilket tog lång tid. Nu börjar man använda stora lådor av samma storlek, så kallade containrar.", "En container kan lyftas direkt från fartyg till tåg eller lastbil. Det går snabbt, och det blir billigare att skicka varor över haven."], "fraga": "Varför blev containern så viktig?", "alt": ["Den gjorde frakten billigare och snabbare", "Den ersatte alla flygplan", "Den gjorde att varor blev dyrare"], "ratt": 0, "forklaring": "Lådorna var lika stora och kunde flyttas smidigt mellan fartyg, tåg och lastbil.", "ord": [["globalisering", "när länder blir mer och mer kopplade till varandra"]], "deko": [["containerfartyg", -100, 1.3], ["hamn", 150, 1.1]]}, {"x_etikett": "1969", "tid": "1969", "plats": "Universitet", "rubrik": "Datorer kopplas ihop", "fakta": ["Du är på ett universitet i USA. Forskare kopplar ihop datorer i ett nätverk som heter ARPANET. Det skickar sitt första meddelande 1969.", "ARPANET blir föregångaren till dagens internet. Det är början på något stort."], "fraga": "Vad hände 1969?", "alt": ["Första meddelandet skickades på ett tidigt datornätverk", "Den första mobiltelefonen såldes", "EU bildades"], "ratt": 0, "forklaring": "ARPANET blev ett av de första stegen mot internet.", "deko": [["dator", -80, 1.3], ["radio", 150, 0.9]]}, {"x_etikett": "1989–91", "tid": "1989–1991", "plats": "Europa", "rubrik": "Kalla kriget tar slut, webben föds", "fakta": ["År 1989 faller Berlinmuren, och 1991 upplöses Sovjetunionen. Det kalla kriget är över. Gränserna mellan öst och väst öppnas.", "Samtidigt skapas World Wide Web, som gör internet enkelt att använda. Fler länder handlar och kontaktar varandra."], "fraga": "Vad gjor ckså FN:s Agenda 2030, mål för en bättre värld.", "Samtidigt flyr många människor från krig, bland annat i Syrien."], "fraga": "Vad enades länderna om i Parisavtalet?", "alt": ["Att minska uppvärmningen av jorden", "Att avskaffa EU", "Att stoppa all handel mellan länder"], "ratt": 0, "forklaring": "Målet är att hålla uppvärmningen väl under 2 grader och helst under 1,5 grader.", "ord": [["klimat", "hur vädret brukar vara på en plats under många år"], ["flykting", "person som flytt från krig eller förföljelse"]], "deko": [["vindkraft", -120, 1.2], ["folkmassa", 90, 1.0], ["jordglob", 230, 1.0]]}, {"x_etikett": "Idag", "tid": "2022–2026", "plats": "Världen idag", "rubrik": "Nya utmaningar", "fakta": ["Den 24 februari 2022 anfaller Ryssland Ukraina. Det förändrar säkerheten i Europa. Läget 2026: förhandlingar har förts, men kriget har inte avslutats.", "Klimatet, migration, ny teknik och falska nyheter (desinformation) är frågor som alla länder delar."], "fraga": "", "alt": [], "ratt": 0, "forklaring": "", "deko": [["jordglob", -100, 1.3], ["satellit", 100, 1.0], ["flygplan_modernt", 230, 1.0]]}], "diskutera": "Vilka händelser på resan förklarar bäst varför världen hänger ihop så mycket i dag? Vad tycker du är viktigast att vi gör?", "id": "historia-15-globalisering"};</script>
