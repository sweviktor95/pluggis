<script>window.SCEN={"titel": "Tidsresa över Atlanten", "plats": "Atlanten, Afrika, Karibien", "tid": "1400-tal – 1800-tal", "sky": ["#bcd7ea", "#8fb3cc"], "mark": "#5f8aa6", "walker": {"typ": "sjoman"}, "etapper": [{"x_etikett": "1488", "tid": "1480-talet", "plats": "Lissabon, Portugal", "rubrik": "Hamnen lockar", "fakta": ["Du står på kajen i Lissabon. Fartygen lastas med mat och vatten. Kungen vill hitta en sjöväg till Asien.", "Där finns krydder, siden och guld. Det är dyrt att köpa på land och skapar stora vinster. Därför seglar portugiserna söderut längs Afrikas kust."], "fraga": "Varför ville européerna hitta sjövägen till Asien?", "alt": ["För att tjäna pengar på krydder, siden och guld", "För att fiska mer", "För att bygga broar"], "ratt": 0, "forklaring": "Krydder, siden och guld var dyra. En egen sjöväg kunde ge stora vinster.", "deko": [["hamn", -100, 1.2], ["karavell", 100, 1.3], ["segelfartyg", 200, 0.9]]}, {"x_etikett": "1492", "tid": "1492", "plats": "Karibien", "rubrik": "Mötet", "fakta": ["Efter veckor på havet syns land. Columbus går i land på en ö. Där bor människor som kallas taíno.", "Columbus tror att han har kommit till Indien. Han kallar därför människorna ”indianer”. Men han har kommit till en världsdel som européerna inte kände till."], "fraga": "Varför kallade Columbus människorna ”indianer”?", "alt": ["Han trodde att han hade kommit till Indien", "De kom från Indien", "Det var deras eget ord"], "ratt": 0, "forklaring": "Columbus trodde att han hade kommit till Indien. Namnet blev kvar.", "deko": [["palm", -120, 1.2], ["karavell", 100, 1.2], ["moln", 180, 0.9]]}, {"x_etikett": "1521", "tid": "1519–1533", "plats": "Mexiko och Peru", "rubrik": "Erövring och sjukdom", "fakta": ["På land möter du spanska soldater. De krigar mot stora riken: aztekerna i Mexiko och inkafolket i Peru.", "Spanjorerna får hjälp av folk som är fiender till härskarna. Många dör också i sjukdomar från Europa, som smittkoppor. Riken som redan är oeniga blir svagare. Silver skeppas till Europa."], "fraga": "Vad bidrog till att spanjorerna kunde erövra rikena?", "alt": ["Hjälp från allierade och många sjukdomsfall", "Att rikena hade starkare armé än Spanien", "Att det inte fanns något krig"], "ratt": 0, "forklaring": "Flera orsaker hjälpte till: allierade, sjukdomar och oenighet. Inte bara vapen.", "ord": [["allierad", "någon som kämpar på din sida mot en gemensam fiende"]], "deko": [["berg", -130, 1.5], ["soldat_grupp", 70, 1.1], ["slott", 190, 0.9]]}, {"x_etikett": "1600-t", "tid": "1600-talet", "plats": "Sockerplantage", "rubrik": "Plantagen", "fakta": ["Du ser stora fält med sockerrör. Arbetet är hårt och hett. Sockret säljs dyrt i Europa.", "Många av öns ursprungliga invånare har dött av sjukdomar och hårt arbete. Ägarna saknar därför arbetare. De köper människor från Afrika och tvingar dem att arbeta som slavar."], "fraga": "Varför ville plantageägarna ha människor från Afrika?", "alt": ["De saknade arbetare och ville ha billig arbetskraft", "Det fanns för många arbetare", "Maskiner gjorde allt arbete"], "ratt": 0, "forklaring": "Ägarna behövde arbetare. Det ledde till slavhandeln.", "ord": [["plantage", "stor gård där man odlar en gröda för att sälja"], ["slav", "människa som ägs av en annan och tvingas arbeta"]], "deko": [["palm", -110, 1.2], ["bondgard", 100, 1.0], ["segelfartyg", 210, 1.0]]}, {"x_etikett": "1700-t", "tid": "1700-talet", "plats": "Atlanten", "rubrik": "Överfarten", "fakta": ["Fartyget seglar över havet. Människor ligger trångt packade under däck. Det är varmt, smutsigt och många blir sjuka.", "Omkring 12,5 miljoner människor fördes bort från Afrika. Ungefär 1,8 miljoner av dem dog på resan. Det är ungefär var sjunde person."], "fraga": "Ungefär hur stor del av de bortförda dog under överfarten?", "alt": ["Ungefär var sjunde", "Nästan ingen", "Ungefär hälften"], "ratt": 0, "forklaring": "Omkring 1,8 av 12,5 miljoner dog. Det är ungefär var sjunde.", "deko": [["segelfartyg", -80, 1.5], ["moln", 120, 1.0], ["segelfartyg", 210, 0.8]]}, {"x_etikett": "1847", "tid": "1784–1847", "plats": "S:t Barthélemy", "rubrik": "Svensk ö i Karibien", "fakta": ["Du går i hamnen i Gustavia. Sverige har ägt ön sedan 1784. På ön är slaveri tillåtet.", "År 1847 köper svenska staten loss alla som fortfarande är slavar. Då är de fria. Pengarna går till ägarna, inte till de fria."], "fraga": "Vad hände 1847 på S:t Barthélemy?", "alt": ["Slaveriet avskaffades", "Ön såldes till Spanien", "Ön blev ett eget land"], "ratt": 0, "forklaring": "Slaveriet avskaffades 1847. Sverige lämnade ön till Frankrike 1878.", "deko": [["hamn", -90, 1.2], ["palm", 110, 1.1], ["flagga_bla", 200, 0.8]]}, {"x_etikett": "Idag", "tid": "Idag", "plats": "Ett museum", "rubrik": "Att minnas", "fakta": ["Vi minns slaveriet genom museer, minnesdagar och forskning. Länder och städer diskuterar statyer och ursäkter.", "Följderna finns kvar, till exempel rasism och orättvisor. Därför är det viktigt att känna till historien."], "fraga": null, "alt": null, "ratt": null, "forklaring": null, "deko": [["skola", -80, 1.2], ["bokhylla", 120, 1.0], ["folkmassa", 220, 0.9]]}], "diskutera": "Hur kan vi minnas slaveriet på ett respektfullt sätt? Vem ska berätta historien?", "id": "historia-05-kolonisation"};</script>
