<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hola Quest – träna spanska</title>
<style>
:root{--acc:#b4452f;--acc2:#e9b44c;--ok:#4c9a4a;--okbg:#dff3dc;--bad:#c8372d;--badbg:#fbdcd8;--ink:#2a2420;--soft:#fdf1e7;--line:#e5d3c4}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:#fffaf5;color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;position:sticky;top:0;background:#fffaf5;z-index:5;border-bottom:1px solid var(--line)}
.stat{font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap}
.sp{flex:1}
.bar{flex:1;height:14px;background:#eadccf;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:8px;transition:width .3s}
.x{background:none;border:0;font-size:1.4rem;color:#8a7a6f;padding:0 4px}
main{flex:1;padding:16px 16px 140px}
h1{font-size:1.5rem;margin:.2em 0 .1em;color:var(--acc)}
.sub{color:#6b5d54;margin:0 0 14px}
.path{display:flex;flex-direction:column;align-items:center;gap:16px;margin:18px 0}
.node{width:92px;height:92px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:2rem;box-shadow:0 6px 0 #7e2d1d;position:relative}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 #7e2d1d}
.node.done{background:var(--acc2);box-shadow:0 6px 0 #b98a1d}
.node.lock{background:#cdbfb3;box-shadow:0 6px 0 #a89a8e;cursor:not-allowed}
.node small{position:absolute;left:50%;top:100%;transform:translate(-50%,10px);color:var(--ink);font-size:.78rem;font-weight:600;width:150px;text-align:center}
.path .n:nth-child(2n){transform:translateX(50px)}.path .n:nth-child(4n){transform:translateX(-50px)}
.n{margin-bottom:22px}
.q{font-size:1.3rem;font-weight:700;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opt{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 14px;text-align:left;font-size:1.05rem}
.opt.sel{border-color:#5aa6dc;background:#eaf5fd}
.opt:disabled{cursor:default}
.listen{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.spk{width:64px;height:64px;border-radius:50%;border:0;background:#4a63b8;color:#fff;font-size:1.6rem;box-shadow:0 4px 0 #2f4488}
.bank,.ans{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:8px 0}
.ans{border-top:2px solid var(--line);border-bottom:2px solid var(--line);margin:10px 0;align-items:center}
.w{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-size:1.05rem}
.w.used{opacity:.25;pointer-events:none}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .opt{text-align:center;padding:12px 6px}
.pairs .opt.gone{opacity:.25;pointer-events:none}
.pairs .opt.wrong{border-color:var(--bad);background:var(--badbg)}
input.t{width:100%;font-size:1.2rem;padding:13px;border-radius:12px;border:2px solid var(--line)}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#fffaf5;border-top:1px solid var(--line)}
.foot .in{max-width:640px;margin:0 auto}
.foot.ok{background:var(--okbg)}.foot.bad{background:var(--badbg)}
.fb{font-weight:700;margin-bottom:8px}.foot.ok .fb{color:#2c6b2a}.foot.bad .fb{color:var(--bad)}
.fb small{display:block;font-weight:400;color:var(--ink)}
.go{width:100%;border:0;border-radius:14px;padding:14px;font-size:1.05rem;font-weight:700;color:#fff;background:var(--ok);box-shadow:0 4px 0 #2f6d2d;letter-spacing:.04em}
.go:disabled{background:#cdbfb3;box-shadow:0 4px 0 #a89a8e;cursor:not-allowed}
.foot.bad .go{background:var(--bad);box-shadow:0 4px 0 #8c231c}
.center{text-align:center;padding-top:30px}
.big{font-size:4rem}
.cards{display:flex;gap:10px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.card{background:var(--soft);border:2px solid var(--acc2);border-radius:14px;padding:10px 18px;min-width:96px}
.card b{display:block;font-size:1.4rem;color:var(--acc)}
.sec{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:14px 0;font-size:.92rem}
.lnk{background:none;border:0;color:var(--acc);text-decoration:underline;padding:6px}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-7px)}60%{transform:translateX(7px)}}
</style></head>
<body><div class="app">
<div class="top" id="top"></div>
<main id="m"></main>
</div><div id="foot"></div>
<script>
// ===== Data =====
var LESSONS=[
 {id:"halsa",ikon:"👋",titel:"Hälsningar",ex:[
  {t:"mc",q:"Vad betyder ”Hola”?",o:["Hej","Tack","Hej då","Snälla"],a:0,say:"Hola"},
  {t:"listen",es:"Buenos días",o:["God morgon","God natt","Tack","Hej då"],a:0},
  {t:"mc",q:"Hur säger man ”Tack”?",o:["Por favor","Gracias","Adiós","Perdón"],a:1},
  {t:"match",pairs:[["Hola","Hej"],["Adiós","Hej då"],["Gracias","Tack"],["Por favor","Snälla"]]},
  {t:"gap",q:"___ tardes (God eftermiddag)",o:["Buenas","Bueno","Buen"],a:0},
  {t:"build",sv:"Hur mår du?",w:["¿Cómo","estás?","Qué","me","llamo"],ans:["¿Cómo","estás?"]},
  {t:"listen",es:"Hasta mañana",o:["Vi ses i morgon","God kväll","Varsågod","Ursäkta"],a:0},
  {t:"type",q:"Skriv på spanska: Varsågod",ans:["de nada"],say:"de nada"},
  {t:"mc",q:"Vilket ord använder du till en vuxen du inte känner: tú eller usted?",o:["tú","usted"],a:1},
  {t:"build",sv:"Jag förstår inte.",w:["No","entiendo.","Más","hablo","despacio"],ans:["No","entiendo."]}
 ]},
 {id:"presentera",ikon:"🙋",titel:"Presentera dig",ex:[
  {t:"mc",q:"Hur säger du ”Jag heter Sara”?",o:["Soy llamo Sara","Me llamo Sara","Tengo Sara","Vivo Sara"],a:1,say:"Me llamo Sara"},
  {t:"listen",es:"Tengo trece años",o:["Jag är tretton år","Jag bor i Madrid","Jag heter Trece","Jag gillar tretton"],a:0},
  {t:"gap",q:"___ de Suecia. (Jag kommer från Sverige.)",o:["Soy","Tengo","Vivo"],a:0},
  {t:"match",pairs:[["¿Cómo te llamas?","Vad heter du?"],["¿Cuántos años tienes?","Hur gammal är du?"],["¿De dónde eres?","Varifrån kommer du?"],["¿Dónde vives?","Var bor du?"]]},
  {t:"build",sv:"Jag bor i Malmö.",w:["Vivo","en","Malmö.","Soy","de"],ans:["Vivo","en","Malmö."]},
  {t:"gap",q:"___ doce años. (Jag är tolv år.)",o:["Soy","Tengo","Me llamo"],a:1},
  {t:"type",q:"Skriv på spanska: Jag gillar musiken.",ans:["me gusta la musica","me gusta la música"],say:"Me gusta la música"},
  {t:"listen",es:"Vivo en Madrid",o:["Jag bor i Madrid","Jag kommer från Madrid","Jag heter Madrid","Jag gillar Madrid"],a:0},
  {t:"build",sv:"Jag kommer från Sverige.",w:["Soy","de","Suecia.","Tengo","en"],ans:["Soy","de","Suecia."]},
  {t:"mc",q:"Varför säger spanskan ”tengo trece años”?",o:["Man ”har” år","Man ”är” år","Man ”bor” år"],a:0}
 ]},
 {id:"siffror",ikon:"🔢",titel:"Siffror 0–100",ex:[
  {t:"mc",q:"Vad är ”cinco”?",o:["3","5","7","9"],a:1,say:"cinco"},
  {t:"listen",es:"siete",o:["7","6","10","17"],a:0},
  {t:"match",pairs:[["uno","1"],["tres","3"],["ocho","8"],["diez","10"]]},
  {t:"mc",q:"Vilket tal är ”quince”?",o:["5","15","50","12"],a:1},
  {t:"type",q:"Skriv med bokstäver på spanska: 2",ans:["dos"],say:"dos"},
  {t:"listen",es:"veinte",o:["20","12","2","200"],a:0},
  {t:"gap",q:"treinta ___ uno (31)",o:["y","más","por"],a:0},
  {t:"build",sv:"Tre plus fem är åtta.",w:["Tres","más","cinco","son","ocho."],ans:["Tres","más","cinco","son","ocho."]},
  {t:"mc",q:"Hur säger du ”Jag är femton år”?",o:["Soy quince años","Tengo quince años","Tengo cincuenta años"],a:1},
  {t:"type",q:"Skriv med bokstäver: 12",ans:["doce"],say:"doce"}
 ]},
 {id:"verb",ikon:"⚙️",titel:"Verb, el/la och plural",ex:[
  {t:"mc",q:"Vilken form av ser passar: Yo ___",o:["soy","eres","es","somos"],a:0},
  {t:"gap",q:"Ella ___ Ana. (heter)",o:["me llamo","se llama","te llamas"],a:1},
  {t:"match",pairs:[["el chico","pojken"],["la chica","flickan"],["el libro","boken"],["la mesa","bordet"]]},
  {t:"gap",q:"___ amigas (flera vänner, feminint, bestämd form)",o:["los","las","la"],a:1},
  {t:"mc",q:"Plural av ”libro”?",o:["libroes","libros","libras"],a:1},
  {t:"build",sv:"Vi är från Sverige.",w:["Somos","de","Suecia.","Son","tenemos"],ans:["Somos","de","Suecia."]},
  {t:"type",q:"Skriv: du (tú) har på spanska (tener)",ans:["tienes"],say:"tienes"},
  {t:"mc",q:"Hur säger en tjej att hon är svensk?",o:["Soy sueco","Soy sueca","Soy suecas"],a:1},
  {t:"gap",q:"Mi amigo es ___. (snäll, maskulin)",o:["simpático","simpática","simpáticos"],a:0},
  {t:"build",sv:"Hon har en bror.",w:["Ella","tiene","un","hermano.","una"],ans:["Ella","tiene","un","hermano."]}
 ]}
];
// ===== State =====
var KEY="pluggis-sim-spanska-v1";
var S=load();
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.done)return d}catch(e){}return{done:{},xp:0,streak:0,last:"",best:0}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){return new Date().toISOString().slice(0,10)}
var m=document.getElementById("m"),top_=document.getElementById("top"),foot=document.getElementById("foot");
var L=null,q=[],i=0,hearts=5,xpGain=0,answered=false,sel=null,mistakes=0,retried={};
// ===== TTS =====
function say(t){try{var u=new SpeechSynthesisUtterance(t);u.lang="es-ES";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
var canSay=("speechSynthesis" in window);
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[¿?¡!.,]/g,"").replace(/\s+/g," ").trim()}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
// ===== Home =====
function home(){
  L=null;foot.innerHTML="";
  top_.innerHTML='<span class="stat">🔥 '+(S.last===today()||S.last===yesterday()?S.streak:0)+'</span><span class="sp"></span><span class="stat">⭐ '+S.xp+' XP</span>';
  var h='<h1>¡Hola! Quest</h1><p class="sub">Kapitel 1 – Hälsa, presentera dig och räkna. Klara en lektion i taget. Du har 5 hjärtan per lektion.</p><div class="path">';
  LESSONS.forEach(function(l,k){
    var done=S.done[l.id],open=k===0||S.done[LESSONS[k-1].id];
    h+='<div class="n"><button class="node'+(done?" done":"")+(open?"":" lock")+'" '+(open?'onclick="start('+k+')"':"disabled")+'>'+(open?l.ikon:"🔒")+'<small>'+l.titel+(done?" ✓":"")+'</small></button></div>';
  });
  h+='</div><div class="sec">Tips: tryck på 🔊 för att höra uttalet. Ljudet skapas av din webbläsare; på vissa enheter saknas spansk röst. <br><button class="lnk" onclick="resetAll()">Nollställ framsteg</button></div>';
  m.innerHTML=h;
}
function yesterday(){var d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10)}
function resetAll(){if(confirm("Nollställa alla framsteg?")){S={done:{},xp:0,streak:0,last:"",best:0};save();home()}}
// ===== Lesson =====
function start(k){L=LESSONS[k];q=L.ex.slice();i=0;hearts=5;xpGain=0;mistakes=0;retried={};show()}
function topbar(){
  top_.innerHTML='<button class="x" onclick="if(confirm(\'Avsluta lektionen?\'))home()">✕</button><div class="bar"><i style="width:'+Math.round(i/q.length*100)+'%"></i></div><span class="stat">❤️ '+hearts+'</span>';
}
function show(){
  if(i>=q.length)return finish();
  if(hearts<=0)return failed();
  topbar();answered=false;sel=null;foot.innerHTML="";
  var e=q[i],h="";cur=e;
  if(e.t==="mc"||e.t==="gap"){
    h='<div class="q">'+esc(e.q)+'</div>'+(e.say&&canSay?'<div class="listen"><button class="spk" onclick="say(\''+e.say.replace(/'/g,"\\'")+'\')">🔊</button></div>':"")+'<div class="opts">'+e.o.map(function(o,j){return '<button class="opt" onclick="pick('+j+')">'+esc(o)+'</button>'}).join("")+'</div>';
    ctrl("Kontrollera",true);
  }else if(e.t==="listen"){
    h='<div class="q">Lyssna och välj rätt betydelse</div><div class="listen"><button class="spk" onclick="say(\''+e.es.replace(/'/g,"\\'")+'\')">🔊</button>'+(canSay?"":'<span><b>'+esc(e.es)+'</b></span>')+'</div><div class="opts">'+e.o.map(function(o,j){return '<button class="opt" onclick="pick('+j+')">'+esc(o)+'</button>'}).join("")+'</div>';
    ctrl("Kontrollera",true);setTimeout(function(){say(e.es)},300);
  }else if(e.t==="build"){
    var ws=e.w.slice().sort(function(){return Math.random()-.5});built=[];
    h='<div class="q">Översätt: '+esc(e.sv)+'</div><div class="ans" id="ans"></div><div class="bank" id="bank">'+ws.map(function(w,j){return '<button class="w" id="w'+j+'" onclick="addW('+j+',\''+w.replace(/'/g,"\\'")+'\')">'+esc(w)+'</button>'}).join("")+'</div>';
    ctrl("Kontrollera",true);
  }else if(e.t==="match"){
    var a=e.pairs.map(function(p,j){return{t:p[0],j:j,s:"es"}}),b=e.pairs.map(function(p,j){return{t:p[1],j:j,s:"sv"}});
    a.sort(function(){return Math.random()-.5});b.sort(function(){return Math.random()-.5});
    mt={left:null,left_n:0,left_done:0,tot:e.pairs.length,err:0};
    h='<div class="q">Para ihop orden</div><div class="pairs">'+a.map(function(x,n){return '<button class="opt" data-s="es" data-j="'+x.j+'" onclick="mpick(this)">'+esc(x.t)+'</button><button class="opt" data-s="sv" data-j="'+b[n].j+'" onclick="mpick(this)">'+esc(b[n].t)+'</button>'}).join("")+'</div>';
    ctrl("Fortsätt",true);
  }else if(e.t==="type"){
    h='<div class="q">'+esc(e.q)+'</div>'+(canSay&&e.say?'':'')+'<input class="t" id="inp" autocomplete="off" autocapitalize="none" spellcheck="false" oninput="document.querySelector(\'.go\').disabled=!this.value.trim()" onkeydown="if(event.key===\'Enter\')check()">';
    ctrl("Kontrollera",true);setTimeout(function(){var x=document.getElementById("inp");x&&x.focus()},50);
  }
  m.innerHTML=h;
}
var cur,built=[],mt;
function ctrl(txt,dis,cls,fbHtml){
  foot.innerHTML='<div class="foot '+(cls||"")+'"><div class="in">'+(fbHtml||"")+'<button class="go" '+(dis?"disabled":"")+' onclick="'+(answered?"next()":"check()")+'">'+txt+'</button></div></div>';
}
function pick(j){if(answered)return;sel=j;var o=document.querySelectorAll(".opt");o.forEach(function(x,n){x.classList.toggle("sel",n===j)});document.querySelector(".go").disabled=false}
function addW(j,w){if(answered)return;built.push({j:j,w:w});document.getElementById("w"+j).classList.add("used");drawAns();document.querySelector(".go").disabled=false}
function drawAns(){document.getElementById("ans").innerHTML=built.map(function(b,n){return '<button class="w" onclick="remW('+n+')">'+esc(b.w)+'</button>'}).join("")}
function remW(n){if(answered)return;var b=built.splice(n,1)[0];document.getElementById("w"+b.j).classList.remove("used");drawAns();document.querySelector(".go").disabled=!built.length}
function mpick(btn){
  if(answered)return;
  btn.classList.add("sel");
  var s=btn.dataset.s;
  if(!mt.left){mt.left=btn;return}
  var a=mt.left;
  if(a===btn){btn.classList.remove("sel");mt.left=null;return}
  if(a.dataset.s===s){a.classList.remove("sel");mt.left=btn;return}
  if(a.dataset.j===btn.dataset.j){
    var es=a.dataset.s==="es"?a:btn;if(canSay)say(es.textContent);
    a.className=btn.className="opt gone";mt.left=null;mt.left_done++;
    if(mt.left_done===mt.tot){answered=true;mistakes+=mt.err?1:0;if(mt.err)hearts--;feedback(mt.err===0,"Perfekt!","Bra jobbat – du hittade alla par.",null,true)}
  }else{
    mt.err++;a.classList.remove("sel");btn.classList.remove("sel");a.classList.add("wrong");btn.classList.add("wrong");mt.left=null;
    setTimeout(function(){a.classList.remove("wrong");btn.classList.remove("wrong")},500);
    topbar();
  }
}
function check(){
  if(answered)return;var e=cur,ok=false,corr="";
  if(e.t==="mc"||e.t==="gap"||e.t==="listen"){ok=sel===e.a;corr=e.o[e.a];if(e.t==="listen"&&canSay)say(e.es)}
  else if(e.t==="build"){var got=built.map(function(b){return b.w});ok=got.join(" ")===e.ans.join(" ");corr=e.ans.join(" ");if(ok&&canSay)say(corr)}
  else if(e.t==="type"){var v=norm(document.getElementById("inp").value);ok=e.ans.some(function(a){return norm(a)===v});corr=e.ans[e.ans.length-1];if(ok&&e.say&&canSay)say(e.say)}
  answered=true;
  if(e.t==="mc"||e.t==="gap"||e.t==="listen"){document.querySelectorAll(".opt").forEach(function(x,n){x.disabled=true;if(n===e.a)x.style.borderColor="var(--ok)";if(n===sel&&!ok)x.style.borderColor="var(--bad)"})}
  if(!ok){hearts--;mistakes++;topbar();if(!retried[i]){retried[i]=1;q.push(e)}}
  else xpGain+=10;
  feedback(ok,ok?pr():"Rätt svar:",ok?"":corr+(e.say?" 🔊":""),e.say);
}
var PR=["Bra!","Rätt!","Perfekt!","¡Muy bien!","¡Genial!","¡Excelente!"];function pr(){return PR[Math.floor(Math.random()*PR.length)]}
function feedback(ok,t,s,sy,noMark){
  var last=(i+1>=q.length);
  foot.innerHTML='<div class="foot '+(ok?"ok":"bad")+'"><div class="in"><div class="fb">'+(ok?"✅ ":"❌ ")+t+(s?"<small>"+esc(s)+"</small>":"")+'</div><button class="go" onclick="next()">Fortsätt</button></div></div>';
  if(ok&&noMark)xpGain+=10;
  if(!ok)document.getElementById("m").classList.add("shake"),setTimeout(function(){document.getElementById("m").classList.remove("shake")},400);
}
function next(){i++;if(hearts<=0)return failed();show()}
function finish(){
  S.done[L.id]=true;S.xp+=xpGain;
  var t=today();if(S.last!==t){S.streak=(S.last===yesterday())?S.streak+1:1;S.last=t}
  if(S.streak>S.best)S.best=S.streak;save();
  top_.innerHTML="";foot.innerHTML='<div class="foot ok"><div class="in"><button class="go" onclick="home()">Fortsätt</button></div></div>';
  var all=LESSONS.every(function(l){return S.done[l.id]});
  m.innerHTML='<div class="center"><div class="big">'+(all?"🏆":"🎉")+'</div><h1>'+(all?"Du klarade hela kapitlet!":"Lektionen klar!")+'</h1><div class="cards"><div class="card">⭐<b>+'+xpGain+'</b>XP</div><div class="card">🔥<b>'+S.streak+'</b>dagars serie</div><div class="card">❤️<b>'+hearts+'</b>hjärtan kvar</div></div><p class="sub">'+(all?"¡Felicidades! Du kan nu hälsa, presentera dig och räkna på spanska. Dags för kapitel 2!":"Nästa lektion är upplåst.")+'</p></div>';
}
function failed(){
  top_.innerHTML="";foot.innerHTML='<div class="foot bad"><div class="in"><button class="go" onclick="start('+LESSONS.indexOf(L)+')">Försök igen</button></div></div>';
  m.innerHTML='<div class="center"><div class="big">💔</div><h1>Slut på hjärtan</h1><p class="sub">Ingen fara! Bläddra i häftet och försök igen. Misstag är hur man lär sig.</p><p><button class="lnk" onclick="home()">Till startsidan</button></p></div>';
}
home();
</script></body></html>
