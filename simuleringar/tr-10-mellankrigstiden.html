<script>window.SCEN={"titel": "Tidsresa genom mellankrigstiden", "plats": "Europa och USA", "tid": "1917–1938", "sky": ["#b9c6d3", "#e8e1d2"], "mark": "#8a8272", "walker": {"typ": "medborgare"}, "etapper": [{"x_etikett": "Petrograd", "tid": "1917", "plats": "Petrograd, Ryssland", "rubrik": "Revolution i vinterkylan", "fakta": ["Du bor i Petrograd i Ryssland. Det är krig, och det finns knappt något bröd. Folk är hungriga och arga.", "Tsaren har tvingats avgå. I november tar bolsjevikerna makten. De lovar att Ryssland ska sluta kriget, att bönderna ska få jord och att folk ska få bröd."], "fraga": "Vad lovade bolsjevikerna?", "alt": ["Mer krig och en ny kung", "Fred, jord och bröd", "Lägre skatter och fria val"], "ratt": 1, "forklaring": "Löftena gav dem stöd hos trötta soldater, hungriga arbetare och bönder.", "ord": [["bolsjeviker", "det ryska parti som tog makten 1917 under Lenin"]], "deko": [["folkmassa", 0, 1.2], ["flagga_rod", 120, 1.0], ["arbetarhus", -150, 1.0]]}, {"x_etikett": "Rom", "tid": "1922", "plats": "Rom, Italien", "rubrik": "Marschen mot Rom", "fakta": ["Du är i Rom i Italien. Fascisterna, ledda av Benito Mussolini, marscherar mot staden. De hotar med våld.", "Kungen blir rädd och gör Mussolini till regeringschef. Efter några år är Italien en diktatur. Då bestämmer en enda man."], "fraga": "Hur fick Mussolini makten 1922?", "alt": ["Han vann ett krig mot grannlandet", "Fascisterna hotade med våld och kungen gav honom makten", "Folket valde honom i ett fritt val"], "ratt": 1, "forklaring": "Han fick makten på ett lagligt sätt, men bara för att kungen var rädd för våld.", "ord": [["diktatur", "styrelseskick där en person eller ett parti bestämmer allt"], ["fascism", "rörelse som vill ha en stark ledare och förbjuder motstånd"]], "deko": [["colosseum", -80, 1.3], ["folkmassa", 120, 1.0]]}, {"x_etikett": "Berlin", "tid": "1923", "plats": "Berlin, Tyskland", "rubrik": "Pengar som inte betyder något", "fakta": ["Du är i Berlin. Priserna stiger för varje timme. Du får lönen i högar av sedlar och springer till affären innan pengarna är värda ännu mindre.", "När priserna rusar så här kallas det hyperinflation. Sparpengar blir värdelösa, och många människor förlorar tron på republiken."], "fraga": "Vad kallas det när priserna stiger snabbt och pengarna blir värdelösa?", "alt": ["Hyperinflation", "Strejk", "Folkomröstning"], "ratt": 0, "forklaring": "I november 1923 kostade en dollar flera biljoner mark.", "ord": [["hyperinflation", "när priserna stiger extremt snabbt och pengarna blir värdelösa"], ["republik", "land utan kung, där folket väljer ledarna"]], "deko": [["marknad", 0, 1.1], ["folkmassa", -140, 1.0]]}, {"x_etikett": "New York", "tid": "1929", "plats": "New York, USA", "rubrik": "Aktierna faller", "fakta": ["Du står utanför börsen i New York. Den 24 oktober 1929 faller priset på aktier kraftigt. Många förlorar alla sina pengar.", "Banker går i konkurs och miljontals människor blir arbetslösa. Krisen sprider sig till andra länder. Den långa krisen på 1930-talet kallas depressionen."], "fraga": "Vad kallas den långa ekonomiska krisen på 1930-talet?", "alt": ["De glada tjugotalen", "Depressionen", "Kalla kriget"], "ratt": 1, "forklaring": "Depressionen drabbade USA, Tyskland, Sverige och många fler länder.", "ord": [["aktie", "en liten del av ett företag som du kan köpa och sälja"], ["depression", "lång tid med många arbetslösa och dålig ekonomi"]], "deko": [["skorstenar", -120, 1.2], ["folkmassa", 100, 1.0]]}, {"x_etikett": "Ådalen", "tid": "1931", "plats": "Lunde, Ådalen, Sverige", "rubrik": "Skotten i Ådalen", "fakta": ["Du är i Ådalen i Sverige. Arbetare demonstrerar mot lägre löner och mot strejkbrytare. Strejkbrytare tar jobben när andra strejkar.", "Militär är på plats. Den 14 maj 1931 skjuter soldaterna mot demonstranterna. Fem människor dör."], "fraga": "Hur många människor dog när soldaterna sköt i Ådalen?", "alt": ["Fem", "Femtio", "Ingen"], "ratt": 0, "forklaring": "Händelsen väckte starka reaktioner i hela Sverige och påverkade politiken.", "ord": [["strejk", "när arbetare slutar jobba för att kräva bättre villkor"]], "deko": [["gran", -130, 1.2], ["folkmassa", 60, 0.9], ["trad", 160, 1.0]]}, {"x_etikett": "Berlin", "tid": "1933", "plats": "Berlin, Tyskland", "rubrik": "Demokratin avskaffas", "fakta": ["Du är i Berlin. Den 30 januari 1933 blir Adolf Hitler Tysklands regeringschef (rikskansler). I mars kommer fullmaktslagen.", "Med den lagen får regeringen göra egna lagar utan att fråga riksdagen. Andra partier och fackföreningar förbjuds. Staten styr radion och tidningarna."], "fraga": "Vad innebar fullmaktslagen?", "alt": ["Regeringen kunde göra lagar utan riksdagen", "Alla barn måste gå i skolan", "Det blev fri handel med andra länder"], "ratt": 0, "forklaring": "Riksdagen förlorade sin makt, och Tyskland blev en diktatur med bara ett parti.", "ord": [["demokrati", "styrelseskick där folket väljer ledarna i fria val"]], "deko": [["radio", -100, 1.0], ["folkmassa", 120, 1.1]]}, {"x_etikett": "Saltsjöbaden", "tid": "1938", "plats": "Saltsjöbaden, Sverige", "rubrik": "Överenskommelse i stället för strid", "fakta": ["Du är i Saltsjöbaden nära Stockholm. I december 1938 skriver LO (arbetarnas fack) och SAF (arbetsgivarna) på Saltsjöbadsavtalet. De ska lösa konflikter genom att förhandla.", "Medan demokratin faller i flera länder bygger Sverige vidare på folkrörelser, förhandlingar och reformer."], "deko": [["villa", -100, 1.2], ["riksdagshus", 120, 1.0]]}], "diskutera": "Varför blev vissa länder diktaturer medan Sverige förblev en demokrati? Ge exempel från resan.", "id": "historia-10-mellankrigstiden"};</script>
