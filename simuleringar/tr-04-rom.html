<script>window.SCEN={"titel": "Tidsresa genom Rom", "plats": "Rom och Medelhavet", "tid": "753 f.Kr. – 476 e.Kr.", "sky": ["#f6d99a", "#e8a75d"], "mark": "#b08a5a", "walker": {"typ": "medborgare"}, "etapper": [{"x_etikett": "753 f.Kr.", "tid": "753 f.Kr.", "plats": "Palatinen, vid Tibern", "rubrik": "Staden börjar", "fakta": ["Du står på en kulle vid floden. Små hyddor av trä och lera ligger tätt, och herdar leder får.", "Enligt sagan grundar Romulus staden här. Arkeologer ser att byarna växte ihop under flera generationer."], "fraga": "Vad är en myt?", "alt": ["En berättelse som förs vidare men inte går att bevisa", "En lag skriven på tavlor", "En romersk gud"], "ratt": 0, "forklaring": "Sagan om Romulus är en myt. Den säger något om hur romarna såg på sig själva men är inte en säker källa.", "deko": [["bondgard", -120, 1.0], ["flod", 60, 1.0], ["trad", 160, 0.9]]}, {"x_etikett": "509 f.Kr.", "tid": "509 f.Kr.", "plats": "Forum Romanum", "rubrik": "Ingen kung mer", "fakta": ["Folk samlas på torget. Kungen har jagats bort, och två konsuler ska leda staden under ett år.", "Senaten ger råd, och folket får rösta – men bara männen som är medborgare."], "fraga": "Varför hade republiken två konsuler?", "alt": ["För att de skulle kunna hindra varandra och ingen skulle få för stor makt", "För att en var för sjuk", "För att kungen krävde det"], "ratt": 0, "forklaring": "Tanken var att dela makten så att ingen kunde bli kung igen.", "deko": [["tempel_grekiskt", -100, 1.1], ["folkmassa", 60, 1.0], ["marknad", 190, 0.9]]}, {"x_etikett": "202 f.Kr.", "tid": "218–146 f.Kr.", "plats": "Medelhavet och Karthago", "rubrik": "Krig mot Karthago", "fakta": ["Du ser romerska skepp ute på havet. Rom och Karthago slåss om herraväldet i över hundra år.", "Hannibal tog elefanter över Alperna 218 f.Kr. Rom segrade till slut och förstörde Karthago 146 f.Kr."], "fraga": "Vad var en konsekvens av Roms seger över Karthago?", "alt": ["Rom fick makt över Medelhavet, skatter och slavar", "Rom blev en demokrati", "Karthago blev huvudstad"], "ratt": 0, "forklaring": "Rom blev den ledande makten i Medelhavsområdet, och rikedomen förändrade samhället.", "deko": [["trirem", -80, 1.2], ["berg", 140, 1.4], ["legionar", -170, 1.0]]}, {"x_etikett": "44 f.Kr.", "tid": "44 f.Kr.", "plats": "Senaten", "rubrik": "Caesars sista dag", "fakta": ["Folk viskar utanför senatsbyggnaden. Caesar har blivit diktator på livstid, och många är oroliga.", "Den 15 mars mördas han av senatorer som vill rädda republiken. Resultatet blir nya inbördeskrig."], "fraga": "Vad blev följden av Caesars mord?", "alt": ["Nya inbördeskrig och till slut kejsardöme", "Republiken blev starkare på en gång", "Karthago återuppstod"], "ratt": 0, "forklaring": "Mordet räddade inte republiken. Octavianus (Augustus) tog makten och blev kejsare 27 f.Kr.", "deko": [["tempel_grekiskt", -120, 1.2], ["folkmassa", 80, 1.0], ["flagga_rod", 190, 0.8]]}, {"x_etikett": "80 e.Kr.", "tid": "80 e.Kr.", "plats": "Colosseum", "rubrik": "Brödet och spelen", "fakta": ["Colosseum invigs, och tiotusentals åskådare trängs. Utanför säljs bröd och oliver.", "Riket är på sin höjdpunkt. Vägar, akvedukter och armé håller ihop det, men många arbetar som slavar."], "fraga": "Vad höll det stora romerska riket ihop?", "alt": ["Armé, vägar och ett gemensamt system av lagar", "Bara kungens vilja", "Telefoner"], "ratt": 0, "forklaring": "Legioner, vägar och lagar gjorde att riket kunde styras över stora avstånd.", "deko": [["colosseum", -60, 1.5], ["akvedukt", 170, 1.2], ["legionar", -190, 1.0]]}, {"x_etikett": "313", "tid": "313–380", "plats": "Ett kristet samfund", "rubrik": "En ny tro", "fakta": ["I ett hus samlas kristna för att sjunga och be. Förr har de förföljts. Nu får de utöva sin tro.", "Kejsar Konstantin ger frihet 313. År 380 blir kristendomen i praktiken rikets religion."], "fraga": "Vad hände år 313?", "alt": ["Kristna fick utöva sin tro fritt", "Rom förstördes", "Colosseum byggdes"], "ratt": 0, "forklaring": "Milanoediktet innebar religionsfrihet. Senare blev kristendomen dominerande i riket.", "deko": [["kyrka", -60, 1.2], ["folkmassa", 100, 0.9], ["palm", 190, 0.9]]}, {"x_etikett": "476", "tid": "476 e.Kr.", "plats": "Ravenna och Rom", "rubrik": "Slutet – och arvet", "fakta": ["Västrom har fallit efter lång kris. Östrom fortsätter. Latin, lag, vägar och byggnader lever kvar.", "Även i Sverige finns spår: ord som kejsare och tegel och romerska mynt i jorden."], "fraga": null, "alt": null, "ratt": null, "forklaring": null, "deko": [["colosseum", -80, 1.2], ["akvedukt", 120, 1.1], ["kyrka", 230, 0.9]]}], "diskutera": "Vilka tre saker från Rom tycker du är viktigast att komma ihåg i dag – och vilket mörkt kapitel (till exempel slaveriet) får inte glömmas bort?", "id": "historia-04-rom"};</script>
