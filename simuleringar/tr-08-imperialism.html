ämfört med Kina?", "alt": ["Japan moderniserade sig snabbt och blev själv stormakt", "Japan blev en brittisk koloni", "Japan stängde alla hamnar för alltid"], "ratt": 0, "forklaring": "Japan gjorde snabba reformer och blev själv en stormakt.", "ord": [["koloni", "land som styrs av ett annat land"]], "deko": [["fabrik", -60, 1.1], ["skola", 110, 1.0], ["berg", 200, 1.2]]}, {"x_etikett": "Berlin", "tid": "1884–85", "plats": "Berlin", "rubrik": "Berlinkonferensen", "fakta": ["Politiker från 14 stater, de flesta europeiska, samlas i Berlin. De ska bestämma regler för handel och för vem som får ta områden i Afrika.", "Ingen afrikansk ledare är med. Besluten fattas utan dem som bor där."], "fraga": "Vilka fick inte vara med på Berlinkonferensen?", "alt": ["Afrikas ledare", "Tysklands ledare", "Storbritanniens ledare"], "ratt": 0, "forklaring": "Besluten togs utan de människor som bodde i Afrika.", "deko": [["riksdagshus", -60, 1.2], ["flagga_rod", 100, 0.9], ["jordglob", 190, 0.9]]}, {"x_etikett": "Adwa", "tid": "1896", "plats": "Adwa, Etiopien", "rubrik": "Motstånd i Etiopien", "fakta": ["Italien vill göra Etiopien till koloni och skickar en armé. Etiopiens kejsare Menelik II samlar en stor armé med moderna gevär.", "Etiopierna vinner slaget vid Adwa. Etiopien förblir självständigt. Slaget blir en symbol för motstånd i Afrika."], "fraga": "Vilket land besegrade Italien i slaget vid Adwa 1896?", "alt": ["Egypten", "Etiopien", "Kongo"], "ratt": 1, "forklaring": "Etiopien vann vid Adwa och behöll sin frihet.", "deko": [["berg", -120, 1.4], ["soldat_grupp", 70, 1.1], ["flagga_rod", 190, 0.9]]}, {"x_etikett": "Kongo", "tid": "1904", "plats": "Kongo", "rubrik": "Rapporten om Kongo", "fakta": ["Kung Leopold II av Belgien har fått Kongo som sin privata egendom. Människor tvingas samla gummi och straffas hårt.", "Roger Casement skriver en rapport om det som händer. Protesterna växer. 1908 tar den belgiska staten över Kongo från kungen."], "fraga": "Vem hade styrt Kongo som sin privata egendom fram till 1908?", "alt": ["Kung Leopold II", "Menelik II", "Roger Casement"], "ratt": 0, "forklaring": "Leopold II styrde Kongo 1885–1908. Sedan tog Belgien över.", "deko": [["flod", -100, 1.2], ["palm", 90, 1.3], ["angbat", 190, 0.9]]}, {"x_etikett": "Europa", "tid": "1907–1914", "plats": "Europa", "rubrik": "Sammanfattning: spänningar och två block", "fakta": ["Stormakterna rustar upp och tävlar om kolonier. De ingår också allianser, alltså avtal om att hjälpa varandra om det blir krig.", "1907 bildas trippelententen. Då delas Europa i två block. I nästa kapitel möter du kriget."], "ord": [["imperialism", "när stora länder tar över andra länder för makt och rikedom"], ["allians", "avtal om att hjälpa varandra i krig"]], "deko": [["jordglob", -80, 1.0], ["flagga_bla", 70, 0.9], ["soldat_grupp", 190, 1.0]]}], "diskutera": "Imperialismen gav stormakterna makt men skapade också motstånd. Hur såg de som styrde och de som styrdes på saken?", "id": "historia-08-imperialism"};</script>
