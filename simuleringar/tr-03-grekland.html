<script>window.SCEN={"titel": "Tidsresa genom antikens Grekland", "plats": "Olympia, Sparta, Athen och Alexandria", "tid": "776–323 f.Kr.", "sky": ["#a9d3ea", "#f6efd9"], "mark": "#b9a56c", "walker": {"typ": "medborgare"}, "etapper": [{"x_etikett": "Olympia", "tid": "776 f.Kr.", "plats": "Olympia", "rubrik": "De första spelen", "fakta": ["Du är medborgare och reser till Olympia. Grekerna tror på många gudar: Zeus är gudarnas kung, Poseidon styr havet och Hades styr de döda.", "Här hålls spelen för att hedra Zeus. Enligt traditionen var det bara en tävling första gången: en löpning."], "ord": [["medborgare", "fri invånare som får vara med och bestämma i sin stad"]], "fraga": "Vilken gud hedrades med de olympiska spelen?", "alt": ["Zeus", "Poseidon", "Hades"], "ratt": 0, "forklaring": "Spelen hölls till Zeus ära i Olympia.", "deko": [["tempel_grekiskt", -70, 1.3], ["folkmassa", 120, 1.0], ["trad", 210, 0.9]]}, {"x_etikett": "Sparta", "tid": "Ca 600 f.Kr.", "plats": "Sparta", "rubrik": "Ett samhälle för krig", "fakta": ["I Sparta tränas pojkar från sju års ålder i agoge, en hård skola för soldater. Samhället bygger på armén.", "Fria spartaner kallas spartiater. De tränar för krig. Ofria bönder kallas helotter. De arbetar på jordarna. Grekerna kallar sig själva hellener."], "ord": [["agoge", "Spartas hårda träning för pojkar"], ["helott", "ofri bonde i Sparta"]], "fraga": "Vilka arbetade på spartanernas jord?", "alt": ["Helotter", "Spartiater", "Hellener"], "ratt": 0, "forklaring": "Helotterna var ofria bönder som arbetade åt spartanerna.", "deko": [["soldat_grupp", -70, 1.2], ["mur", 120, 1.0]]}, {"x_etikett": "Athen", "tid": "Ca 508 f.Kr.", "plats": "Athen", "rubrik": "Folket får makt", "fakta": ["I Athen samlas medborgarna på kullen Pnyx. De röstar genom att räcka upp handen. Det kallas demokrati, folkstyre.", "Men bara fria män födda i Athen får vara med. Kvinnor, slavar och utlänningar får inte rösta."], "ord": [["demokrati", "folkstyre: folket får vara med och bestämma"]], "fraga": "Vem fick rösta i Athen?", "alt": ["Alla som bodde i staden", "Fria manliga medborgare", "Bara de rikaste männen"], "ratt": 1, "forklaring": "Bara fria män som var medborgare fick rösta.", "deko": [["valurna", -60, 1.0], ["folkmassa", 110, 1.1], ["tempel_grekiskt", 220, 1.0]]}, {"x_etikett": "Salamis", "tid": "480 f.Kr.", "plats": "Salamis", "rubrik": "Slaget till sjöss", "fakta": ["Perserna, från ett stort rike i öster, anfaller Grekland. År 480 f.Kr. möts flottorna vid ön Salamis. Grekerna vinner.", "Grekerna rodde snabba krigsskepp som kallas triremer. De hade tre rader åror på varje sida och en spets i fören för att ramma fiendens skepp."], "ord": [["trirem", "grekiskt krigsskepp med tre rader åror"], ["flotta", "många krigsskepp som hör ihop"]], "fraga": "Vilka krigsskepp använde grekerna vid Salamis?", "alt": ["Triremer", "Vikingaskepp", "Ångbåtar"], "ratt": 0, "forklaring": "Grekerna använde triremer, krigsskepp med tre rader åror.", "deko": [["trirem", -60, 1.3], ["hamn", 140, 1.0], ["segelfartyg", 230, 0.9]]}, {"x_etikett": "Teater", "tid": "Ca 430 f.Kr.", "plats": "Athen", "rubrik": "Teater och tänkare", "fakta": ["Det är Perikles tid. Templet Parthenon byggs. I teatern spelas tragedier, som är sorgliga pjäser, och komedier, som är roliga pjäser.", "På torget går Sokrates omkring. Han svarar inte på frågor, han ställer dem. Han frågar till exempel: Vad är rättvisa? Så får han folk att tänka efter själva."], "ord": [["tragedi", "sorglig pjäs"], ["komedi", "rolig pjäs"]], "fraga": "Vad ville Sokrates få folk att göra?", "alt": ["Tänka själva genom hans frågor", "Lära sig hans svar utantill", "Gå ut i krig mot Sparta"], "ratt": 0, "forklaring": "Sokrates ställde frågor för att få folk att tänka själva.", "deko": [["tempel_grekiskt", -80, 1.4], ["folkmassa", 120, 1.0], ["amfora", 220, 0.8]]}, {"x_etikett": "Alexandria", "tid": "331 f.Kr.", "plats": "Alexandria", "rubrik": "Alexanders rike", "fakta": ["Alexander den store från Makedonien har besegrat Persien. År 331 f.Kr. grundar han staden Alexandria i Egypten.", "Han dör ung, 323 f.Kr. Hans rike delas, men grekiskt språk och grekisk kultur sprids över stora områden. Tiden kallas hellenismen."], "ord": [["hellenism", "tiden då grekisk kultur spreds över stora områden"]], "fraga": "Vad hände med grekisk kultur efter Alexander?", "alt": ["Den spreds över stora områden", "Den försvann helt", "Den förbjöds i Egypten"], "ratt": 0, "forklaring": "Grekiskt språk och grekisk kultur spreds. Tiden kallas hellenismen.", "deko": [["hamn", -70, 1.1], ["bokhylla", 100, 1.1], ["segelfartyg", 210, 0.9]]}, {"x_etikett": "Arvet", "tid": "Idag", "plats": "Din skola och ditt samhälle", "rubrik": "Vad lever kvar?", "fakta": ["Du kommer tillbaka till nutiden. Ord som demokrati och teater lever kvar. Det gör också idéer om folkstyre och vetenskap.", "Antiken används också som förebild, till exempel i OS och politik. Då ska du fråga: Vem berättar det här, och varför?"], "ord": [["antiken", "tiden då Grekland och Rom var starka"]], "fraga": "", "alt": [], "ratt": 0, "forklaring": "", "deko": [["riksdagshus", -80, 1.1], ["skola", 100, 1.0], ["dator", 200, 0.8]]}], "diskutera": "Vad i antikens Grekland vill du behålla idag? Vad är bra att vi har lämnat bakom oss? Vem berättar historien om antiken, och vad utelämnas?", "id": "historia-03-grekland"};</script>
