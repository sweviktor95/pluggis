<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Andra världskriget på kartan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: an operations map the camera flies across in date order; field-report card docked below (phone) or right (desktop). Single dark map-room look by choice. */
:root{
  --night:#1a1f23; --sea:#2c3f4a; --sea-line:#3b525e; --land:#cbbf9c; --land-line:#8f8466;
  --paper:#ece5d2; --paper-ink:#2a2822; --muted:#6c675a; --khaki:#7a7848;
  --signal:#c8452f; --clear:#5f9a4c; --brass:#d1a84c;
  --f-display:"Special Elite","Courier New",monospace;
  --f-body:"Barlow",system-ui,sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.5}
.app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.map{position:relative;flex:1 1 52%;min-height:240px;background:var(--sea)}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.country{fill:var(--land);stroke:var(--land-line);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .8s}
.country.hl{fill:#d89a7c}
.country.swe{fill:url(#neutral)}
.grat{fill:none;stroke:var(--sea-line);stroke-width:.7;vector-effect:non-scaling-stroke}
.route{fill:none;stroke:var(--brass);stroke-width:2.2;stroke-dasharray:7 6;vector-effect:non-scaling-stroke}
.mk{cursor:default}
.mk .ring{fill:rgba(42,40,34,.55);stroke:#9b927a;stroke-width:2.5}
.mk text{font-family:var(--f-label);font-weight:600;font-size:15px;fill:var(--paper)}
.mk.now .ring{fill:var(--signal);stroke:#f4dcd4}
.mk.done{cursor:pointer}
.mk.done .ring{fill:var(--clear);stroke:#e8f0de}
.mk .pulse{fill:none;stroke:var(--signal);stroke-width:3;opacity:0}
.mk.now .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.4);opacity:0}}
.mk.open .ring{fill:#8a3523;stroke:#f4dcd4}
.mk.sub .ring{stroke-width:2}
.modes{display:grid;gap:10px;margin-top:6px}
.mode{font:inherit;text-align:left;padding:12px 14px;border-radius:3px;border:1.5px solid #b7ae95;background:#f6f1e3;color:var(--paper-ink);cursor:pointer;display:grid;gap:2px}
.mode b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.mode span{font-size:.92rem;color:var(--muted)}
.mode:hover{border-color:var(--signal)}
.mode:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
@media (min-width:520px){.modes{grid-template-columns:1fr 1fr}}
.place{font-family:var(--f-label);font-size:14px;fill:#2a2822;paint-order:stroke;stroke:var(--land);stroke-width:3px;letter-spacing:.04em}
.hud{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:2}
.box{background:rgba(26,31,35,.82);padding:6px 10px;border-radius:3px}
.clock{font-family:var(--f-display);font-size:1.05rem;line-height:1.2}
.clock small{display:block;font-family:var(--f-label);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#c9c3b2}
.legend{font-family:var(--f-label);font-size:.8rem;display:flex;flex-direction:column;gap:3px;color:#d8d2c0}
.legend i{display:inline-block;width:12px;height:10px;margin-right:6px;vertical-align:-1px;border:1px solid #8f8466}
.timeline{position:absolute;left:16px;right:16px;bottom:12px;z-index:2;pointer-events:none}
.tl-track{position:relative;height:30px;background:rgba(26,31,35,.82);border-radius:3px}
.tl-bar{position:absolute;left:14px;right:14px;top:9px;height:3px;background:#56615f}
.tl-fill{position:absolute;left:0;top:0;height:100%;background:var(--brass);transition:width 1.6s ease}
.tl-year{position:absolute;top:13px;transform:translateX(-50%);font-family:var(--f-label);font-size:.72rem;color:#c9c3b2;font-variant-numeric:tabular-nums}
.tl-tick{position:absolute;top:-3px;width:1px;height:9px;background:#8a928f}
.dock{flex:0 1 auto;max-height:52%;overflow:auto;padding:14px 16px 18px;background:var(--night)}
.card{background:var(--paper);color:var(--paper-ink);border-radius:3px;padding:18px 18px 16px;box-shadow:0 6px 24px rgba(0,0,0,.35);border-top:6px double var(--khaki);max-width:62ch;margin-inline:auto;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.stamp{font-family:var(--f-label);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.stamp b{color:var(--signal);font-weight:600}
.card h2{font-family:var(--f-display);font-weight:400;font-size:1.5rem;line-height:1.15;margin:.35em 0 .5em;text-wrap:balance}
.card p{margin:0 0 .7em}
.card a{color:#8a3523;font-weight:600}
.quiz{margin-top:14px;padding-top:12px;border-top:1px dashed #b7ae95}
.quiz .q{font-weight:600}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{font:inherit;text-align:left;padding:10px 12px;border-radius:3px;border:1.5px solid #b7ae95;background:#f6f1e3;color:var(--paper-ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--paper-ink)}
.opt:focus-visible,.go:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.opt.wrong{border-color:var(--signal);background:#f3d9d2;text-decoration:line-through}
.opt.right{border-color:var(--clear);background:#dcebd2;font-weight:600}
.fb{margin-top:10px;font-size:.95rem}
.fb.ok b{color:#3f7a30}.fb.no b{color:var(--signal)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.foot span{font-family:var(--f-label);font-size:.85rem;color:var(--muted);letter-spacing:.05em}
.go{font-family:var(--f-label);font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;border-radius:3px;border:0;background:var(--paper-ink);color:var(--paper);cursor:pointer}
.go:disabled{opacity:.35;cursor:not-allowed}
.go.ready{background:var(--signal);animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
.discuss{background:#e1d8be;padding:10px 12px;border-radius:3px;font-style:italic}
.score{font-family:var(--f-display);font-size:1.15rem}
.note{font-size:.85rem;color:var(--muted)}
.stage{position:absolute;inset:0;z-index:1;opacity:0;transition:opacity .9s ease;background:#1a1f23}
.stage.in{opacity:1}
.stage.peek{opacity:0;pointer-events:none}
.stage-art{position:absolute;inset:0;overflow:hidden}
.stage-art svg{width:100%;height:100%;display:block}
.stage.in .stage-art{animation:dive 1.6s cubic-bezier(.2,.8,.2,1)}
@keyframes dive{from{transform:scale(1.35);filter:blur(4px)}to{transform:none;filter:none}}
.stage-cap{display:none;position:absolute;left:16px;bottom:56px;z-index:2;font-family:var(--f-display);font-size:1.25rem;color:#f4efe2;text-shadow:0 2px 8px rgba(0,0,0,.6);max-width:70%}
.stage-cap small{display:block;font-family:var(--f-label);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#e2dccb}
.mapbtn{position:absolute;right:16px;bottom:56px;z-index:4;font-family:var(--f-label);font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:3px;border:0;background:rgba(26,31,35,.85);color:var(--paper);cursor:pointer;pointer-events:auto}
.stage.peek .mapbtn{opacity:1}
.map.scene-on .legend{display:none}
.pan{animation:pan 34s ease-in-out infinite alternate}
.pan.far{--d:-140px}.pan.sky{--d:-300px}.pan.mid{--d:-520px}.pan.near{--d:-620px}
@keyframes pan{from{transform:translateX(0)}to{transform:translateX(var(--d))}}
.fly{animation:fly 14s linear infinite}
@keyframes fly{to{transform:translateX(2000px)}}
.dive{animation:divebomb 5s ease-in infinite}
@keyframes divebomb{0%{transform:translate(-120px,-80px);opacity:0}10%{opacity:1}80%{transform:translate(90px,170px);opacity:1}100%{transform:translate(110px,200px);opacity:0}}
.bob{animation:bob 3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(4px)}}
.walk{animation:walk 9s linear infinite alternate}
@keyframes walk{to{transform:translateX(60px)}}
.drive{animation:drive 12s linear infinite}
@keyframes drive{from{transform:translateX(-80px)}to{transform:translateX(220px)}}
.smoke{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(26px,-14px)}}
.glow{animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.15}}
.flicker{transform-box:fill-box;transform-origin:center bottom;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{to{transform:scaleY(.82) scaleX(1.08)}}
.flash{opacity:0;animation:flash 3.2s ease-out infinite}
@keyframes flash{0%{opacity:0}4%{opacity:1}16%{opacity:0}100%{opacity:0}}
.puff{opacity:0;transform-box:fill-box;transform-origin:center;animation:puff 4s ease-out infinite}
@keyframes puff{0%{opacity:0;transform:scale(.3)}10%{opacity:.8}70%{opacity:0;transform:scale(1.8)}100%{opacity:0}}
.beam{animation:beam 7s ease-in-out infinite alternate}
@keyframes beam{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.para{animation:para 12s linear infinite}
@keyframes para{from{transform:translate(0,-60px)}to{transform:translate(40px,360px)}}
.fall{animation:fall 7s linear infinite}
@keyframes fall{to{transform:translate(30px,530px)}}
.rise{animation:rise 6s linear infinite;opacity:.8}
@keyframes rise{to{transform:translate(-40px,-540px);opacity:0}}
.twinkle{animation:tw 2.2s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.wobble{animation:wob 2.6s ease-in-out infinite alternate}
@keyframes wob{to{transform:scale(1.03,.97)}}
.sway{animation:sway 4s ease-in-out infinite alternate;transform-box:view-box}
@keyframes sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
.blink{animation:tw .9s steps(2) infinite}
.flap{transform-box:fill-box;transform-origin:left center;animation:flap 1.6s ease-in-out infinite alternate}
@keyframes flap{to{transform:skewY(-4deg) scaleX(.94)}}
.wave{animation:wave 5s linear infinite}
@keyframes wave{to{transform:translateX(-40px)}}
@media (min-width:860px){
  .dock{position:absolute;right:20px;top:20px;bottom:20px;width:400px;max-height:none;background:none;padding:0;z-index:3}
  .hud{right:440px}.timeline{right:440px}
  .map{flex:1 1 auto}
}
@media (max-width:520px){.legend{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <div class="map" id="map">
    <svg id="svg" preserveAspectRatio="xMidYMid meet" aria-label="Världskarta med händelser under andra världskriget">
      <defs>
        <pattern id="neutral" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="6" height="6" fill="#cbbf9c"/><rect width="2.4" height="6" fill="#5d84a6"/>
        </pattern>
      </defs>
      <g id="grat"></g><g id="land"></g><path id="route" class="route"></path><g id="labels"></g><g id="marks"></g><g id="subs"></g>
    </svg>
    <div class="stage" id="stage" hidden><div class="stage-art" id="stageArt"></div><div class="stage-cap" id="stageCap"></div><button class="mapbtn" id="mapBtn">Visa kartan</button></div>
    <div class="hud">
      <div class="box clock" id="clock"><small>Andra världskriget</small>1939–1945</div>
      <div class="box legend"><span><i style="background:#d89a7c"></i>Berörda länder</span><span><i style="background:repeating-linear-gradient(45deg,#cbbf9c 0 3px,#5d84a6 3px 5px)"></i>Sverige (neutralt)</span><span style="color:#a9a492">Kartan visar dagens gränser</span></div>
    </div>
    <div class="timeline"><div class="tl-track" id="tl"><div class="tl-bar"><div class="tl-fill" id="tlfill" style="width:0"></div></div></div></div>
  </div>
  <div class="dock" id="dock" aria-live="polite"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.min.js"></script>
<script>
const DDAY_URL="";
const EV=[
 {d:"1 september 1939",y:1939.67,place:"Polen",lon:21.0,lat:52.2,zoom:230,hl:["POL","DEU"],title:"Kriget börjar",
  facts:["Tyskland anfaller Polen den 1 september 1939. Två dagar senare förklarar Storbritannien och Frankrike krig mot Tyskland.",
   "Veckan innan hade Hitler och Stalin skrivit under en pakt om att inte anfalla varandra. I hemlighet delade de upp Östeuropa mellan sig, och den 17 september anföll Sovjetunionen Polen från öster."],
  q:"Vilket land anföll Polen från öster den 17 september 1939?",opts:["Italien","Sovjetunionen","Ungern"],ok:1,
  why:"Pakten mellan Hitler och Stalin gav Sovjetunionen östra Polen."},
 {d:"30 november 1939",y:1939.91,place:"Finland",lon:28.7,lat:60.7,zoom:260,hl:["FIN","RUS"],title:"Vinterkriget",
  facts:["Sovjetunionen anfaller Finland. Finländarna försvarar sig i sträng kyla, bland annat med skidpatruller i vita kamouflagedräkter.",
   "Omkring 8 000 svenska frivilliga reste till Finland för att strida. Sverige var officiellt neutralt men skickade också vapen och förnödenheter.",
   "I mars 1940 slöts fred. Finland förblev självständigt men fick lämna ifrån sig stora delar av Karelen."],
  q:"Hur hjälpte många svenskar Finland under vinterkriget?",opts:["Sverige förklarade krig mot Sovjetunionen","De reste dit som frivilliga soldater","Svenska flottan blockerade Leningrad"],ok:1,
  why:"Sverige gick aldrig med i kriget, men frivilligkåren och materielhjälpen var stor."},
 {d:"9 april 1940",y:1940.27,place:"Narvik",lon:17.4,lat:68.4,zoom:240,hl:["NOR","DNK"],extra:[["Kiruna",20.2,67.85],["Luleå",22.15,65.58]],title:"Danmark och Norge ockuperas",
  facts:["Tyskland ockuperar Danmark på några timmar och anfaller Norge. Norge gör motstånd i två månader men kapitulerar i juni 1940.",
   "Narvik var viktigt på grund av järnmalmen från Kiruna. På vintern, när hamnen i Luleå frös, skeppades malmen ut via isfria Narvik. Mycket av malmen gick till Tysklands vapenindustri.",
   "Sverige höll sig utanför kriget men lät tyska soldater resa med tåg genom landet mellan 1940 och 1943. Det kallades permittenttrafiken och var mycket omdiskuterat."],
  q:"Varför var Narvik så viktigt för Tyskland?",opts:["Det var Norges huvudstad","Hamnen skeppade ut järnmalm från Kiruna","Där fanns Norges enda flygplats"],ok:1,
  why:"Järnmalm behövs för att tillverka stål, och stål behövs till stridsvagnar, fartyg och vapen."},
 {d:"26 maj 1940",y:1940.4,place:"Dunkerque",lon:2.4,lat:51.0,zoom:230,hl:["FRA","BEL","NLD"],title:"Frankrike faller",
  facts:["Den 10 maj 1940 anfaller Tyskland Nederländerna, Belgien och Frankrike. Med snabba anfall med stridsvagnar och flyg tar de sig runt de allierades försvar.",
   "Vid Dunkerque blir de allierade instängda mot havet. Under nio dagar evakueras omkring 338 000 soldater till England, med hjälp av hundratals civila småbåtar.",
   "Den 14 juni intas Paris. Frankrike skriver under ett vapenstillestånd den 22 juni."],
  q:"Vad kallades Tysklands snabba anfallstaktik?",opts:["Blixtkrig","Ställningskrig","Gerillakrig"],ok:0,
  why:"Ställningskrig med skyttegravar präglade första världskriget. Blixtkriget var raka motsatsen."},
 {d:"Juli–oktober 1940",y:1940.6,place:"London",lon:-0.13,lat:51.5,zoom:230,hl:["GBR"],title:"Slaget om Storbritannien",
  facts:["Hitler vill invadera Storbritannien, men först måste Tyskland ta kontrollen över luften. Från juli till oktober 1940 strider tyska Luftwaffe mot brittiska RAF.",
   "Britterna har radar som varnar när planen kommer. Tyskland misslyckas och skjuter upp invasionen. I stället bombas London och andra städer under det som kallas the Blitz."],
  q:"Vilken teknik hjälpte britterna att upptäcka fiendens flygplan i tid?",opts:["Satelliter","Drönare","Radar"],ok:2,
  why:"Radarstationer längs kusten gav RAF tid att få upp sina plan i luften."},
 {d:"22 juni 1941",y:1941.47,place:"Moskva",lon:37.6,lat:55.75,zoom:330,hl:["RUS","UKR","BLR"],title:"Operation Barbarossa",
  facts:["Tyskland bryter pakten och anfaller Sovjetunionen med omkring tre miljoner soldater. Det är det största anfallet i krigets historia.",
   "Finland går också med i anfallet för att ta tillbaka Karelen. Det kallas fortsättningskriget.",
   "Tyskarna tar sig nästan fram till Moskva men stoppas i december 1941 av sträng vinter och sovjetiska motanfall. Leningrad belägras i nästan 900 dagar."],
  q:"Varför stoppades tyskarna framför Moskva?",opts:["Sträng vinter och sovjetiska motanfall","Hitler bestämde sig för att vända om","USA bombade Berlin"],ok:0,
  why:"De tyska soldaterna saknade vinterutrustning, och Sovjet hade fått nya trupper från Sibirien."},
 {d:"7 december 1941",y:1941.93,place:"Pearl Harbor",lon:-157.95,lat:21.35,zoom:420,hl:["USA","JPN"],title:"Japan anfaller USA",
  facts:["Japanska flygplan från hangarfartyg anfaller den amerikanska flottbasen Pearl Harbor på Hawaii. Omkring 2 400 amerikaner dödas.",
   "Dagen efter förklarar USA krig mot Japan. Några dagar senare förklarar Tyskland och Italien krig mot USA. Nu är kriget verkligen ett världskrig."],
  q:"Vad blev följden av anfallet mot Pearl Harbor?",opts:["USA gick med i kriget","USA förklarade sig neutralt","Japan kapitulerade"],ok:0,
  why:"USA:s enorma industri blev avgörande för de allierade resten av kriget."},
 {d:"1942",y:1942.05,place:"Auschwitz",lon:19.2,lat:50.03,zoom:230,hl:["POL","DEU"],title:"Förintelsen",
  facts:["Nazisterna förföljde judar från första dagen vid makten. I januari 1942 planerade nazistiska ledare vid Wannseekonferensen i Berlin hur Europas judar skulle mördas.",
   "Omkring sex miljoner judar mördades under Förintelsen. Även romer, homosexuella, personer med funktionsnedsättning och politiska motståndare förföljdes och mördades.",
   "I Auschwitz-Birkenau i det ockuperade Polen mördades över en miljon människor. Lägret befriades av sovjetiska soldater den 27 januari 1945."],
  q:"Varför är 27 januari Förintelsens minnesdag?",opts:["Då började andra världskriget","Då befriades Auschwitz","Då kapitulerade Tyskland"],ok:1,
  why:"Varje år den 27 januari minns man Förintelsens offer, även i svenska skolor."},
 {d:"4 juni 1942",y:1942.43,place:"Midway",lon:-177.37,lat:28.2,zoom:420,hl:["JPN"],title:"Slaget vid Midway",
  facts:["Japan har erövrat stora delar av Sydostasien och Stilla havet. Vid ön Midway försöker de locka ut och förstöra den amerikanska flottan.",
   "Amerikanerna har knäckt Japans hemliga koder och vet vad som ska hända. De sänker fyra japanska hangarfartyg. Efter Midway är Japan på reträtt."],
  q:"Hur kunde amerikanerna veta om anfallet i förväg?",opts:["En japansk general avslöjade planen","De hade knäckt Japans koder","De såg flottan med satellit"],ok:1,
  why:"Kodknäckning var avgörande på flera fronter. Britterna knäckte också tyska Enigma-koder."},
 {d:"2 februari 1943",y:1943.09,place:"Stalingrad",lon:44.5,lat:48.7,zoom:300,hl:["RUS"],title:"Slaget om Stalingrad",
  facts:["Från augusti 1942 strider tyska och sovjetiska soldater om varje hus och gata i staden Stalingrad vid floden Volga.",
   "Röda armén omringar den tyska 6:e armén, som kapitulerar i februari 1943. Omkring två miljoner soldater och civila dödas eller skadas. Slaget ses som vändpunkten på östfronten."],
  q:"Varför räknas Stalingrad som en vändpunkt?",opts:["Där tog kriget slut","Där gick USA med i kriget","Efter slaget var Tyskland på reträtt i öst"],ok:2,
  why:"Efter Stalingrad tog Röda armén initiativet och pressade tyskarna västerut ända till Berlin."},
 {d:"6 juni 1944",y:1944.43,place:"Normandie",lon:-0.87,lat:49.37,zoom:220,hl:["FRA"],title:"Dagen D",dday:true,
  facts:["Omkring 156 000 allierade soldater landstiger i Normandie från havet och luften. Nu måste Tyskland strida på två fronter i Europa: i väst och i öst.",
   "Paris befrias i augusti 1944."],
  q:"Varför var Dagen D så viktig?",opts:["Kriget i Stilla havet tog slut","Tyskland fick strida på två fronter","Sverige gick med i kriget"],ok:1,

 [ D("Westerplatte",18.67,54.41,"1 sep 1939, gryning","Första skotten",
    ["Kriget börjar när det tyska slagskeppet Schleswig-Holstein öppnar eld mot den polska militärbasen Westerplatte vid Danzig.","Omkring 200 polska soldater håller ut i sju dagar mot en mycket större styrka. Samma morgon bombar tyskt flyg polska städer, bland annat Wieluń."],

 [ D("Suomussalmi",28.9,64.9,"December 1939","Skidtrupperna i skogen",

   D("Viborg",28.75,60.71,"13 mars 1940","Freden i Moskva",

 [ D("Köpenhamn",12.57,55.68,"9 april 1940","Danmark ger upp",

   D("Oslofjorden",10.63,59.66,"9 april 1940","Blücher sänks",
    ["Den tyska kryssaren Blücher är på väg mot Oslo med trupper. Kanoner och torpeder från fästningen Oscarsborg sänker fartyget i Oslofjorden.","Förseningen gör att kungen och regeringen hinner fly från Oslo med landets guldreserv. Kung Haakon leder senare motståndet från London."],

   D("Narvik",17.43,68.44,"April–juni 1940","Striden om malmhamnen",

   D("Storlien",12.1,63.32,"1940–1943","Tåg genom Sverige",
    ["Sverige låter tyska soldater på permission resa med tåg genom landet mellan Norge och Tyskland. Det kallas permittenttrafiken och pågår till augusti 1943.","Sommaren 1941 tillåter regeringen också att en hel tysk division åker genom Sverige till Finland. Beslutet kallas midsommarkrisen."],

 [ D("Sedan",4.94,49.7,"13 maj 1940","Genom Ardennerna",
    ["Frankrike hade byggt en stark försvarslinje mot Tyskland, Maginotlinjen. Fransmännen trodde att de täta skogarna i Ardennerna var omöjliga för stridsvagnar.","Tyskarna tar sig ändå igenom skogen och går över floden Maas vid Sedan. Därmed går de runt Maginotlinjen."],

   D("Dunkerque",2.38,51.03,"26 maj–4 juni 1940","Operation Dynamo",

 [ D("Dover",1.31,51.13,"Juli–augusti 1940","Striden över kanalen",

   D("Kent",0.6,51.25,"Augusti–september 1940","Piloterna",

   D("Singapore",103.82,1.35,"15 februari 1942","Imperiet faller",

 [ D("Berlin",13.4,52.52,"1933–1938","Utestängda steg för steg",

 [ D("Kaukasus",44.0,43.5,"Sommaren 1942","Jakten på olja",

/* ---------- projection & map data ---------- */
const R=Math.PI/180, S=170;
function proj(lon,lat){
  const l=lon*R, p=lat*R, p2=p*p, p4=p2*p2;
  const x=l*(0.8707-0.131979*p2+p4*(-0.013791+p4*(0.003971*p2-0.001529*p4)));
  const y=p*(1.007226+p2*(0.015085+p4*(-0.044475+0.028874*p2-0.005916*p4)));
  return [x*S,-y*S];
}
const NSV="http://www.w3.org/2000/svg";
const svg=document.getElementById("svg"), land=document.getElementById("land");
const pathOf=pts=>"M"+pts.map(([a,b])=>{const [x,y]=proj(a,b);return x.toFixed(1)+" "+y.toFixed(1)}).join("L")+"Z";
const ringPath=pts=>{
  const out=[pts[0].slice()];let mn=pts[0][0],mx=pts[0][0];
  for(let i=1;i<pts.length;i++){let lon=pts[i][0];const prev=out[i-1][0];while(lon-prev>180)lon-=360;while(lon-prev<-180)lon+=360;out.push([lon,pts[i][1]]);mn=Math.min(mn,lon);mx=Math.max(mx,lon);}
  let d=pathOf(out);
  if(mx>180)d+=pathOf(out.map(([a,b])=>[a-360,b]));
  if(mn<-180)d+=pathOf(out.map(([a,b])=>[a+360,b]));
  return d;
};
function drawGrat(){
  let d="";
  for(let lon=-180;lon<=180;lon+=20){const pts=[];for(let lat=-80;lat<=80;lat+=4)pts.push(proj(lon,lat));d+="M"+pts.map(p=>p.map(v=>v.toFixed(1)).join(" ")).join("L");}
  for(let lat=-60;lat<=80;lat+=20){const pts=[];for(let lon=-180;lon<=180;lon+=4)pts.push(proj(lon,lat));d+="M"+pts.map(p=>p.map(v=>v.toFixed(1)).join(" ")).join("L");}
  document.getElementById("grat").innerHTML=`<path class="grat" d="${d}"/>`;
}
function drawLand(){
  const topo=window.Datamap&&Datamap.prototype.worldTopo;
  if(!topo||!topo.objects){ land.innerHTML=""; return false; }
  const tf=topo.transform;
  const arcs=topo.arcs.map(a=>{let x=0,y=0;return a.map(p=>{if(tf){x+=p[0];y+=p[1];return [x*tf.scale[0]+tf.translate[0],y*tf.scale[1]+tf.translate[1]];}return p;});});
  const ring=idx=>{const out=[];idx.forEach((i,j)=>{let a=i<0?arcs[~i].slice().reverse():arcs[i];if(j>0)a=a.slice(1);out.push(...a);});return out;};
  const obj=topo.objects.world||topo.objects[Object.keys(topo.objects)[0]];
  let html="";
  obj.geometries.forEach(g=>{
    if(g.id==="ATA"||!g.arcs) return;
    const polys=g.type==="Polygon"?[g.arcs]:g.type==="MultiPolygon"?g.arcs:[];
    const d=polys.map(poly=>poly.map(r=>ringPath(ring(r))).join("")).join("");
    html+=`<path class="country${g.id==="SWE"?" swe":""}" data-id="${g.id}" d="${d}" fill-rule="evenodd"/>`;
  });
  land.innerHTML=html; return true;
}

const FULL={x:0,y:-10,w:2*Math.PI*0.8707*S*1.02};
let cam={...FULL};
function box(){const r=svg.getBoundingClientRect();return {W:Math.max(r.width,1),H:Math.max(r.height,1)}}
function focusFrac(){return innerWidth>=860?0.5:0.5}
function apply(){
  const {W,H}=box(), w=cam.w, h=w*H/W;
  svg.setAttribute("viewBox",`${cam.x-w/2} ${cam.y-h*0.55} ${w} ${h}`);
  const k=w/W;
  marks.childNodes.forEach(g=>{const e=EV[g.dataset.i];g.setAttribute("transform",`translate(${e.px} ${e.py}) scale(${k})`);});
  labels.childNodes.forEach(g=>g.setAttribute("transform",`translate(${g.dataset.x} ${g.dataset.y}) scale(${k})`));
  document.querySelectorAll("#subs > g").forEach(g=>g.setAttribute("transform",`translate(${g.dataset.x} ${g.dataset.y}) scale(${k})`));
}
let raf=null;
function fly(to,done){
  const from={...cam}, dx=to.x-from.x, dy=to.y-from.y, dist=Math.hypot(dx,dy);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur=reduce?1:Math.min(3400,1300+dist*2.2), t0=performance.now();
  const lift=Math.max(0,dist*1.15-(from.w+to.w)/2);
  cancelAnimationFrame(raf);
  const step=now=>{
    const t=Math.min(1,(now-t0)/dur), e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    cam={x:from.x+dx*e,y:from.y+dy*e,w:from.w+(to.w-from.w)*e+lift*Math.sin(Math.PI*e)};
    apply();
    if(t<1) raf=requestAnimationFrame(step); else done&&done();
  };
  raf=requestAnimationFrame(step);
}

function ground(g,sk){
  const far=sk[2], b={far:"",mid:"",near:""};
  const land=(c,c2)=>{b.mid+=`<rect x="-300" y="${H}" width="2200" height="300" fill="${c}"/>`;b.near+=`<path d="M-300 ${H+150}Q400 ${H+136} 900 ${H+148}T2000 ${H+142}L2000 600L-300 600Z" fill="${c2||c}"/>`;};
  const sea=(c=GC.sea)=>{b.mid+=`<rect x="-300" y="${H}" width="2200" height="300" fill="${c}"/>`;let w="";for(let r=0;r<6;r++){const y=H+18+r*r*9;w+=`<path class="wave" d="M-300 ${y}`+Array.from({length:60},(_,i)=>` q20 -4 40 0`).join("")+`" stroke="#a9bec3" stroke-opacity="${.18+r*.05}" fill="none"/>`;}b.mid+=w;};
  const dark=c=>sk===SKY.night?"#28313a":c;
  switch(g){
    case "sea": sea(); break;
    case "coast": sea(); b.mid+=`<path d="M820 600L860 ${H+40}Q1100 ${H+20} 2000 ${H+30}L2000 600Z" fill="${GC.sand}"/>`; break;
    case "beach": b.mid+=`<rect x="-300" y="${H}" width="2200" height="60" fill="${GC.sea}"/><rect x="-300" y="${H+56}" width="2200" height="300" fill="${GC.sand}"/>`; break;
    case "fjord": sea(); break;
    case "river": land(dark(GC.field),dark("#4f5a32")); b.mid+=`<path d="M-300 ${H+22}Q600 ${H+10} 1900 ${H+28}L1900 ${H+50}Q600 ${H+40} -300 ${H+48}Z" fill="#45626b"/>`; break;
    case "ice": b.mid+=`<rect x="-300" y="${H}" width="2200" height="300" fill="${dark(GC.ice)}"/>`;for(let i=0;i<12;i++){const x=rnd()*1600;b.near+=`<path d="M${x} ${H+80+rnd()*120}l40 -6l30 10" stroke="#9fb3bb" fill="none"/>`;} break;
    case "jungle": sea(); b.mid+=`<path d="M560 600L620 ${H+46}Q1100 ${H+30} 2000 ${H+40}L2000 600Z" fill="${GC.sand}"/>`; break;
    default: land(dark(GC[g]||GC.field), dark(g==="snow"?"#f1f4f4":g==="steppe"?"#b39f68":g==="city"?"#59564f":"#4f5a32"));
  }
  return b;
}
function sceneSVG(spec,key){
  seed=key; SK=SKY[spec.sky]||SKY.day;
  const L={far:"",mid:"",sky:"",near:"",lit:"",fx:""};
  const b=ground(spec.g,SK); L.far+=b.far; L.mid+=b.mid; L.near+=b.near;
  spec.it.forEach(([name,...a])=>{
    let args=a.map(v=>v==="F"?SK[2]:v==="M"?SK[3]:v);
    const out=P[name](...args); L[LAYER[name]||"mid"]+=out;
  });
  let fx="";
  if(spec.fx==="snow")for(let i=0;i<70;i++)fx+=`<circle class="fall" cx="${(rnd()*800).toFixed(0)}" cy="-10" r="${(1+rnd()*1.8).toFixed(1)}" fill="#fff" opacity=".85" style="animation-delay:${(-rnd()*8).toFixed(1)}s;animation-duration:${(5+rnd()*5).toFixed(1)}s"/>`;
  if(spec.fx==="embers")for(let i=0;i<30;i++)fx+=`<circle class="rise" cx="${(rnd()*800).toFixed(0)}" cy="520" r="1.6" fill="#f3a246" style="animation-delay:${(-rnd()*6).toFixed(1)}s"/>`;
  const tint=spec.sky==="night"?`<rect x="0" y="0" width="800" height="500" fill="#06101c" opacity=".38"/>`:"";
  return `<svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${SK[0]}"/><stop offset=".62" stop-color="${SK[1]}"/></linearGradient></defs>
    <rect width="800" height="500" fill="url(#skyg)"/>
    <g class="pan far">${L.far}</g><g class="pan sky">${L.sky}</g><g class="pan mid">${L.mid}</g><g class="pan near">${L.near}</g>${tint}<g class="pan mid">${L.lit}</g><g>${L.fx}${fx}</g></svg>`;
}

/* ---------- game ---------- */
let mode="light", cur=-1, sub=-1, moving=false;
const done=EV.map(()=>false);
let subDone=DEEP.map(a=>a.map(()=>false));
let firstTry={}, asked=0;
const dock=document.getElementById("dock"), clock=document.getElementById("clock"), route=document.getElementById("route");
const subsG=document.getElementById("subs");
const L="ABCD";
const stage=document.getElementById("stage"),stageArt=document.getElementById("stageArt"),stageCap=document.getElementById("stageCap"),mapBtn=document.getElementById("mapBtn"),mapEl=document.getElementById("map");
let stageTimer=null;
function showScene(key,cap,date){
  const spec=SC[key]; if(!spec){hideScene();return;}
  clearTimeout(stageTimer);
  stageArt.innerHTML=sceneSVG(spec,key.split("_").reduce((a,b)=>a*31+(+b)+7,11));
  stageCap.innerHTML=`<small>${date}</small>${cap}`;
  stage.hidden=false; stage.classList.remove("peek"); mapBtn.textContent="Visa kartan"; mapEl.classList.add("scene-on");
  requestAnimationFrame(()=>requestAnimationFrame(()=>stage.classList.add("in")));
}
function hideScene(){
  stage.classList.remove("in"); mapEl.classList.remove("scene-on");
  stageTimer=setTimeout(()=>{stage.hidden=true;stageArt.innerHTML="";},900);
}
mapBtn.onclick=()=>{const p=stage.classList.toggle("peek");mapBtn.textContent=p?"Visa platsen":"Visa kartan";mapEl.classList.toggle("scene-on",!p);};

function drawSubs(){
  subsG.innerHTML="";
  if(mode!=="deep"||cur<0||cur>=EV.length) return;
  DEEP[cur].forEach((s,j)=>{const [x,y]=proj(s.lon,s.lat);s.px=x;s.py=y;
    const g=document.createElementNS(NSV,"g");g.dataset.x=x;g.dataset.y=y;
    g.setAttribute("class","mk sub"+(subDone[cur][j]?" done":"")+(j===sub?" now":""));
    g.innerHTML=`<circle class="pulse" r="9"/><circle class="ring" r="9"/><text text-anchor="middle" y="4" style="font-size:12px">${L[j]}</text>`;
    subsG.appendChild(g);});
}
function refresh(){
  marks.childNodes.forEach(g=>{const i=+g.dataset.i;g.setAttribute("class","mk"+(done[i]?" done":"")+(i===cur&&sub<0?" now":"")+(i===cur&&sub>=0?" open":""));});
  const hl=cur>=0&&cur<EV.length?EV[cur].hl:[];
  land.querySelectorAll(".country").forEach(p=>p.classList.toggle("hl",hl.includes(p.dataset.id)));
  const reached=EV.filter((e,i)=>i<=cur||done[i]);
  route.setAttribute("d",reached.length>1?"M"+reached.map(e=>e.px.toFixed(1)+" "+e.py.toFixed(1)).join("L"):"");
  const y=cur>=EV.length?Y1:cur>=0?EV[cur].y:Y0;
  tlfill.style.width=(frac(y)*100)+"%";
  drawSubs(); apply();
}
function target(e){return {x:e.px,y:e.py,w:e.zoom}}
function intro(){
  cur=-1; sub=-1; hideScene(); refresh(); labels.innerHTML="";
  dock.innerHTML=`<article class="card">
    <div class="stamp"><span>Uppdrag · 1939–1945</span><b>Kartrummet</b></div>
    <h2>Andra världskriget, steg för steg</h2>
    <p>Du följer kriget från första dagen i Polen till Japans kapitulation. Kartan flyger till varje händelse i tidsordning.</p>
    <p>Välj hur du vill spela:</p>
    <div class="modes">
      <button class="mode" id="mLight"><b>Lättläst</b><span>${EV.length} händelser, en kort rapport och en fråga vid varje. Ca 20 minuter.</span></button>
      <button class="mode" id="mDeep"><b>Fördjupning</b><span>Varje händelse delas upp i 3–4 delstopp med egna rapporter och frågor. Ca 60 minuter.</span></button>
    </div>
    ${hasLand?"":`<p class="note">Kartbilden kunde inte laddas, men spelet fungerar ändå.</p>`}
  </article>`;
  document.getElementById("mLight").onclick=()=>{mode="light";goTo(0);};
  document.getElementById("mDeep").onclick=()=>{mode="deep";goTo(0);};
}
function flying(stamp,title){
  dock.innerHTML=`<article class="card"><div class="stamp"><span>På väg</span><b>${stamp}</b></div><h2>${title}</h2><p>Kartan flyger dit…</p></article>`;
}
function goTo(i){
  moving=true; cur=i; sub=-1; hideScene(); refresh(); labels.innerHTML="";
  const e=EV[i]; flying(e.d,e.place);
  fly(target(e),()=>{moving=false;setLabels(e);apply();render();});
}
function goSub(j){
  moving=true; sub=j; hideScene(); refresh(); labels.innerHTML="";
  const s=DEEP[cur][j]; flying(s.d,s.place);
  setTimeout(()=>fly({x:s.px,y:s.py,w:s.z||EV[cur].zoom*0.6},()=>{setLabels({place:s.place,lon:s.lon,lat:s.lat});apply();
    fly({x:s.px,y:s.py,w:(s.z||EV[cur].zoom*0.6)*0.35},()=>{moving=false;showScene(cur+"_"+j,s.place,s.d);render();});}),stage.hidden?0:500);
}
function quizHTML(item,key){
  const solved=firstTry[key]!==undefined&&item._ok;
  return `<div class="quiz"><p class="q">${item.q}</p><div class="opts">${item.opts.map((o,k)=>`<button class="opt ${solved&&k===item.ok?"right":""}" data-k="${k}" ${solved?"disabled":""}>${o}</button>`).join("")}</div>
    <p class="fb ${solved?"ok":""}" id="fb">${solved?`<b>Rätt!</b> ${item.why}`:""}</p></div>`;
}
function render(){
  const i=cur, e=EV[i];
  const dd="";
  if(mode==="light"){
    clock.innerHTML=`<small>${e.place}</small>${e.d}`;
    const solved=done[i];
    dock.innerHTML=`<article class="card">
      <div class="stamp"><span>${e.d} · ${e.place}</span><b>Händelse ${i+1}/${EV.length}</b></div>
      <h2>${e.title}</h2>${e.facts.map(f=>`<p>${f}</p>`).join("")}${e.dday?dd:""}
      ${quizHTML(e,"e"+i)}
      <div class="foot"><span>${Math.floor(e.y)}</span><button class="go ${solved?"ready":""}" id="next" ${solved?"":"disabled"}>${i<EV.length-1?"Nästa händelse →":"Krigets slut →"}</button></div>
    </article>`;
    wire(e,"e"+i,()=>{done[i]=true;});
  } else if(sub<0){
    clock.innerHTML=`<small>${e.place}</small>${e.d}`;
    const parts=DEEP[i];
    dock.innerHTML=`<article class="card">
      <div class="stamp"><span>${e.d}</span><b>Händelse ${i+1}/${EV.length}</b></div>
      <h2>${e.title}</h2><p>${e.facts[0]}</p>
      <p class="note">Händelsen har ${parts.length} delstopp: ${parts.map((p,j)=>`<b>${L[j]}</b> ${p.place}`).join(", ")}.</p>
      <div class="foot"><span>Fördjupning</span><button class="go ready" id="next">Gå in i händelsen →</button></div>
    </article>`;
    document.getElementById("next").onclick=()=>{if(!moving)goSub(0);};
  } else {
    const s=DEEP[i][sub], n=DEEP[i].length, last=sub===n-1;
    clock.innerHTML=`<small>${s.place}</small>${s.d}`;
    const solved=subDone[i][sub];
    dock.innerHTML=`<article class="card">
      <div class="stamp"><span>${s.d} · ${s.place}</span><b>${i+1}${L[sub]} · ${e.title}</b></div>
      <h2>${s.title}</h2>${s.facts.map(f=>`<p>${f}</p>`).join("")}${e.dday&&s.place==="Omaha Beach"?dd:""}
      ${quizHTML(s,"s"+i+"_"+sub)}
      <div class="foot"><span>Delstopp ${sub+1} av ${n}</span><button class="go ${solved?"ready":""}" id="next" ${solved?"":"disabled"}>${last?(i<EV.length-1?"Nästa händelse →":"Krigets slut →"):"Nästa delstopp →"}</button></div>
    </article>`;
    wire(s,"s"+i+"_"+sub,()=>{subDone[i][sub]=true;if(subDone[i].every(Boolean))done[i]=true;});
  }
  dock.scrollTop=0;
}
function wire(item,key,onOk){
  dock.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k, fb=document.getElementById("fb");
    if(firstTry[key]===undefined){firstTry[key]=(k===item.ok);asked++;}
    if(k===item.ok){
      onOk(); item._ok=true; refresh();
      dock.querySelectorAll(".opt").forEach(x=>x.disabled=true); b.classList.add("right");
      fb.className="fb ok"; fb.innerHTML=`<b>Rätt!</b> ${item.why}`;
      const n=document.getElementById("next"); n.disabled=false; n.classList.add("ready"); n.focus({preventScroll:true});
    } else {
      b.classList.add("wrong"); b.disabled=true;
      fb.className="fb no"; fb.innerHTML=`<b>Inte riktigt.</b> Läs rapporten igen och försök på nytt.`;
    }
  });
  document.getElementById("next").onclick=next;
}
function next(){
  if(moving||cur<0||cur>=EV.length) return;
  if(mode==="deep"){
    if(sub<0){goSub(0);return;}
    if(!subDone[cur][sub]) return;
    if(sub<DEEP[cur].length-1){goSub(sub+1);return;}
  } else if(!done[cur]) return;
  if(cur<EV.length-1) goTo(cur+1); else finish();
}
function finish(){
  moving=true; cur=EV.length; sub=-1; hideScene(); refresh(); labels.innerHTML="";
  clock.innerHTML=`<small>Andra världskriget</small>1939–1945`;
  fly({...FULL},()=>{
    moving=false;
    const score=Object.values(firstTry).filter(Boolean).length;
    dock.innerHTML=`<article class="card">
      <div class="stamp"><span>Hösten 1945</span><b>Slutrapport</b></div>
      <h2>${END.title}</h2>${END.facts.map(f=>`<p>${f}</p>`).join("")}
      <p class="discuss">${END.discuss}</p>
      <div class="foot"><span class="score">${score} av ${asked} rätt på första försöket</span><button class="go" id="again">Spela igen</button></div>
    </article>`;
    document.getElementById("again").onclick=()=>{
      done.fill(false); subDone=DEEP.map(a=>a.map(()=>false)); firstTry={}; asked=0;
      EV.forEach(e=>delete e._ok); DEEP.flat().forEach(s=>delete s._ok); intro();};
  });
}
addEventListener("keydown",e=>{if(e.key==="ArrowRight")next();});

apply(); intro();
</script>
