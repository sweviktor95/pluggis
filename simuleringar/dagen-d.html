<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dagen D i Normandie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: one panoramic battlefield the camera walks through, with a field-report card docked below (phone) or to the right (desktop). Single dark wartime look by choice. */
:root{
  --night:#1b2024; --slate:#3a444b; --paper:#ece5d2; --paper-ink:#2a2822; --muted:#6c675a;
  --khaki:#7a7848; --signal:#c8452f; --clear:#5f9a4c; --brass:#d1a84c;
  --f-display:"Special Elite","Courier New",monospace;
  --f-body:"Barlow",system-ui,sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.5}
.app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.scene{position:relative;flex:1 1 52%;min-height:240px;background:linear-gradient(#59646b 0%,#8d9497 45%,#a9aca6 62%,#7d8784 100%)}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:2}
.clock{font-family:var(--f-display);font-size:1.05rem;background:rgba(27,32,36,.78);padding:6px 10px;border-radius:3px;line-height:1.2}
.clock small{display:block;font-family:var(--f-label);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#c9c3b2}
.steps{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;background:rgba(27,32,36,.78);padding:7px 9px;border-radius:3px}
.dot{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--signal);display:grid;place-items:center;font-family:var(--f-label);font-size:.75rem;color:var(--paper)}
.dot.done{background:var(--clear);border-color:var(--clear)}
.dot.now{box-shadow:0 0 0 3px rgba(209,168,76,.75)}
.dock{flex:0 1 auto;max-height:52%;overflow:auto;padding:14px 16px 18px;background:var(--night)}
.card{background:var(--paper);color:var(--paper-ink);border-radius:3px;padding:18px 18px 16px;box-shadow:0 6px 24px rgba(0,0,0,.35);border-top:6px double var(--khaki);max-width:62ch;margin-inline:auto;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.stamp{font-family:var(--f-label);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.stamp b{color:var(--signal);font-weight:600}
.card h2{font-family:var(--f-display);font-weight:400;font-size:1.5rem;line-height:1.15;margin:.35em 0 .5em;text-wrap:balance}
.card p{margin:0 0 .7em}
.quiz{margin-top:14px;padding-top:12px;border-top:1px dashed #b7ae95}
.quiz .q{font-weight:600}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{font:inherit;text-align:left;padding:10px 12px;border-radius:3px;border:1.5px solid #b7ae95;background:#f6f1e3;color:var(--paper-ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--paper-ink)}
.opt:focus-visible,.go:focus-visible,.marker:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.opt.wrong{border-color:var(--signal);background:#f3d9d2;text-decoration:line-through}
.opt.right{border-color:var(--clear);background:#dcebd2;font-weight:600}
.fb{margin-top:10px;font-size:.95rem}
.fb.ok b{color:#3f7a30}.fb.no b{color:var(--signal)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.foot span{font-family:var(--f-label);font-size:.85rem;color:var(--muted);letter-spacing:.05em}
.go{font-family:var(--f-label);font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;border-radius:3px;border:0;background:var(--paper-ink);color:var(--paper);cursor:pointer}
.go:disabled{opacity:.35;cursor:not-allowed}
.go.ready{background:var(--signal);animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
.discuss{background:#e1d8be;padding:10px 12px;border-radius:3px;font-style:italic}
.score{font-family:var(--f-display);font-size:1.15rem}
/* scene bits */
.marker{cursor:pointer}
.marker .ring{fill:rgba(200,69,47,.25);stroke:var(--signal);stroke-width:4}
.marker.done .ring{fill:var(--clear);stroke:#e8f0de}
.marker .pulse{fill:none;stroke:var(--signal);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
.marker.done .pulse{display:none}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.3);opacity:0}}
.wave{animation:wave 3.5s linear infinite}
@keyframes wave{to{transform:translateX(-80px)}}
.puff{transform-box:fill-box;transform-origin:center bottom;animation:puff 4s ease-out infinite;opacity:0}
@keyframes puff{0%{transform:scale(.2);opacity:0}8%{opacity:.85}60%{transform:scale(1.4) translateY(-20px);opacity:0}100%{opacity:0}}
.leg{transform-box:fill-box;transform-origin:top center}
.walking .leg.l{animation:stepA .42s ease-in-out infinite alternate}
.walking .leg.r{animation:stepA .42s ease-in-out infinite alternate-reverse}
@keyframes stepA{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.smoke{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(30px,-12px)}}
.flag{transform-box:fill-box;transform-origin:left center;animation:flap 1.6s ease-in-out infinite alternate}
@keyframes flap{to{transform:skewY(-4deg) scaleX(.94)}}
@media (min-width:860px){
  .dock{position:absolute;right:20px;top:72px;bottom:20px;width:400px;max-height:none;background:none;padding:0}
  .scene{flex:1 1 auto}
}
.flash{opacity:0;animation:flash 6s infinite}
@keyframes flash{0%,90%,100%{opacity:0}92%{opacity:1}96%{opacity:.2}98%{opacity:.9}}
.mg{opacity:0;animation:mg 2.4s infinite}
@keyframes mg{0%,55%,100%{opacity:0}58%{opacity:1}61%{opacity:0}64%{opacity:1}67%{opacity:0}72%{opacity:1}75%{opacity:0}}
.bob{animation:bob 3s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(1.6px)}}
.sway{animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}
.plane{animation:fly 30s linear infinite}
@keyframes fly{from{transform:translateX(-240px)}to{transform:translateX(1080px)}}
.prop{transform-box:fill-box;transform-origin:center;animation:prop .08s linear infinite alternate}
@keyframes prop{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.para{animation:drop 10s linear infinite}
@keyframes drop{0%{transform:translate(0,-300px);opacity:0}6%{opacity:1}88%{opacity:1}100%{transform:translate(46px,0);opacity:0}}
.geyser{transform-box:fill-box;transform-origin:center bottom;animation:geyser 5s ease-out infinite;opacity:0}
@keyframes geyser{0%{transform:scale(.2,.1);opacity:0}10%{opacity:.9}35%{transform:scale(1,1);opacity:.8}100%{transform:scale(1.3,.6);opacity:0}}
.spray{animation:spray 1.2s ease-in-out infinite alternate}
@keyframes spray{from{transform:translate(0,0);opacity:.9}to{transform:translate(-8px,-4px);opacity:.4}}
.win{animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.75}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>

<div class="app">
  <div class="scene" id="scene">
    <svg id="svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" aria-label="Normandies kust den 6 juni 1944">
      <g id="sky"></g>
      <g id="far"></g>
      <g id="world"></g>
    </svg>
    <div class="hud">
      <div class="clock" id="clock"><small>6 juni 1944</small>Kl. 05:30</div>
      <div class="steps" id="steps" aria-label="Framsteg"></div>
    </div>
  </div>
  <div class="dock" id="dock" aria-live="polite"></div>
</div>

<script>
const STAGES=[
 {x:330,label:"Båten",time:"05:30",place:"Engelska kanalen",title:"Ombord på landstigningsbåten",
  facts:["Det är den 6 juni 1944. Du sitter i en liten landstigningsbåt på väg mot Normandie i norra Frankrike. Invasionen heter Operation Overlord och leds av den amerikanske generalen Dwight D. Eisenhower.",
         "Nästan 7 000 fartyg och båtar korsar Engelska kanalen samtidigt. Det är den största landstigningen från havet i historien.",
         "Anfallet var planerat till den 5 juni men sköts upp ett dygn på grund av storm."],
  q:"Vad hette den allierade invasionen av Normandie?",opts:["Operation Overlord","Operation Barbarossa","Operation Market Garden"],ok:0,
  why:"Barbarossa var Tysklands anfall mot Sovjetunionen 1941. Market Garden var ett allierat anfall i Nederländerna i september 1944."},
 {x:1100,label:"Hindren",time:"06:30",place:"Vattenbrynet",title:"Rampen fälls",
  facts:["Rampen fälls och du hoppar ut i vatten som går upp till bröstet. Varje båt har plats för ungefär 30 soldater.",
         "I vattnet står tyska hinder: kryss av stålbalkar som kallas ”tjeckiska igelkottar”, trästolpar och minor. De ska slita upp båtarnas botten.",
         "De allierade landsteg vid lågvatten. Då syntes hindren, men soldaterna fick springa en längre sträcka över öppen strand."],
  q:"Varför landsteg man vid lågvatten?",opts:["För att kunna se hindren och minorna","För att vattnet var varmare då","För att tyskarna inte vaktade på morgonen"],ok:0,
  why:"Vid högvatten döljs hindren under ytan, och båtarna hade kört rakt in i dem."},
 {x:1750,label:"Stranden",time:"06:45",place:"Omaha Beach",title:"Över den öppna stranden",
  facts:["Invasionen sker på fem stränder med kodnamn: Utah och Omaha (USA), Gold och Sword (Storbritannien) och Juno (Kanada).",
         "Omaha blir den svåraste. Bombplanen som skulle slå ut försvaret fällde sina bomber för långt in i land på grund av moln, och många stridsvagnar sjönk innan de nådde stranden.",
         "Bara på Omaha räknar man med omkring 2 400 amerikanska förluster under dagen, alltså döda, sårade och saknade."],
  q:"Vilket land ansvarade för stranden Juno?",opts:["Frankrike","Kanada","USA"],ok:1,
  why:"Kanadensiska trupper landsteg på Juno. Franska soldater deltog också, men i mindre förband."},
 {x:2280,label:"Vallen",time:"08:00",place:"Strandvallen",title:"Skydd vid strandvallen",
  facts:["Du når en låg vall av stenar och taggtråd. Här söker soldaterna skydd medan de letar efter en väg uppför sluttningen.",
         "Tyskarna hade byggt Atlantvallen, en försvarslinje längs kusten från Norge ner till Spanien. Den bestod av bunkrar, kanoner, minfält och hinder.",
         "Fältmarskalk Erwin Rommel fick ansvar för att förstärka försvaret i Normandie. Under hans ledning lades miljontals minor ut längs kusten."],
  q:"Vad kallades Tysklands försvarslinje längs Europas västkust?",opts:["Maginotlinjen","Västfronten","Atlantvallen"],ok:2,
  why:"Maginotlinjen var Frankrikes försvarslinje mot Tyskland, byggd på 1930-talet."},
 {x:2780,label:"Bunkern",time:"09:30",place:"Krönet",title:"Bunkern på höjden",
  facts:["Från betongbunkrar på höjden skjuter tyska soldater med kulsprutor och kanoner ner mot stranden.",
         "Små grupper tar sig upp genom raviner och smala stigar och anfaller bunkrarna från sidan. Ingenjörssoldater spränger hinder och taggtråd.",
         "Väster om Omaha klättrade amerikanska rangers uppför den ungefär 30 meter höga klippan Pointe du Hoc med rep och stegar för att slå ut tyska kanoner."],
  q:"Hur hög var klippan vid Pointe du Hoc ungefär?",opts:["3 meter","30 meter","300 meter"],ok:1,
  why:"Ungefär som ett tiovåningshus. Rangers sköt upp rep med raketer och klättrade under beskjutning."},
 {x:3420,label:"Byn",time:"14:00",place:"Inåt land",title:"Byn bakom stränderna",
  facts:["Du möter fallskärmsjägare. Natten innan hoppade omkring 24 000 amerikanska, brittiska och kanadensiska soldater med fallskärm eller landade med glidflygplan bakom stränderna.",
         "De skulle ta broar och vägkorsningar så att tyska förstärkningar inte kunde nå kusten. Byn Sainte-Mère-Église blev en av de första som befriades.",
         "Tyskarna väntade sig huvudanfallet vid Calais, där Engelska kanalen är som smalast. De allierade lurade dem med en påhittad armé, falska radiomeddelanden och uppblåsbara stridsvagnar."],
  q:"Var trodde tyskarna att huvudanfallet skulle komma?",opts:["I Bretagne","Vid Calais","Vid Amsterdam"],ok:1,
  why:"Bluffen kallades Operation Fortitude. Den fick tyskarna att hålla kvar stora styrkor vid Calais i flera veckor."},
 {x:3990,label:"Målet",time:"21:00",place:"Brohuvudet",title:"Området är intaget",
  facts:["Vid kvällen har de allierade tagit sig i land på alla fem stränderna. Omkring 156 000 soldater kom i land under dagen, från havet och från luften.",
         "Priset var högt: omkring 10 000 allierade soldater dödades, sårades eller saknades. Även många tyska soldater och franska civila dog.",
         "Brohuvudet blev starten på befrielsen av Västeuropa. Paris befriades i augusti 1944, och Tyskland kapitulerade den 8 maj 1945."],
  discuss:"Diskutera: Varför kallas Dagen D ofta för en vändpunkt i andra världskriget?"}
];

/* ---------- terrain ---------- */
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=t=>t*t*(3-2*t);
function G(x){
  if(x<600) return 520;
  if(x<1450) return lerp(520,440,(x-600)/850);
  if(x<2050) return lerp(440,428,(x-1450)/600);
  if(x<2150) return lerp(428,385,smooth((x-2050)/100));
  if(x<2500) return lerp(385,290,smooth((x-2150)/350));
  return 290+6*Math.sin(x/140);
}
const SEA=440;
function soldierY(x){ return x<520 ? 420 : G(x); }

/* ---------- build the world ---------- */
const NS="http://www.w3.org/2000/svg";
const far=document.getElementById("far"), world=document.getElementById("world");
const plane=(x,y,k,delay,dur)=>`<g class="plane" style="animation-delay:${delay}s;animation-duration:${dur}s"><g transform="translate(${x} ${y}) scale(${-k} ${k}) translate(-48 0)">
  <path d="M0 0 Q4 -9 22 -10 L70 -9 Q86 -8 98 -3 L92 3 L22 5 Q4 5 0 0Z" fill="#5a6240"/>
  <path d="M72 -9 L86 -27 L94 -27 L90 -6Z" fill="#4a5136"/>
  <path d="M84 -4 L104 -8 L102 -2Z" fill="#4a5136"/>
  <path d="M26 -3 L66 -3 L58 5 L34 5Z" fill="#4a5136"/>
  <ellipse cx="46" cy="3" rx="28" ry="3" fill="#434a30"/>
  <rect x="30" y="-1" width="16" height="8" rx="3.5" fill="#3b4129"/>
  <g class="prop"><ellipse cx="28" cy="3" rx="1.8" ry="10" fill="#1f2118" opacity=".55"/></g>
  <rect x="55" y="-9.6" width="3" height="14" fill="#ece9de"/><rect x="58" y="-9.6" width="3" height="14" fill="#1f1f1c"/><rect x="61" y="-9.6" width="3" height="14" fill="#ece9de"/><rect x="64" y="-9.6" width="3" height="14" fill="#1f1f1c"/><rect x="67" y="-9.6" width="3" height="14" fill="#ece9de"/>
  <path d="M48 0 h18 M48 3 h18" stroke="#ece9de" stroke-width="2.5" opacity=".0"/>
  <g fill="#cfd8d6" opacity=".75"><rect x="12" y="-6" width="3" height="3" rx=".6"/><rect x="17" y="-6" width="3" height="3" rx=".6"/><rect x="22" y="-6" width="3" height="3" rx=".6"/><rect x="40" y="-6.5" width="3" height="3" rx=".6"/></g>
  <path d="M0 0 Q-6 -3 -2 -6" stroke="#2f321f" stroke-width="1" fill="none"/>
 </g></g>`;
const skyEl=document.getElementById("sky");
skyEl.innerHTML=plane(0,120,1.1,0,34)+plane(-70,142,.95,-1.2,34)+plane(-140,106,1,-2.3,34)+plane(-40,196,.7,-14,42)+plane(-100,184,.65,-15.2,42)+plane(0,90,.55,-24,50);
const ship=(x,k,fl)=>`<g transform="translate(${x} 362) scale(${k})"><g class="sway" style="animation-delay:${(x%7)/3}s" fill="#4a5459">
  <path d="M0 -2 L96 -2 L126 -9 L116 10 L6 10Z"/>
  <path d="M10 2 L112 2" stroke="#5f6c70" stroke-width="1.2"/>
  <rect x="42" y="-16" width="24" height="14" fill="#3f484c"/><rect x="48" y="-26" width="11" height="10" fill="#3a4246"/>
  <rect x="68" y="-25" width="8" height="23" fill="#434d51" transform="rotate(-4 72 -2)"/>
  <line x1="54" y1="-26" x2="54" y2="-54" stroke="#3a4246" stroke-width="1.6"/><line x1="46" y1="-44" x2="62" y2="-44" stroke="#3a4246" stroke-width="1.4"/>
  <rect x="86" y="-11" width="14" height="9" rx="2" fill="#3a4246"/><path d="M98 -8 L126 -14" stroke="#2f373b" stroke-width="3"/>
  <rect x="16" y="-11" width="14" height="9" rx="2" fill="#3a4246"/><path d="M28 -8 L54 -13" stroke="#2f373b" stroke-width="3"/>
  <polygon class="flash" style="animation-delay:${(x%5)*.9}s" points="126,-14 142,-20 136,-13 148,-11 130,-9" fill="#ffd27a"/>
 </g></g>`;
const destroyer=(x,k)=>`<g transform="translate(${x} 364) scale(${k})"><g class="sway" style="animation-delay:${(x%5)/2}s" fill="#505b60"><path d="M0 -1 L62 -1 L78 -6 L70 7 L4 7Z"/><rect x="24" y="-9" width="14" height="8" fill="#434d51"/><rect x="40" y="-14" width="5" height="13" fill="#434d51"/><line x1="30" y1="-9" x2="30" y2="-26" stroke="#3a4246" stroke-width="1.3"/><rect x="52" y="-7" width="8" height="6" rx="1.5" fill="#3a4246"/><path d="M58 -5 L74 -9" stroke="#2f373b" stroke-width="2"/></g></g>`;
function farSVG(){
  let s=`<rect x="-400" y="360" width="3200" height="400" fill="#5d6d6e"/>`;
  // distant coastline
  let p="M600 372";
  for(let x=600;x<=2800;x+=40){p+=` L${x} ${372-26*smooth(clamp((x-600)/300,0,1))-6*Math.sin(x/90)}`}
  s+=`<path d="${p} L2800 420 L600 420Z" fill="#6f766a"/>`;
  // fleet on the horizon
  s+=ship(-150,1.05)+destroyer(-20,.9)+ship(70,.85)+destroyer(170,.8)+ship(250,1.1)+destroyer(380,.75)+ship(450,.8);
  [[-40,0],[210,2.1],[420,3.4]].forEach(([x,dl])=>{ s+=`<g class="puff" style="animation-delay:${dl}s"><circle cx="${x+120}" cy="340" r="12" fill="#8d8c86"/><circle cx="${x+132}" cy="330" r="9" fill="#a3a29b"/></g>`; });
  // barrage balloons
  [[40,250],[260,230],[480,262]].forEach(([x,y])=>{
    s+=`<line x1="${x}" y1="${y+6}" x2="${x+8}" y2="360" stroke="#4a5459" stroke-width=".8"/><ellipse cx="${x}" cy="${y}" rx="13" ry="6" fill="#5b656a"/>`;
  });
  return s;
}
function worldSVG(){
  let s="";
  // sea body behind
  s+=`<rect x="-500" y="${SEA}" width="2100" height="600" fill="#4b5f60"/>`;
  // ground
  let d="M-500 900 L-500 "+G(-500);
  for(let x=-500;x<=4600;x+=20) d+=` L${x} ${G(x).toFixed(1)}`;
  d+=" L4600 900Z";
  s+=`<path d="${d}" fill="#b7a57a"/>`;
  let g="M2150 900";
  for(let x=2150;x<=4600;x+=20) g+=` L${x} ${(G(x)+(x<2500?6:0)).toFixed(1)}`;
  g+=" L4600 900Z";
  s+=`<path d="${g}" fill="#5f6a3c"/>`;
  // shingle bank + wire
  s+=`<path d="M2040 ${G(2040)} Q2100 ${G(2100)-14} 2160 ${G(2160)}" stroke="#7d7a70" stroke-width="10" fill="none" stroke-linecap="round"/>`;
  for(let x=2045;x<2165;x+=16) s+=`<circle cx="${x}" cy="${G(x)-16}" r="7" fill="none" stroke="#33302a" stroke-width="1.3"/>`;
  // craters on beach
  [1560,1840,1980].forEach(x=>s+=`<ellipse cx="${x}" cy="${G(x)+3}" rx="26" ry="5" fill="#8e7f5c"/>`);
  // hedgerows (bocage)
  for(let x=2520;x<4500;x+=95){ if(x>3220&&x<3700) continue;
    s+=`<ellipse cx="${x}" cy="${G(x)-12}" rx="${34+(x%3)*6}" ry="20" fill="#3f4a2b"/>`; }
  // bunker (betong, kanon som pekar mot stranden)
  const bx=2860, by=G(bx);
  s+=`<g>
     <path d="M${bx-76} ${by+4} L${bx-70} ${by-38} L${bx-42} ${by-54} L${bx+54} ${by-54} L${bx+70} ${by-36} L${bx+78} ${by+4}Z" fill="#8f8f87"/>
     <path d="M${bx-72} ${by-38} L${bx-42} ${by-58} L${bx+54} ${by-58} L${bx+72} ${by-36}Z" fill="#74746c"/>

far.innerHTML=farSVG();
world.innerHTML=worldSVG();
const sol=document.getElementById("sol");

/* ---------- camera ---------- */
let camX=STAGES[0].x, anim=null;
function centerX(){ return innerWidth>=860?330:400; }
function place(){
  const y=soldierY(camX), ty=350-y, cx=centerX();
  world.setAttribute("transform",`translate(${cx-camX} ${ty})`);
  far.setAttribute("transform",`translate(${cx-camX*.35} ${ty*.3})`);
  sol.setAttribute("transform",`translate(${camX} ${y})`);
}
function walkTo(x,done){
  const from=camX, dist=Math.abs(x-from);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur=reduce?1:clamp(dist*2.4,1400,3200), t0=performance.now();
  sol.classList.add("walking");
  cancelAnimationFrame(anim);
  const step=now=>{
    const t=clamp((now-t0)/dur,0,1), e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    camX=from+(x-from)*e; place();
    if(t<1) anim=requestAnimationFrame(step); else { sol.classList.remove("walking"); done&&done(); }
  };
  anim=requestAnimationFrame(step);
}
addEventListener("resize",place);

/* ---------- game state ---------- */
let cur=-1, moving=false;
const done=STAGES.map(()=>false), firstTry=STAGES.map(()=>null);
const dock=document.getElementById("dock"), stepsEl=document.getElementById("steps"), clock=document.getElementById("clock");
const QUIZ=STAGES.length-1;
const SAVE_KEY="pluggis-sim-dagend-v1";
function saveSim(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({cur,done,firstTry}));}catch(e){}}
function loadSim(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
  if(!d||!(d.cur>=0)||d.cur>=QUIZ||!Array.isArray(d.done)||d.done.length!==STAGES.length) return null; return d;}catch(e){return null;}}
function clearSim(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}

function drawSteps(){
  stepsEl.innerHTML=STAGES.map((s,i)=>`<span class="dot ${done[i]?"done":""} ${i===cur?"now":""}" title="${s.label}">${i+1}</span>`).join("");
  STAGES.forEach((s,i)=>document.getElementById("m"+i).classList.toggle("done",done[i]));
}
function intro(){
  dock.innerHTML=`<article class="card">
    <div class="stamp"><span>Order · Första vågen</span><b>Hemligt</b></div>
    <h2>Dagen D, 6 juni 1944</h2>
    <p>Du är soldat i den första vågen som ska landstiga i Normandie. Ta dig från båten, över stranden och upp till byn bakom kusten.</p>
    <p>Vid varje röd cirkel får du läsa en fältrapport och svara på en fråga. Cirkeln blir grön när du svarat rätt, och då kan du gå vidare.</p>
    <div class="foot"><span>7 steg · ca 10 minuter</span><button class="go ready" id="start">Starta uppdraget →</button></div>
  </article>`;
  const sv=loadSim();
  if(sv){
    const r=document.createElement("p"); r.innerHTML=`<button class="go ready" type="button" id="resume">Fortsätt där du var (steg ${sv.cur+1}) →</button>`;
    dock.querySelector(".foot").before(r);
    document.getElementById("resume").onclick=()=>{sv.done.forEach((v,i)=>{done[i]=!!v;});(sv.firstTry||[]).forEach((v,i)=>{firstTry[i]=v;});camX=STAGES[sv.cur].x;place();arrive(sv.cur);};
    document.getElementById("start").textContent="Börja om →";
  }
  document.getElementById("start").onclick=()=>{clearSim();arrive(0);};
}
function arrive(i){
  cur=i; saveSim();
  const st=STAGES[i];
  clock.innerHTML=`<small>6 juni 1944 · ${st.place}</small>Kl. ${st.time}`;
  drawSteps(); render();
}
function render(){
  const i=cur, st=STAGES[i];
  if(i===QUIZ){ done[i]=true; clearSim(); drawSteps(); }
  let quiz="";
  if(i<QUIZ){
    const solved=done[i];
    quiz=`<div class="quiz"><p class="q">${st.q}</p><div class="opts">${st.opts.map((o,k)=>`<button class="opt ${solved&&k===st.ok?"right":""}" data-k="${k}" ${solved?"disabled":""}>${o}</button>`).join("")}</div>
      <p class="fb ${solved?"ok":""}" id="fb">${solved?`<b>Rätt!</b> ${st.why}`:""}</p></div>`;
  } else {
    const score=firstTry.slice(0,QUIZ).filter(Boolean).length;
    quiz=`<p class="discuss">${st.discuss}</p>
      <div class="foot"><span class="score">${score} av ${QUIZ} rätt på första försöket</span><button class="go" id="again">Spela igen</button></div>`;
  }
  const next=i<QUIZ?`<div class="foot"><span>Steg ${i+1} av ${STAGES.length}</span><button class="go ${done[i]?"ready":""}" id="next" ${done[i]?"":"disabled"}>Gå vidare →</button></div>`:"";
  dock.innerHTML=`<article class="card">
    <div class="stamp"><span>Kl. ${st.time} · ${st.place}</span><b>Fältrapport ${i+1}</b></div>
    <h2>${st.title}</h2>${st.facts.map(f=>`<p>${f}</p>`).join("")}${quiz}${next}</article>`;
  dock.scrollTop=0;
  dock.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k,b));
  const n=document.getElementById("next"); if(n) n.onclick=goNext;
  const a=document.getElementById("again"); if(a) a.onclick=restart;
}
function answer(k,btn){
  const st=STAGES[cur], fb=document.getElementById("fb");
  if(firstTry[cur]===null) firstTry[cur]=(k===st.ok);
  if(k===st.ok){
    done[cur]=true; saveSim(); drawSteps();
    dock.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    btn.classList.add("right");
    fb.className="fb ok"; fb.innerHTML=`<b>Rätt!</b> ${st.why}`;
    const n=document.getElementById("next"); n.disabled=false; n.classList.add("ready"); n.focus({preventScroll:true});
  } else {
    btn.classList.add("wrong"); btn.disabled=true;
    fb.className="fb no"; fb.innerHTML=`<b>Inte riktigt.</b> Läs rapporten igen och försök på nytt.`;
  }
}
function goNext(){
  if(moving||cur>=QUIZ||!done[cur]) return;
  moving=true;
  dock.innerHTML=`<article class="card"><div class="stamp"><span>På väg…</span><b>${STAGES[cur+1].label}</b></div><h2>Framåt!</h2><p>Du tar dig vidare mot nästa mål.</p></article>`;
  const target=cur+1;
  walkTo(STAGES[target].x,()=>{moving=false;arrive(target);});
}
function restart(){
  done.fill(false); firstTry.fill(null); cur=-1; moving=true;
  walkTo(STAGES[0].x,()=>{moving=false;drawSteps();intro();});
}
document.querySelectorAll(".marker").forEach(m=>{
  const open=()=>{ if(+m.dataset.i===cur){ dock.scrollTop=0; dock.querySelector(".card")?.animate([{transform:"scale(.98)"},{transform:"none"}],{duration:250}); } };
  m.addEventListener("click",open); m.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}});
});
addEventListener("keydown",e=>{ if(e.key==="ArrowRight") goNext(); });

place(); drawSteps(); intro();
</script>
