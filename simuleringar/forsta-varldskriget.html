<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Första världskriget på kartan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Layout: an operations map the camera flies across in date order; field-report card docked below (phone) or right (desktop). Single dark map-room look by choice. */
:root{
  --night:#1a1f23; --sea:#2c3f4a; --sea-line:#3b525e; --land:#cbbf9c; --land-line:#8f8466;
  --paper:#ece5d2; --paper-ink:#2a2822; --muted:#6c675a; --khaki:#7a7848;
  --signal:#c8452f; --clear:#5f9a4c; --brass:#d1a84c;
  --f-display:"Special Elite","Courier New",monospace;
  --f-body:"Barlow",system-ui,sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.5}
.app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.map{position:relative;flex:1 1 52%;min-height:240px;background:var(--sea)}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.country{fill:var(--land);stroke:var(--land-line);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .8s}
.country.hl{fill:#d89a7c}
.country.swe{fill:url(#neutral)}
.grat{fill:none;stroke:var(--sea-line);stroke-width:.7;vector-effect:non-scaling-stroke}
.route{fill:none;stroke:var(--brass);stroke-width:2.2;stroke-dasharray:7 6;vector-effect:non-scaling-stroke}
.mk{cursor:default}
.mk .ring{fill:rgba(42,40,34,.55);stroke:#9b927a;stroke-width:2.5}
.mk text{font-family:var(--f-label);font-weight:600;font-size:15px;fill:var(--paper)}
.mk.now .ring{fill:var(--signal);stroke:#f4dcd4}
.mk.done{cursor:pointer}
.mk.done .ring{fill:var(--clear);stroke:#e8f0de}
.mk .pulse{fill:none;stroke:var(--signal);stroke-width:3;opacity:0}
.mk.now .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.4);opacity:0}}
.mk.open .ring{fill:#8a3523;stroke:#f4dcd4}
.mk.sub .ring{stroke-width:2}
.modes{display:grid;gap:10px;margin-top:6px}
.mode{font:inherit;text-align:left;padding:12px 14px;border-radius:3px;border:1.5px solid #b7ae95;background:#f6f1e3;color:var(--paper-ink);cursor:pointer;display:grid;gap:2px}
.mode b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.mode span{font-size:.92rem;color:var(--muted)}
.mode:hover{border-color:var(--signal)}
.mode:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
@media (min-width:520px){.modes{grid-template-columns:1fr 1fr}}
.place{font-family:var(--f-label);font-size:14px;fill:#2a2822;paint-order:stroke;stroke:var(--land);stroke-width:3px;letter-spacing:.04em}
.hud{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:2}
.box{background:rgba(26,31,35,.82);padding:6px 10px;border-radius:3px}
.clock{font-family:var(--f-display);font-size:1.05rem;line-height:1.2}
.clock small{display:block;font-family:var(--f-label);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#c9c3b2}
.legend{font-family:var(--f-label);font-size:.8rem;display:flex;flex-direction:column;gap:3px;color:#d8d2c0}
.legend i{display:inline-block;width:12px;height:10px;margin-right:6px;vertical-align:-1px;border:1px solid #8f8466}
.timeline{position:absolute;left:16px;right:16px;bottom:12px;z-index:2;pointer-events:none}
.tl-track{position:relative;height:30px;background:rgba(26,31,35,.82);border-radius:3px}
.tl-bar{position:absolute;left:14px;right:14px;top:9px;height:3px;background:#56615f}
.tl-fill{position:absolute;left:0;top:0;height:100%;background:var(--brass);transition:width 1.6s ease}
.tl-year{position:absolute;top:13px;transform:translateX(-50%);font-family:var(--f-label);font-size:.72rem;color:#c9c3b2;font-variant-numeric:tabular-nums}
.tl-tick{position:absolute;top:-3px;width:1px;height:9px;background:#8a928f}
.dock{flex:0 1 auto;max-height:52%;overflow:auto;padding:14px 16px 18px;background:var(--night)}
.card{background:var(--paper);color:var(--paper-ink);border-radius:3px;padding:18px 18px 16px;box-shadow:0 6px 24px rgba(0,0,0,.35);border-top:6px double var(--khaki);max-width:62ch;margin-inline:auto;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.stamp{font-family:var(--f-label);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.stamp b{color:var(--signal);font-weight:600}
.card h2{font-family:var(--f-display);font-weight:400;font-size:1.5rem;line-height:1.15;margin:.35em 0 .5em;text-wrap:balance}
.card p{margin:0 0 .7em}
.card a{color:#8a3523;font-weight:600}
.quiz{margin-top:14px;padding-top:12px;border-top:1px dashed #b7ae95}
.quiz .q{font-weight:600}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{font:inherit;text-align:left;padding:10px 12px;border-radius:3px;border:1.5px solid #b7ae95;background:#f6f1e3;color:var(--paper-ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--paper-ink)}
.opt:focus-visible,.go:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.opt.wrong{border-color:var(--signal);background:#f3d9d2;text-decoration:line-through}
.opt.right{border-color:var(--clear);background:#dcebd2;font-weight:600}
.fb{margin-top:10px;font-size:.95rem}
.fb.ok b{color:#3f7a30}.fb.no b{color:var(--signal)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.foot span{font-family:var(--f-label);font-size:.85rem;color:var(--muted);letter-spacing:.05em}
.go{font-family:var(--f-label);font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;border-radius:3px;border:0;background:var(--paper-ink);color:var(--paper);cursor:pointer}
.go:disabled{opacity:.35;cursor:not-allowed}
.go.ready{background:var(--signal);animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
.discuss{background:#e1d8be;padding:10px 12px;border-radius:3px;font-style:italic}
.score{font-family:var(--f-display);font-size:1.15rem}
.note{font-size:.85rem;color:var(--muted)}
.stage{position:absolute;inset:0;z-index:1;opacity:0;transition:opacity .9s ease;background:#1a1f23}
.stage.in{opacity:1}
.stage.peek{opacity:0;pointer-events:none}
.stage-art{position:absolute;inset:0;overflow:hidden}
.stage-art svg{width:100%;height:100%;display:block}
.stage.in .stage-art{animation:dive 1.6s cubic-bezier(.2,.8,.2,1)}
@keyframes dive{from{transform:scale(1.35);filter:blur(4px)}to{transform:none;filter:none}}
.stage-cap{display:none;position:absolute;left:16px;bottom:56px;z-index:2;font-family:var(--f-display);font-size:1.25rem;color:#f4efe2;text-shadow:0 2px 8px rgba(0,0,0,.6);max-width:70%}
.stage-cap small{display:block;font-family:var(--f-label);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#e2dccb}
.mapbtn{position:absolute;right:16px;bottom:56px;z-index:4;font-family:var(--f-label);font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:3px;border:0;background:rgba(26,31,35,.85);color:var(--paper);cursor:pointer;pointer-events:auto}
.stage.peek .mapbtn{opacity:1}
.map.scene-on .legend{display:none}
.pan{animation:pan 34s ease-in-out infinite alternate}
.pan.far{--d:-140px}.pan.sky{--d:-300px}.pan.mid{--d:-520px}.pan.near{--d:-620px}
@keyframes pan{from{transform:translateX(0)}to{transform:translateX(var(--d))}}
.fly{animation:fly 14s linear infinite}
@keyframes fly{to{transform:translateX(2000px)}}
.dive{animation:divebomb 5s ease-in infinite}
@keyframes divebomb{0%{transform:translate(-120px,-80px);opacity:0}10%{opacity:1}80%{transform:translate(90px,170px);opacity:1}100%{transform:translate(110px,200px);opacity:0}}
.bob{animation:bob 3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(4px)}}
.walk{animation:walk 9s linear infinite alternate}
@keyframes walk{to{transform:translateX(60px)}}
.drive{animation:drive 12s linear infinite}
@keyframes drive{from{transform:translateX(-80px)}to{transform:translateX(220px)}}
.smoke{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(26px,-14px)}}
.glow{animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.15}}
.flicker{transform-box:fill-box;transform-origin:center bottom;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{to{transform:scaleY(.82) scaleX(1.08)}}
.flash{opacity:0;animation:flash 3.2s ease-out infinite}
@keyframes flash{0%{opacity:0}4%{opacity:1}16%{opacity:0}100%{opacity:0}}
.puff{opacity:0;transform-box:fill-box;transform-origin:center;animation:puff 4s ease-out infinite}
@keyframes puff{0%{opacity:0;transform:scale(.3)}10%{opacity:.8}70%{opacity:0;transform:scale(1.8)}100%{opacity:0}}
.beam{animation:beam 7s ease-in-out infinite alternate}
@keyframes beam{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.para{animation:para 12s linear infinite}
@keyframes para{from{transform:translate(0,-60px)}to{transform:translate(40px,360px)}}
.fall{animation:fall 7s linear infinite}
@keyframes fall{to{transform:translate(30px,530px)}}
.rise{animation:rise 6s linear infinite;opacity:.8}
@keyframes rise{to{transform:translate(-40px,-540px);opacity:0}}
.twinkle{animation:tw 2.2s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.wobble{animation:wob 2.6s ease-in-out infinite alternate}
@keyframes wob{to{transform:scale(1.03,.97)}}
.sway{animation:sway 4s ease-in-out infinite alternate;transform-box:view-box}
@keyframes sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
.blink{animation:tw .9s steps(2) infinite}
.flap{transform-box:fill-box;transform-origin:left center;animation:flap 1.6s ease-in-out infinite alternate}
@keyframes flap{to{transform:skewY(-4deg) scaleX(.94)}}
.wave{animation:wave 5s linear infinite}
@keyframes wave{to{transform:translateX(-40px)}}
@media (min-width:860px){
  .dock{position:absolute;right:20px;top:20px;bottom:20px;width:400px;max-height:none;background:none;padding:0;z-index:3}
  .hud{right:440px}.timeline{right:440px}
  .map{flex:1 1 auto}
}
@media (max-width:520px){.legend{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <div class="map" id="map">
    <svg id="svg" preserveAspectRatio="xMidYMid meet" aria-label="Världskarta med händelser under första världskriget">
      <defs>
        <pattern id="neutral" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="6" height="6" fill="#cbbf9c"/><rect width="2.4" height="6" fill="#5d84a6"/>
        </pattern>
      </defs>
      <g id="grat"></g><g id="land"></g><path id="route" class="route"></path><g id="labels"></g><g id="marks"></g><g id="subs"></g>
    </svg>
    <div class="stage" id="stage" hidden><div class="stage-art" id="stageArt"></div><div class="stage-cap" id="stageCap"></div><button class="mapbtn" id="mapBtn">Visa kartan</button></div>
    <div class="hud">
      <div class="box clock" id="clock"><small>Första världskriget</small>1914–1918</div>
      <div class="box legend"><span><i style="background:#d89a7c"></i>Berörda länder</span><span><i style="background:repeating-linear-gradient(45deg,#cbbf9c 0 3px,#5d84a6 3px 5px)"></i>Sverige (neutralt)</span><span style="color:#a9a492">Kartan visar dagens gränser</span></div>
    </div>
    <div class="timeline"><div class="tl-track" id="tl"><div class="tl-bar"><div class="tl-fill" id="tlfill" style="width:0"></div></div></div></div>
  </div>
  <div class="dock" id="dock" aria-live="polite"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.min.js"></script>
<script>
const DDAY_URL="";
const EV=[
 {d:"28 juni 1914",y:1914.49,place:"Sarajevo",lon:18.41,lat:43.86,zoom:300,hl:["BIH","SRB","AUT","HUN"],title:"Skotten i Sarajevo",
  facts:["Den 28 juni 1914 skjuts Franz Ferdinand, tronföljare i Österrike-Ungern, och hans fru Sophie i Sarajevo. Mördaren är den 19-årige bosnienserben Gavrilo Princip.",
   "Österrike-Ungern ger Serbien skulden och förklarar krig en månad senare. Eftersom Europas stormakter har lovat att hjälpa varandra dras snart nästan hela Europa in i kriget."],
  q:"Varför spred sig kriget så snabbt till hela Europa?",opts:["Länderna hade allianser och lovat att hjälpa varandra","Alla länder hade samma kung","Kriget började på flera platser samtidigt"],ok:0,
  why:"Allianserna var tänkta att avskräcka från krig, men de gjorde att en lokal konflikt blev ett storkrig."},
 {d:"Augusti–september 1914",y:1914.62,place:"Marne",lon:3.4,lat:48.95,zoom:240,hl:["BEL","FRA","DEU"],title:"Anfallet mot Frankrike",
  facts:["Tysklands plan, Schlieffenplanen, är att snabbt besegra Frankrike genom att gå genom det neutrala Belgien. Därför förklarar Storbritannien krig mot Tyskland den 4 augusti.",
   "I september stoppas tyskarna vid floden Marne, inte långt från Paris. Båda sidor gräver ner sig, och det snabba kriget blir ett långt ställningskrig."],
  q:"Varför gick Storbritannien med i kriget?",opts:["Tyskland anföll London","Tyskland gick in i det neutrala Belgien","Storbritannien ville ta Frankrikes kolonier"],ok:1,
  why:"Storbritannien hade lovat att skydda Belgiens neutralitet."},
 {d:"26–30 augusti 1914",y:1914.66,place:"Tannenberg",lon:20.1,lat:53.5,zoom:260,hl:["RUS","POL","DEU"],title:"Östfronten",
  facts:["Ryssland mobiliserar snabbare än Tyskland räknat med och anfaller Ostpreussen i öster.",
   "Vid Tannenberg omringas en rysk armé. Omkring 90 000 ryska soldater tas till fånga. På östfronten blir kriget mer rörligt än i väst, men förlusterna blir enorma."],
  q:"Vad hände vid Tannenberg?",opts:["Ryssland erövrade Berlin","En rysk armé omringades och besegrades","Tyskland och Ryssland slöt fred"],ok:1,
  why:"Tannenberg var en stor tysk seger tidigt i kriget."},
 {d:"December 1914",y:1914.97,place:"Ypres",lon:2.88,lat:50.85,zoom:230,hl:["BEL","FRA","GBR"],title:"Skyttegravarna",
  facts:["Västfronten blir en linje av skyttegravar från Nordsjön ner till Schweiz, omkring 70 mil lång. Mellan fiendernas skyttegravar ligger ingenmansland.",
   "Soldaterna lever i lera, kyla och bland råttor och löss. Att anfalla över ingenmansland mot kulsprutor och taggtråd kostar tusentals liv för några hundra meter."],
  q:"Vad kallades området mellan fiendernas skyttegravar?",opts:["Ingenmansland","Fronten","Bakre linjen"],ok:0,
  why:"Den som tog sig upp ur skyttegraven hamnade direkt under eld där."},
 {d:"25 april 1915",y:1915.31,place:"Gallipoli",lon:26.3,lat:40.2,zoom:260,hl:["TUR","AUS","NZL","GBR"],title:"Gallipoli",
  facts:["Osmanska riket, dagens Turkiet, är på Tysklands sida. Britter och fransmän försöker ta sundet Dardanellerna för att kunna nå Ryssland till sjöss.",
   "Soldater från bland annat Australien och Nya Zeeland landstiger på halvön Gallipoli. Efter åtta månader och omkring en halv miljon förluster på båda sidor ger de allierade upp."],
  q:"Varför ville de allierade ta Dardanellerna?",opts:["För att få en sjöväg till Ryssland","För att hitta olja","För att anfalla Egypten"],ok:0,
  why:"Ryssland behövde vapen, och vägen genom Östersjön var stängd av Tyskland."},
 {d:"7 maj 1915",y:1915.35,place:"Lusitania",lon:-8.5,lat:51.4,zoom:260,hl:["GBR","IRL","DEU"],title:"Kriget till sjöss",
  facts:["Storbritannien blockerar Tyskland så att varor inte kan komma in. Tyskland svarar med ubåtar som sänker fartyg på väg till Storbritannien.",
   "Den 7 maj 1915 sänks passagerarfartyget Lusitania av en tysk ubåt utanför Irland. Omkring 1 200 människor dör, bland dem 128 amerikaner."],
  q:"Vilket vapen använde Tyskland mot fartygen till Storbritannien?",opts:["Zeppelinare","Ubåtar","Stridsvagnar"],ok:1,
  why:"Ubåtskriget gjorde USA allt mer fientligt mot Tyskland."},
 {d:"Februari–december 1916",y:1916.14,place:"Verdun",lon:5.39,lat:49.16,zoom:220,hl:["FRA","DEU"],title:"Verdun",
  facts:["I februari 1916 anfaller Tyskland fästningsstaden Verdun. Målet är att få Frankrike att förblöda, alltså förlora så många soldater att landet ger upp.",
   "Slaget pågår i nästan ett år. Omkring 700 000 soldater dödas, såras eller försvinner, och fronten flyttas nästan ingenting."],
  q:"Vad var Tysklands mål med anfallet mot Verdun?",opts:["Att ta Paris samma vecka","Att få Frankrike att förlora så många soldater att det gav upp","Att nå havet"],ok:1,
  why:"Planen misslyckades. Även Tyskland förlorade enormt många soldater."},
 {d:"1 juli 1916",y:1916.5,place:"Somme",lon:2.69,lat:50.01,zoom:220,hl:["FRA","GBR","DEU"],title:"Slaget vid Somme",
  facts:["Britter och fransmän anfaller vid floden Somme för att avlasta Verdun. Första dagen förlorar britterna omkring 57 000 man, varav omkring 19 000 döda.",
   "Under slaget används stridsvagnar för första gången. När slaget slutar i november har över en miljon soldater dödats eller sårats, och de allierade har bara tagit omkring en mil."],
  q:"Vilket nytt vapen användes för första gången vid Somme?",opts:["Kulsprutan","Stridsvagnen","Atombomben"],ok:1,
  why:"De första stridsvagnarna var långsamma och gick ofta sönder, men de pekade mot framtidens krig."},
 {d:"6 april 1917",y:1917.26,place:"Washington",lon:-77.04,lat:38.9,zoom:420,hl:["USA","MEX"],title:"USA går med i kriget",
  facts:["I februari 1917 börjar Tyskland sänka alla fartyg runt Storbritannien, även från neutrala länder. Samtidigt avslöjas att Tyskland försökt få Mexiko att anfalla USA.",
   "Den 6 april 1917 förklarar USA krig mot Tyskland. Ett år senare finns över en miljon amerikanska soldater i Frankrike."],
  q:"Vilka två saker fick USA att gå med i kriget?",opts:["Ubåtskriget och Tysklands försök att få med Mexiko","Ryska revolutionen och spanska sjukan","Skotten i Sarajevo och Verdun"],ok:0,
  why:"Tysklands meddelande till Mexiko kallas Zimmermanntelegrammet."},
 {d:"Våren 1917",y:1917.3,place:"Stockholm",lon:18.07,lat:59.33,zoom:260,hl:["NOR","DNK"],title:"Sverige i kriget",
  facts:["Sverige håller sig neutralt under hela kriget, liksom Norge och Danmark. Men kriget påverkar ändå Sverige.",
   "Blockaderna och en dålig skörd gör att maten tar slut. Bröd, socker och mjölk ransoneras, och våren 1917 blir det hungerkravaller i flera städer."],
  q:"Varför blev det brist på mat i Sverige?",opts:["Sverige var med i kriget","Blockader och dålig skörd","Bönderna strejkade"],ok:1,
  why:"Sverige var beroende av import, och blockaderna stoppade mycket av den."},
 {d:"7 november 1917",y:1917.85,place:"Petrograd",lon:30.32,lat:59.94,zoom:300,hl:["RUS","FIN"],title:"Ryska revolutionen",
  facts:["Ryssland har förlorat miljontals soldater och folket svälter. I mars 1917 tvingas tsaren att avgå.",
   "I november tar bolsjevikerna under Lenin makten. I mars 1918 sluter Ryssland fred med Tyskland och lämnar kriget. Samma vinter förklarar sig Finland självständigt."],
  q:"Vem ledde bolsjevikerna när de tog makten?",opts:["Tsar Nikolaj II","Lenin","Stalin"],ok:1,
  why:"Stalin tog över makten först efter Lenins död 1924."},
 {d:"11 november 1918",y:1918.86,place:"Compiègne",lon:2.83,lat:49.43,zoom:230,hl:["FRA","DEU"],title:"Vapenstilleståndet",
  facts:["Under hösten 1918 trycks Tyskland tillbaka av de allierade, nu med hjälp av amerikanska trupper. I Tyskland gör soldater och arbetare uppror och kejsaren flyr.",
   "Den 11 november 1918 klockan 11 tystnar vapnen. Vapenstilleståndet skrivs under i en järnvägsvagn i skogen vid Compiègne."],
  q:"Vilken tid upphörde striderna?",opts:["Kl. 11 den 11 november 1918","Kl. 12 på nyårsafton 1918","Kl. 6 den 6 juni 1918"],ok:0,

const DEEP=[
 [ D("Wien",16.37,48.21,"1914","Två block",
    ["Före kriget har Europas stormakter delat upp sig i två block. Trippelententen består av Frankrike, Ryssland och Storbritannien. Centralmakterna är Tyskland och Österrike-Ungern.","Länderna kappas om kolonier och bygger upp stora arméer och flottor. Många väntar på ett krig."],
    "Vilka länder ingick i Trippelententen?",["Tyskland, Österrike-Ungern och Italien","Frankrike, Ryssland och Storbritannien","Sverige, Norge och Danmark"],1,"Italien hörde först till Tysklands sida men gick 1915 med i kriget på ententens sida.",300),
   D("Sarajevo",18.41,43.86,"28 juni 1914","Skotten vid Latinska bron",
    ["Ärkehertigen Franz Ferdinand åker i öppen bil genom Sarajevo. Ett första attentat med en bomb misslyckas.","Senare svänger chauffören fel och stannar, precis där Gavrilo Princip står. Princip skjuter både Franz Ferdinand och hans fru Sophie. Han tillhör en grupp som vill att Bosnien ska höra till Serbien."],

   D("Belgrad",20.46,44.82,"23 juli–4 augusti 1914","Julikrisen",
    ["Österrike-Ungern ställer hårda krav på Serbien, ett ultimatum. Serbien går med på nästan allt, men den 28 juli förklarar Österrike-Ungern ändå krig.","Ryssland stödjer Serbien och mobiliserar. Då förklarar Tyskland krig mot Ryssland och Frankrike. Inom en vecka är stormakterna i krig."],
    "Vilket land stödde Serbien?",["Ryssland","Tyskland","Italien"],0,"Ryssland och Serbien var båda slaviska och ortodoxa länder och hade länge varit allierade.",260),
   D("Berlin",13.4,52.52,"Augusti 1914","Hem till jul",
    ["När kriget börjar jublar folkmassor i Berlin, Paris och London. Unga män anmäler sig frivilligt.","Många tror att kriget ska vara över till jul. I stället pågår det i över fyra år."],
    "Hur länge trodde många att kriget skulle pågå?",["Till jul 1914","I tio år","Tills alla länder var med"],0,"Ingen förstod hur förödande ett modernt krig med kulsprutor och artilleri skulle bli.",260) ],
 [ D("Berlin",13.4,52.52,"Augusti 1914","Schlieffenplanen",
    ["Tyskland är rädd för att behöva strida mot Frankrike i väst och Ryssland i öst samtidigt.","Planen är att besegra Frankrike på sex veckor genom att gå runt de franska försvaren genom Belgien. Sedan ska trupperna skickas med tåg mot Ryssland."],

   D("Liège",5.57,50.63,"5–16 augusti 1914","Belgien gör motstånd",
    ["Belgiens armé försvarar fästningarna runt Liège. Tyskarna tar fram jättelika kanoner som skjuter sönder forten.","Tyska soldater dödar tusentals belgiska civila. I staden Leuven bränns universitetsbiblioteket med hundratusentals böcker."],
    "Hur tog sig tyskarna förbi forten vid Liège?",["Med jättelika kanoner","De flög över dem","Forten gav upp utan strid"],0,"Belgiens motstånd försenade tyskarna några dagar, vilket gav Frankrike och Storbritannien tid."),
   D("Marne",3.4,48.95,"5–12 september 1914","Miraklet vid Marne",
    ["Tyskarna är bara några mil från Paris. Fransmän och britter gör motanfall vid floden Marne.","Paris taxibilar används för att köra soldater till fronten. Tyskarna tvingas backa, och båda sidor börjar gräva skyttegravar."],
    "Vad användes för att köra franska soldater till Marne?",["Paris taxibilar","Flygplan","Cyklar"],0,"Det var inte så många soldater, men taxibilarna blev en symbol för hela Frankrikes kamp.") ],
 [ D("Sankt Petersburg",30.32,59.94,"Augusti 1914","Den ryska ångvälten",
    ["Ryssland har världens största armé och kallas den ryska ångvälten. Men soldaterna saknar ofta gevär, skor och ammunition.","Huvudstaden Sankt Petersburg får ett nytt namn, Petrograd, eftersom det gamla namnet låter för tyskt."],
    "Vad var Rysslands stora svaghet?",["För få soldater","Dålig utrustning","För lite mark"],1,"Många ryska soldater skickades till fronten utan eget gevär.",300),
   D("Tannenberg",20.1,53.5,"26–30 augusti 1914","Omringade i skogen",
    ["Ryska befäl skickar order via radio utan att koda dem. Tyskarna lyssnar och vet exakt var de ryska trupperna ska gå.","Den ryska armén omringas bland skogar och sjöar. Omkring 90 000 ryska soldater tas till fånga."],
    "Hur visste tyskarna var ryssarna skulle gå?",["Ryssarna skickade okodade radiomeddelanden","De hade satelliter","En rysk general bytte sida"],0,"Det var ett av de första slagen där radio spelade stor roll."),
   D("Lemberg",24.03,49.84,"September 1914","Galicien",
    ["Längre söderut anfaller Ryssland Österrike-Ungern i Galicien, i dagens Polen och Ukraina. Där vinner ryssarna och tar staden Lemberg, i dag Lviv.","På östfronten används fortfarande kavalleri, alltså soldater till häst, eftersom fronten är så lång och rörlig."],
    "Vad är kavalleri?",["Soldater till häst","Soldater i ubåtar","Soldater med kanoner"],0,"På västfronten blev kavalleriet nästan meningslöst mot kulsprutor och taggtråd.",300) ],
 [ D("Arras",2.78,50.29,"Vintern 1914–1915","Livet i skyttegraven",
    ["Skyttegravarna är djupa diken förstärkta med sandsäckar och skyddade av taggtråd. Bakom frontlinjen finns fler linjer av skyttegravar.","Det regnar ofta och gravarna fylls med lera. Många soldater får skyttegravsfot, en svår infektion av att ha blöta fötter i veckor."],
    "Vad var skyttegravsfot?",["En sorts känga","En infektion av blöta fötter","En dans"],1,"Soldaterna fick order om att byta strumpor varje dag för att undvika det."),
   D("Ypres",2.88,50.85,"Julafton 1914","Julfreden",
    ["På julafton 1914 slutar soldaterna skjuta på flera ställen längs fronten. Tyska soldater sjunger julsånger och tänder ljus.","På juldagen möts fiender i ingenmansland. De byter tobak och choklad, begraver sina döda och enligt vissa berättelser spelar de fotboll."],
    "Vad hände under julfreden 1914?",["Kriget tog slut","Fiender möttes i ingenmansland och bytte gåvor","Alla soldater fick åka hem"],1,"Befälen gillade det inte, och julen därpå förbjöds det."),
   D("Ypres",2.88,50.85,"22 april 1915","Giftgas",
    ["Vid Ypres släpper tyskarna ut klorgas som driver med vinden in i de allierades skyttegravar. Soldaterna har inget skydd.","Snart använder båda sidor giftgas, och alla soldater får gasmasker. Senare används också senapsgas, som ger svåra brännskador."],
    "Vad blev följden av gasanfallen?",["Alla soldater fick gasmasker","Kriget tog slut","Gas förbjöds direkt"],0,"Efter kriget förbjöds giftgas i krig genom ett internationellt avtal 1925."),
   D("Flandern",3.0,50.9,"Våren 1915","Vallmon",

    "Vad symboliserar den röda vallmon?",["De stupade soldaterna","Freden i Versailles","Sommarlovet"],0,"Vallmofrön kan ligga i jorden länge och gror när marken grävs upp, som på slagfälten.") ],
 [ D("Dardanellerna",26.4,40.1,"18 mars 1915","Försöket till sjöss",
    ["Brittiska och franska slagskepp försöker skjuta sig igenom sundet Dardanellerna.","Men osmanerna har lagt ut minor. Tre slagskepp sjunker och flera skadas. Då bestämmer sig de allierade för att landstiga på halvön Gallipoli."],
    "Vad stoppade de allierade fartygen i Dardanellerna?",["Minor","Is","En storm"],0,"Minorna hade lagts ut i hemlighet natten före anfallet."),

   D("Östra Anatolien",39.2,38.7,"1915–1917","Folkmordet på armenierna",

 [ D("Nordsjön",3.0,56.0,"1914–1918","Blockaden",

   D("Irland",-8.5,51.4,"7 maj 1915","Lusitania",

    "Vem kontrollerade haven efter Skagerrakslaget?",["Storbritannien","Tyskland","Danmark"],0,"Därför satsade Tyskland i stället ännu mer på ubåtar.") ],
 [ D("Verdun",5.39,49.16,"21 februari 1916","Anfallet",

   D("Fort Douaumont",5.44,49.22,"25 februari 1916","Fortet faller",
    ["Det största fortet vid Verdun, Douaumont, tas av en liten tysk grupp nästan utan strid. Fransmännen hade flyttat bort de flesta soldaterna.","Först i oktober 1916 tar fransmännen tillbaka fortet."],

   D("Bar-le-Duc",5.16,48.77,"1916","Den heliga vägen",
    ["Bara en väg går till Verdun. Lastbilar kör längs den dygnet runt med soldater, mat och ammunition, ungefär en var fjortonde sekund.","Vägen kallas Den heliga vägen. Nästan hela den franska armén roterar genom Verdun."],
    "Vad kallades vägen till Verdun?",["Den heliga vägen","Kungsvägen","Lervägen"],0,"Arbetare lade hela tiden ut grus på vägen för att den inte skulle gå sönder."),
   D("Verdun",5.39,49.2,"December 1916","Byarna som dog",

 [ D("Somme",2.69,50.01,"24 juni–1 juli 1916","En vecka av artilleri",

   D("Somme",2.69,50.0,"1 juli 1916, kl. 07:30","Den första dagen",

   D("Flers",2.82,50.06,"15 september 1916","Stridsvagnen",
    ["Britterna sätter in ett hemligt vapen: stridsvagnen. För att hålla den hemlig kallades den tank, som en vattentank.","Av 49 stridsvagnar kommer bara ett fåtal fram. Resten går sönder eller fastnar. Men tyska soldater blir skräckslagna."],

   D("Vaux-sur-Somme",2.55,49.93,"1916–1918","Kriget i luften",
    ["Flygplanen är nya. Först används de för att spana, sedan för luftstrider och för att fälla bomber.","Den tyske piloten Manfred von Richthofen, Röde baronen, skjuter ner 80 plan. Han skjuts ner och dör vid Somme i april 1918."],
    "Vad användes flygplanen främst till i början av kriget?",["Spaning","Transport av turister","Att släppa atombomber"],0,"Tyskland använde också zeppelinare, stora luftskepp, för att bomba London.") ],
 [ D("Wilhelmshaven",8.12,53.52,"1 februari 1917","Oinskränkt ubåtskrig",

    "Vad betyder oinskränkt ubåtskrig?",["Alla fartyg sänks utan förvarning","Bara krigsfartyg sänks","Ubåtarna får inte skjuta"],0,"Många svenska fartyg och sjömän gick också förlorade under kriget.",300),
   D("Mexico City",-99.13,19.43,"Januari 1917","Zimmermanntelegrammet",
    ["Tysklands utrikesminister Zimmermann skickar ett hemligt meddelande till Mexiko. Om Mexiko anfaller USA ska landet få tillbaka Texas, New Mexico och Arizona.","Britterna knäcker koden. Tyskland skickade ibland hemliga meddelanden via Sveriges diplomatiska telegraflinjer, något britterna kände till."],

   D("Saint-Nazaire",-2.2,47.27,"Juni 1917–1918","Amerikanerna kommer",

 [ D("Malmö",13.0,55.6,"18–19 december 1914","Trekungamötet",

/* ---------- projection & map data ---------- */
const R=Math.PI/180, S=170;
function proj(lon,lat){
  const l=lon*R, p=lat*R, p2=p*p, p4=p2*p2;
  const x=l*(0.8707-0.131979*p2+p4*(-0.013791+p4*(0.003971*p2-0.001529*p4)));
  const y=p*(1.007226+p2*(0.015085+p4*(-0.044475+0.028874*p2-0.005916*p4)));
  return [x*S,-y*S];
}
const NSV="http://www.w3.org/2000/svg";
const svg=document.getElementById("svg"), land=document.getElementById("land");
const pathOf=pts=>"M"+pts.map(([a,b])=>{const [x,y]=proj(a,b);return x.toFixed(1)+" "+y.toFixed(1)}).join("L")+"Z";
const ringPath=pts=>{
  const out=[pts[0].slice()];let mn=pts[0][0],mx=pts[0][0];
  for(let i=1;i<pts.length;i++){let lon=pts[i][0];const prev=out[i-1][0];while(lon-prev>180)lon-=360;while(lon-prev<-180)lon+=360;out.push([lon,pts[i][1]]);mn=Math.min(mn,lon);mx=Math.max(mx,lon);}
  let d=pathOf(out);
  if(mx>180)d+=pathOf(out.map(([a,b])=>[a-360,b]));
  if(mn<-180)d+=pathOf(out.map(([a,b])=>[a+360,b]));
  return d;
};
function drawGrat(){
  let d="";
  for(let lon=-180;lon<=180;lon+=20){const pts=[];for(let lat=-80;lat<=80;lat+=4)pts.push(proj(lon,lat));d+="M"+pts.map(p=>p.map(v=>v.toFixed(1)).join(" ")).join("L");}
  for(let lat=-60;lat<=80;lat+=20){const pts=[];for(let lon=-180;lon<=180;lon+=4)pts.push(proj(lon,lat));d+="M"+pts.map(p=>p.map(v=>v.toFixed(1)).join(" ")).join("L");}
  document.getElementById("grat").innerHTML=`<path class="grat" d="${d}"/>`;
}
function drawLand(){
  const topo=window.Datamap&&Datamap.prototype.worldTopo;
  if(!topo||!topo.objects){ land.innerHTML=""; return false; }
  const tf=topo.transform;
  const arcs=topo.arcs.map(a=>{let x=0,y=0;return a.map(p=>{if(tf){x+=p[0];y+=p[1];return [x*tf.scale[0]+tf.translate[0],y*tf.scale[1]+tf.translate[1]];}return p;});});
  const ring=idx=>{const out=[];idx.forEach((i,j)=>{let a=i<0?arcs[~i].slice().reverse():arcs[i];if(j>0)a=a.slice(1);out.push(...a);});return out;};
  const obj=topo.objects.world||topo.objects[Object.keys(topo.objects)[0]];
  let html="";
  obj.geometries.forEach(g=>{
    if(g.id==="ATA"||!g.arcs) return;
    const polys=g.type==="Polygon"?[g.arcs]:g.type==="MultiPolygon"?g.arcs:[];
    const d=polys.map(poly=>poly.map(r=>ringPath(ring(r))).join("")).join("");
    html+=`<path class="country${g.id==="SWE"?" swe":""}" data-id="${g.id}" d="${d}" fill-rule="evenodd"/>`;
  });
  land.innerHTML=html; return true;
}

/* ---------- camera ---------- */
const FULL={x:0,y:-10,w:2*Math.PI*0.8707*S*1.02};
let cam={...FULL};
function box(){const r=svg.getBoundingClientRect();return {W:Math.max(r.width,1),H:Math.max(r.height,1)}}
function focusFrac(){return innerWidth>=860?0.5:0.5}
function apply(){
  const {W,H}=box(), w=cam.w, h=w*H/W;
  svg.setAttribute("viewBox",`${cam.x-w/2} ${cam.y-h*0.55} ${w} ${h}`);
  const k=w/W;
  marks.childNodes.forEach(g=>{const e=EV[g.dataset.i];g.setAttribute("transform",`translate(${e.px} ${e.py}) scale(${k})`);});
  labels.childNodes.forEach(g=>g.setAttribute("transform",`translate(${g.dataset.x} ${g.dataset.y}) scale(${k})`));
  document.querySelectorAll("#subs > g").forEach(g=>g.setAttribute("transform",`translate(${g.dataset.x} ${g.dataset.y}) scale(${k})`));
}
let raf=null;
function fly(to,done){
  const from={...cam}, dx=to.x-from.x, dy=to.y-from.y, dist=Math.hypot(dx,dy);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur=reduce?1:Math.min(3400,1300+dist*2.2), t0=performance.now();
  const lift=Math.max(0,dist*1.15-(from.w+to.w)/2);
  cancelAnimationFrame(raf);
  const step=now=>{
    const t=Math.min(1,(now-t0)/dur), e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    cam={x:from.x+dx*e,y:from.y+dy*e,w:from.w+(to.w-from.w)*e+lift*Math.sin(Math.PI*e)};
    apply();
    if(t<1) raf=requestAnimationFrame(step); else done&&done();
  };
  raf=requestAnimationFrame(step);
}

function ground(g,sk){

    case "fjord": sea(); break;
    case "river": land(dark(GC.field),dark("#4f5a32")); b.mid+=`<path d="M-300 ${H+22}Q600 ${H+10} 1900 ${H+28}L1900 ${H+50}Q600 ${H+40} -300 ${H+48}Z" fill="#45626b"/>`; break;

/* ---------- game ---------- */
let mode="light", cur=-1, sub=-1, moving=false;
const done=EV.map(()=>false);
let subDone=DEEP.map(a=>a.map(()=>false));
let firstTry={}, asked=0;
const SAVE_KEY="pluggis-sim-ww1-v1";
function saveSim(){try{
  const okE=[],okS=[];
  EV.forEach((e,i)=>{if(e._ok)okE.push(i);});
  DEEP.forEach((a,i)=>a.forEach((s,j)=>{if(s._ok)okS.push([i,j]);}));
  localStorage.setItem(SAVE_KEY,JSON.stringify({mode,cur,sub,done,subDone,firstTry,asked,okE,okS}));}catch(e){}}
function loadSim(){try{
  const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
  if(!d||!(d.cur>=0)||d.cur>=EV.length||!Array.isArray(d.done)||d.done.length!==EV.length) return null;
  return d;}catch(e){return null;}}
function clearSim(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function restoreSim(d){
  mode=d.mode==="deep"?"deep":"light";
  d.done.forEach((v,i)=>{done[i]=!!v;});
  if(Array.isArray(d.subDone)&&d.subDone.length===DEEP.length) subDone=d.subDone;
  firstTry=d.firstTry||{}; asked=d.asked||0;
  (d.okE||[]).forEach(i=>{if(EV[i])EV[i]._ok=true;});
  (d.okS||[]).forEach(p=>{if(DEEP[p[0]]&&DEEP[p[0]][p[1]])DEEP[p[0]][p[1]]._ok=true;});
}

const dock=document.getElementById("dock"), clock=document.getElementById("clock"), route=document.getElementById("route");
const subsG=document.getElementById("subs");
const L="ABCD";
const stage=document.getElementById("stage"),stageArt=document.getElementById("stageArt"),stageCap=document.getElementById("stageCap"),mapBtn=document.getElementById("mapBtn"),mapEl=document.getElementById("map");
let stageTimer=null;
function showScene(key,cap,date){
  const spec=SC[key]; if(!spec){hideScene();return;}
  clearTimeout(stageTimer);
  stageArt.innerHTML=sceneSVG(spec,key.split("_").reduce((a,b)=>a*31+(+b)+7,11));
  stageCap.innerHTML=`<small>${date}</small>${cap}`;
  stage.hidden=false; stage.classList.remove("peek"); mapBtn.textContent="Visa kartan"; mapEl.classList.add("scene-on");
  requestAnimationFrame(()=>requestAnimationFrame(()=>stage.classList.add("in")));
}
function hideScene(){
  stage.classList.remove("in"); mapEl.classList.remove("scene-on");
  stageTimer=setTimeout(()=>{stage.hidden=true;stageArt.innerHTML="";},900);
}
mapBtn.onclick=()=>{const p=stage.classList.toggle("peek");mapBtn.textContent=p?"Visa platsen":"Visa kartan";mapEl.classList.toggle("scene-on",!p);};

function drawSubs(){
  subsG.innerHTML="";
  if(mode!=="deep"||cur<0||cur>=EV.length) return;
  DEEP[cur].forEach((s,j)=>{const [x,y]=proj(s.lon,s.lat);s.px=x;s.py=y;
    const g=document.createElementNS(NSV,"g");g.dataset.x=x;g.dataset.y=y;
    g.setAttribute("class","mk sub"+(subDone[cur][j]?" done":"")+(j===sub?" now":""));
    g.innerHTML=`<circle class="pulse" r="9"/><circle class="ring" r="9"/><text text-anchor="middle" y="4" style="font-size:12px">${L[j]}</text>`;
    subsG.appendChild(g);});
}
function refresh(){
  marks.childNodes.forEach(g=>{const i=+g.dataset.i;g.setAttribute("class","mk"+(done[i]?" done":"")+(i===cur&&sub<0?" now":"")+(i===cur&&sub>=0?" open":""));});
  const hl=cur>=0&&cur<EV.length?EV[cur].hl:[];
  land.querySelectorAll(".country").forEach(p=>p.classList.toggle("hl",hl.includes(p.dataset.id)));
  const reached=EV.filter((e,i)=>i<=cur||done[i]);
  route.setAttribute("d",reached.length>1?"M"+reached.map(e=>e.px.toFixed(1)+" "+e.py.toFixed(1)).join("L"):"");
  const y=cur>=EV.length?Y1:cur>=0?EV[cur].y:Y0;
  tlfill.style.width=(frac(y)*100)+"%";
  drawSubs(); apply();
}
function target(e){return {x:e.px,y:e.py,w:e.zoom}}
function intro(){
  cur=-1; sub=-1; hideScene(); refresh(); labels.innerHTML="";
  dock.innerHTML=`<article class="card">
    <div class="stamp"><span>Uppdrag · 1914–1918</span><b>Kartrummet</b></div>
    <h2>Första världskriget, steg för steg</h2>
    <p>Du följer kriget från skotten i Sarajevo till freden i Versailles. Kartan flyger till varje händelse i tidsordning.</p>
    <p>Välj hur du vill spela:</p>
    <div class="modes">
      <button class="mode" id="mLight"><b>Lättläst</b><span>${EV.length} händelser, en kort rapport och en fråga vid varje. Ca 20 minuter.</span></button>
      <button class="mode" id="mDeep"><b>Fördjupning</b><span>Varje händelse delas upp i 3–4 delstopp med egna rapporter och frågor. Ca 60 minuter.</span></button>
    </div>
    ${hasLand?"":`<p class="note">Kartbilden kunde inte laddas, men spelet fungerar ändå.</p>`}
  </article>`;
  const sv=loadSim();
  if(sv){
    const r=document.createElement("div"); r.className="resume";
    r.innerHTML=`<p class="note">Du har ett påbörjat uppdrag (${sv.mode==="deep"?"Fördjupning":"Lättläst"}, händelse ${sv.cur+1} av ${EV.length}).</p><p><button class="go ready" type="button" id="mResume">Fortsätt där du var →</button></p><p class="note">Eller börja om genom att välja nedan.</p>`;
    dock.querySelector(".modes").before(r);
    document.getElementById("mResume").onclick=()=>{restoreSim(sv);cur=sv.cur;sub=sv.sub;if(sub>=0&&DEEP[cur]&&DEEP[cur][sub])goSub(sub);else goTo(cur);};
  }
  document.getElementById("mLight").onclick=()=>{clearSim();mode="light";goTo(0);};
  document.getElementById("mDeep").onclick=()=>{clearSim();mode="deep";goTo(0);};
}
function flying(stamp,title){
  dock.innerHTML=`<article class="card"><div class="stamp"><span>På väg</span><b>${stamp}</b></div><h2>${title}</h2><p>Kartan flyger dit…</p></article>`;
}
function goTo(i){
  moving=true; cur=i; sub=-1; saveSim(); hideScene(); refresh(); labels.innerHTML="";
  const e=EV[i]; flying(e.d,e.place);
  fly(target(e),()=>{moving=false;setLabels(e);apply();render();});
}
function goSub(j){
  moving=true; sub=j; saveSim(); hideScene(); refresh(); labels.innerHTML="";
  const s=DEEP[cur][j]; flying(s.d,s.place);
  setTimeout(()=>fly({x:s.px,y:s.py,w:s.z||EV[cur].zoom*0.6},()=>{setLabels({place:s.place,lon:s.lon,lat:s.lat});apply();
    fly({x:s.px,y:s.py,w:(s.z||EV[cur].zoom*0.6)*0.35},()=>{moving=false;showScene(cur+"_"+j,s.place,s.d);render();});}),stage.hidden?0:500);
}
function quizHTML(item,key){
  const solved=firstTry[key]!==undefined&&item._ok;
  return `<div class="quiz"><p class="q">${item.q}</p><div class="opts">${item.opts.map((o,k)=>`<button class="opt ${solved&&k===item.ok?"right":""}" data-k="${k}" ${solved?"disabled":""}>${o}</button>`).join("")}</div>
    <p class="fb ${solved?"ok":""}" id="fb">${solved?`<b>Rätt!</b> ${item.why}`:""}</p></div>`;
}
function render(){
  const i=cur, e=EV[i];
  const dd=`<p><a href="${DDAY_URL}" target="_blank" rel="noopener">Spela Dagen D-uppdraget →</a></p>`;
  if(mode==="light"){
    clock.innerHTML=`<small>${e.place}</small>${e.d}`;
    const solved=done[i];
    dock.innerHTML=`<article class="card">
      <div class="stamp"><span>${e.d} · ${e.place}</span><b>Händelse ${i+1}/${EV.length}</b></div>
      <h2>${e.title}</h2>${e.facts.map(f=>`<p>${f}</p>`).join("")}${e.dday?dd:""}
      ${quizHTML(e,"e"+i)}
      <div class="foot"><span>${Math.floor(e.y)}</span><button class="go ${solved?"ready":""}" id="next" ${solved?"":"disabled"}>${i<EV.length-1?"Nästa händelse →":"Krigets slut →"}</button></div>
    </article>`;
    wire(e,"e"+i,()=>{done[i]=true;});
  } else if(sub<0){
    clock.innerHTML=`<small>${e.place}</small>${e.d}`;
    const parts=DEEP[i];
    dock.innerHTML=`<article class="card">
      <div class="stamp"><span>${e.d}</span><b>Händelse ${i+1}/${EV.length}</b></div>
      <h2>${e.title}</h2><p>${e.facts[0]}</p>
      <p class="note">Händelsen har ${parts.length} delstopp: ${parts.map((p,j)=>`<b>${L[j]}</b> ${p.place}`).join(", ")}.</p>
      <div class="foot"><span>Fördjupning</span><button class="go ready" id="next">Gå in i händelsen →</button></div>
    </article>`;
    document.getElementById("next").onclick=()=>{if(!moving)goSub(0);};
  } else {
    const s=DEEP[i][sub], n=DEEP[i].length, last=sub===n-1;
    clock.innerHTML=`<small>${s.place}</small>${s.d}`;
    const solved=subDone[i][sub];
    dock.innerHTML=`<article class="card">
      <div class="stamp"><span>${s.d} · ${s.place}</span><b>${i+1}${L[sub]} · ${e.title}</b></div>
      <h2>${s.title}</h2>${s.facts.map(f=>`<p>${f}</p>`).join("")}${e.dday&&s.place==="Omaha Beach"?dd:""}
      ${quizHTML(s,"s"+i+"_"+sub)}
      <div class="foot"><span>Delstopp ${sub+1} av ${n}</span><button class="go ${solved?"ready":""}" id="next" ${solved?"":"disabled"}>${last?(i<EV.length-1?"Nästa händelse →":"Krigets slut →"):"Nästa delstopp →"}</button></div>
    </article>`;
    wire(s,"s"+i+"_"+sub,()=>{subDone[i][sub]=true;if(subDone[i].every(Boolean))done[i]=true;});
  }
  dock.scrollTop=0;
}
function wire(item,key,onOk){
  dock.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k, fb=document.getElementById("fb");
    if(firstTry[key]===undefined){firstTry[key]=(k===item.ok);asked++;saveSim();}
    if(k===item.ok){
      onOk(); item._ok=true; saveSim(); refresh();
      dock.querySelectorAll(".opt").forEach(x=>x.disabled=true); b.classList.add("right");
      fb.className="fb ok"; fb.innerHTML=`<b>Rätt!</b> ${item.why}`;
      const n=document.getElementById("next"); n.disabled=false; n.classList.add("ready"); n.focus({preventScroll:true});
    } else {
      b.classList.add("wrong"); b.disabled=true;
      fb.className="fb no"; fb.innerHTML=`<b>Inte riktigt.</b> Läs rapporten igen och försök på nytt.`;
    }
  });
  document.getElementById("next").onclick=next;
}
function next(){
  if(moving||cur<0||cur>=EV.length) return;
  if(mode==="deep"){
    if(sub<0){goSub(0);return;}
    if(!subDone[cur][sub]) return;
    if(sub<DEEP[cur].length-1){goSub(sub+1);return;}
  } else if(!done[cur]) return;
  if(cur<EV.length-1) goTo(cur+1); else finish();
}
function finish(){
  clearSim(); moving=true; cur=EV.length; sub=-1; hideScene(); refresh(); labels.innerHTML="";
  clock.innerHTML=`<small>Första världskriget</small>1914–1918`;
  fly({...FULL},()=>{
    moving=false;
    const score=Object.values(firstTry).filter(Boolean).length;
    dock.innerHTML=`<article class="card">
      <div class="stamp"><span>1919</span><b>Slutrapport</b></div>
      <h2>${END.title}</h2>${END.facts.map(f=>`<p>${f}</p>`).join("")}
      <p class="discuss">${END.discuss}</p>
      <div class="foot"><span class="score">${score} av ${asked} rätt på första försöket</span><button class="go" id="again">Spela igen</button></div>
    </article>`;
    document.getElementById("again").onclick=()=>{
      done.fill(false); subDone=DEEP.map(a=>a.map(()=>false)); firstTry={}; asked=0;
      EV.forEach(e=>delete e._ok); DEEP.flat().forEach(s=>delete s._ok); intro();};
  });
}
addEventListener("keydown",e=>{if(e.key==="ArrowRight")next();});

apply(); intro();
</script>
